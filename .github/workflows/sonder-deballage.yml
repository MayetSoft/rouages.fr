name: Sonder le déballage

# Le déploiement par archives dépend d'un script PHP appelé en HTTPS derrière
# Cloudflare. Quand il échoue, le déploiement retombe sur le miroir — trois
# heures et demie — et on ne l'apprend qu'à la fin. Ce workflow ne fait que la
# partie qui peut échouer : déposer le script, l'appeler sans jeton puis avec,
# l'effacer. Une minute, sans rien construire ni toucher au site.

on:
  workflow_dispatch:

# Sa propre file, pas celle des déploiements : dans celle-là, la sonde
# attendait la fin d'un déploiement de trois heures, et le suivant l'annulait
# en se mettant en attente — c'est arrivé le 30 septembre. Elle ne touche à
# aucun fichier du site : son script porte un nom tiré au hasard et s'efface.
concurrency:
  group: sonde-deballage
  cancel-in-progress: false

jobs:
  sonder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Sonder
        env:
          HOTE: ${{ secrets.FTP_HOTE }}
          UTILISATEUR: ${{ secrets.FTP_UTILISATEUR }}
          MOTDEPASSE: ${{ secrets.FTP_MOTDEPASSE }}
          RACINE: ${{ secrets.FTP_RACINE }}
          DEPLOI_JETON: ${{ secrets.DEPLOI_JETON }}
          SITE_URL: ${{ vars.SITE_URL || 'https://rouages.fr' }}
        run: |
          set -euo pipefail
          : "${RACINE:=public_html}"
          export RACINE
          # Les mêmes réglages que le déploiement.
          export REGLAGES="set ftp:ssl-force true;
                    set ftp:ssl-protect-data true;
                    set ssl:verify-certificate true;
                    set net:max-retries 8;
                    set net:reconnect-interval-base 5;
                    set net:reconnect-interval-multiplier 2;
                    set net:timeout 30;"
          npx tsx scripts/deploiement/envoyer-archives.ts --sonde
