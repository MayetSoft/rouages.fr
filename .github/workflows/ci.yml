name: Contrôle du contenu et build

# Sur les pull requests seulement, plus la passe hebdomadaire. Un push sur
# une branche ouverte en PR lançait deux fois le même contrôle, et un push
# sur main le refait alors que le déploiement construit déjà tout.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Une fois par semaine : signale les fiches qui ont dépassé leur date de
    # revérification, et les liens de sources devenus morts.
    - cron: '0 6 * * 1'

jobs:
  controler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Structure, références et règles éditoriales
        run: npm run valider
      - name: Classement de la recherche de communes
        run: npm run verifier-recherche
      - name: Fenêtre et plafonds du journal
        run: npm run verifier-journal
      - name: Rattachement des annonces du BODACC
        run: npm run verifier-rattachement
      - name: Types
        run: npm run verifier-types
      # Quatre départements plutôt que 34 875 pages : le build complet prend
      # six minutes et se refait de toute façon au déploiement. L'Allier pour
      # la commune de référence, le Finistère pour Quimper, Paris pour la plus
      # grosse page, la Meuse pour ses six villages détruits en 1914-1918,
      # sans habitants : deux déploiements ont échoué sur l'un d'eux, que le
      # contrôle ne construisait pas.
      - name: Build
        run: npx astro build
        env:
          ROUAGES_DEPS: '03,29,55,75'

  fraicheur:
    # Contrôle non bloquant sur les branches : une fiche périmée n'empêche pas
    # de travailler, mais on veut le savoir chaque semaine.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fiches à revérifier et liens morts
        run: npm run fraicheur -- --liens
