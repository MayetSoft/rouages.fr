name: Déploiement

# Le site est statique : déployer, c'est copier `dist/` à la racine du serveur.
# Trois choses méritent d'être sues avant de lire le reste.
#
# 1. Cloudflare ne relaie que HTTP et HTTPS. Le FTP doit donc viser le serveur
#    directement — le nom de machine o2switch, ou un enregistrement DNS laissé
#    en « DNS only » (nuage gris). Viser le domaine proxifié ne marchera pas,
#    et l'erreur ne dira pas pourquoi.
# 2. FTPS explicite, jamais FTP simple : autrement le mot de passe du compte
#    d'hébergement traverse le réseau en clair à chaque publication.
# 3. Cloudflare met le HTML en cache. Sans purge, la mise en ligne est
#    invisible pendant des heures. Les fichiers de `_astro/` n'ont plus
#    d'empreinte dans leur nom (voir `integrations/noms-fixes.mjs`) : la purge
#    vaut donc pour eux aussi.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulation:
        description: "Simuler sans rien écrire sur le serveur"
        type: boolean
        default: false
      complet:
        description: "Tout renvoyer, sans se fier au manifeste du serveur"
        type: boolean
        default: false

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  deployer:
    # Seule la branche par défaut est publiée, quel que soit son nom.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # `npm run publier` valide le contenu avant de générer : un réseau
      # incohérent ne peut pas être mis en ligne. Il exige en outre les
      # mentions légales, que l'article 6 de la loi pour la confiance dans
      # l'économie numérique impose à tout site accessible au public — c'est
      # ici, et pas au moment d'écrire une fiche, que l'obligation naît.
      - name: Construire
        run: npm run publier

      - name: Vérifier que le serveur est configuré
        id: config
        env:
          HOTE: ${{ secrets.FTP_HOTE }}
        run: |
          if [ -z "$HOTE" ]; then
            echo "::notice::FTP_HOTE n'est pas défini : rien à déployer. Voir docs/06-stack-technique.md."
            echo "pret=non" >> "$GITHUB_OUTPUT"
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer lftp
        if: steps.config.outputs.pret == 'oui'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Publier
        if: steps.config.outputs.pret == 'oui'
        env:
          HOTE: ${{ secrets.FTP_HOTE }}
          UTILISATEUR: ${{ secrets.FTP_UTILISATEUR }}
          MOTDEPASSE: ${{ secrets.FTP_MOTDEPASSE }}
          RACINE: ${{ secrets.FTP_RACINE }}
          SIMULATION: ${{ inputs.simulation }}
          COMPLET: ${{ inputs.complet }}
        run: |
          set -euo pipefail
          debut=$(date +%s)
          : "${RACINE:=public_html}"

          # Le chiffrement n'est pas négociable, et le certificat est vérifié :
          # un FTPS qui accepte n'importe quel certificat ne protège de rien.
          #
          # Chaque fichier part sous un nom temporaire, renommé une fois reçu
          # en entier. Sans cela, lftp efface la page en ligne avant d'envoyer
          # la nouvelle, et une connexion coupée en route laisse une page
          # tronquée : Paris et Lyon ont été servies coupées net, à 560 et
          # 192 Kio — des multiples exacts de 16 Kio, la taille d'un
          # enregistrement TLS —, après deux déploiements qui avaient échoué
          # sur elles. Les nouvelles tentatives sont espacées : les trois
          # d'avant tombaient en huit secondes, contre le même incident.
          reglages="set ftp:ssl-force true;
                    set ftp:ssl-protect-data true;
                    set ssl:verify-certificate true;
                    set xfer:use-temp-file true;
                    set net:max-retries 8;
                    set net:reconnect-interval-base 5;
                    set net:reconnect-interval-multiplier 2;
                    set net:timeout 30;"

          # `--delete` est ce qui garde le serveur propre : sans lui, une page
          # supprimée du réseau resterait en ligne indéfiniment. C'est aussi
          # une commande destructrice si RACINE désigne le mauvais dossier.
          # Le marqueur, déposé au premier envoi, prouve que le dossier visé
          # est bien celui de ce site avant qu'on autorise la suppression.
          if lftp -c "$reglages open -u \"$UTILISATEUR\",\"$MOTDEPASSE\" \"$HOTE\";
                      cd \"$RACINE\"; ls .rouages" >/dev/null 2>&1; then
            effacer="--delete"
          else
            echo "::warning::marqueur .rouages absent de $RACINE — premier envoi, rien ne sera supprimé à distance."
            effacer=""
          fi

          if [ "${SIMULATION:-false}" = "true" ]; then
            echo "::notice::simulation — aucune écriture."
            simuler="--dry-run"
          else
            simuler=""
          fi

          # Ce qui est parti la dernière fois, et ce qui partirait maintenant.
          # `mirror` seul comparait taille et date ; sur une machine neuve, tout
          # est daté du jour, et les 77 000 fichiers repartaient à chaque
          # publication — quatre heures, et deux échecs de suite. Le manifeste
          # du dernier envoi réussi dit ce qui a réellement changé. Voir
          # `scripts/manifeste.ts`.
          travail="$GITHUB_WORKSPACE/.deploiement"
          rm -rf "$travail" && mkdir -p "$travail"
          npx tsx scripts/manifeste.ts ecrire dist "$travail/nouveau"

          if [ "${COMPLET:-false}" != "true" ] && lftp -c "$reglages open -u \"$UTILISATEUR\",\"$MOTDEPASSE\" \"$HOTE\";
                      get \"$RACINE/.manifeste\" -o \"$travail/ancien\"" >/dev/null 2>&1 \
             && [ -s "$travail/ancien" ]; then
            echo "::notice::manifeste trouvé sur le serveur — seuls les fichiers modifiés partent."
            npx tsx scripts/manifeste.ts comparer "$travail/ancien" "$travail/nouveau" dist \
              "$travail/envoi" "$travail/effacer"
            if [ -d "$travail/envoi" ]; then
              # Une seconde passe si la première échoue. Sur trente-cinq mille
              # fichiers, le serveur en laisse tomber un ou deux — le #91 a
              # perdu Paris et Noisy-le-Grand après trois heures d'envoi, sans
              # manifeste déposé ni cache purgé. La reprise compare les seules
              # tailles : ce qui est arrivé entier est sauté, ce qui manque ou
              # a été tronqué repart. Seul angle mort : un fichier raté dont
              # l'ancienne version avait la même taille à l'octet près — il
              # repartira à sa prochaine modification. Un second échec, lui,
              # arrête l'étape.
              envoyer() {
                lftp -c "$reglages
                         open -u \"$UTILISATEUR\",\"$MOTDEPASSE\" \"$HOTE\";
                         mirror --reverse --verbose=1 $1 $simuler \
                                \"$2/\" \"$RACINE\""
              }
              # Par lots de quatre mille — un quart d'heure chacun —, et le
              # manifeste de ce qui est en ligne déposé après chaque lot.
              # GitHub arrête un job au bout de six heures : le #100, avec
              # soixante-huit mille fichiers, y est arrivé sans avoir déposé
              # de manifeste, et le suivant aurait tout renvoyé. Ici, passé
              # cinq heures dix, on ne commence plus de lot : l'étape s'arrête
              # proprement, et le déploiement suivant reprend au lot d'après.
              npx tsx scripts/manifeste.ts lots "$travail/ancien" "$travail/nouveau" \
                "$travail/envoi" 4000 "$travail/lots"
              for lot in "$travail"/lots/lot-*/; do
                lot="${lot%/}"
                if [ $(( $(date +%s) - debut )) -gt 18600 ]; then
                  incomplet=oui
                  break
                fi
                echo "Lot ${lot##*/} ($(find "$lot" -type f | wc -l) fichiers)."
                if ! envoyer "--parallel=8" "$lot"; then
                  echo "::warning::des fichiers de ${lot##*/} n'ont pas été reçus — seconde passe sur ceux-là."
                  envoyer "--parallel=2 --ignore-time" "$lot"
                fi
                if [ -z "$simuler" ]; then
                  lftp -c "$reglages
                           open -u \"$UTILISATEUR\",\"$MOTDEPASSE\" \"$HOTE\";
                           put \"$lot.manifeste\" -o \"$RACINE/.manifeste\""
                fi
              done
            fi
            if [ -n "${incomplet:-}" ]; then
              echo "::error::envoi incomplet, arrêté avant la limite de six heures ; le manifeste déposé dit ce qui est en ligne. Relancer le déploiement : il reprendra là où celui-ci s'est arrêté."
              exit 1
            fi
            # Effacer suppose le marqueur, comme `--delete` plus bas : la liste
            # vient du manifeste, mais c'est RACINE qui décide où elle s'applique.
            if [ -s "$travail/effacer" ] && [ -n "$effacer" ] && [ -z "$simuler" ]; then
              lftp -c "$reglages
                       open -u \"$UTILISATEUR\",\"$MOTDEPASSE\" \"$HOTE\";
                       cd \"$RACINE\"; source \"$travail/effacer\""
            fi
          else
            # Pas de manifeste sur le serveur — premier envoi de ce mode, ou
            # envoi complet demandé. On compare alors par la taille seule
            # (`--ignore-time`) : un fichier de même taille est tenu pour
            # identique. C'est vrai des flux et des données, que rien ne
            # modifie entre deux ingestions ; une page dont le contenu change
            # change presque toujours de taille, et le manifeste déposé à la fin
            # rend ce pari inutile dès l'envoi suivant. L'option « complet »
            # revient à la comparaison d'avant, taille et date : sur une machine
            # d'intégration neuve, où tout est daté du jour, c'est tout renvoyer.
            if [ "${COMPLET:-false}" = "true" ]; then comparer=""; else comparer="--ignore-time"; fi
            echo "::notice::pas de manifeste utilisable — envoi par comparaison${comparer:+ de taille}."

            #
            # Le parallélisme reste à 8 : c'est le nombre de fichiers qui domine
            # la durée en FTP, chacun coûtant une connexion de données, et
            # au-delà un hébergement mutualisé limite le compte. Les flux sont
            # nommés `03165-flux.xml` et non `03165/flux.xml` pour la même
            # raison : trente-trois mille créations de répertoire de moins.
            #
            # Les exclusions protègent ce qui appartient à l'hébergement et non
            # au site. `.ftpquota` est tenu par le serveur FTP, qui refuse qu'on
            # l'efface : `--delete` s'y cassait les dents en toute fin d'envoi,
            # après que chaque page était partie — c'est ce qui a fait échouer
            # trois déploiements de suite, sans rien dire avant la dernière
            # ligne. `.well-known/` sert au renouvellement du certificat,
            # `cgi-bin/` est créé par cPanel.
            lftp -c "$reglages
                     open -u \"$UTILISATEUR\",\"$MOTDEPASSE\" \"$HOTE\";
                     mirror --reverse --verbose=1 --parallel=8 $comparer \
                            --exclude '^\\.manifeste$' --exclude '^\\.ftpquota$' \
                            --exclude '^\\.well-known/' --exclude '^cgi-bin/' \
                            $effacer $simuler \
                            dist/ \"$RACINE\""
          fi

          # En dernier, et seulement si tout ce qui précède a réussi — `set -e`
          # arrête l'étape à la première erreur : un envoi interrompu laisse
          # l'ancien manifeste en place, et le suivant renverra ce qui manque.
          if [ -z "$simuler" ]; then
            lftp -c "$reglages
                     open -u \"$UTILISATEUR\",\"$MOTDEPASSE\" \"$HOTE\";
                     put \"$travail/nouveau\" -o \"$RACINE/.manifeste\""
          fi

      # Sans purge, Cloudflare continue de servir l'ancien HTML. Les secrets
      # sont facultatifs : sans eux, on le dit plutôt que d'échouer.
      - name: Purger le cache Cloudflare
        if: steps.config.outputs.pret == 'oui' && inputs.simulation != true
        env:
          ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          JETON: ${{ secrets.CLOUDFLARE_JETON }}
        run: |
          set -euo pipefail
          if [ -z "$ZONE" ] || [ -z "$JETON" ]; then
            echo "::warning::CLOUDFLARE_ZONE/CLOUDFLARE_JETON absents : le cache n'est pas purgé, la mise en ligne mettra du temps à être visible."
            exit 0
          fi
          reponse=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $JETON" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if [ "$(echo "$reponse" | jq -r '.success')" != "true" ]; then
            echo "::error::purge refusée : $(echo "$reponse" | jq -c '.errors')"
            exit 1
          fi
          echo "Cache purgé."
