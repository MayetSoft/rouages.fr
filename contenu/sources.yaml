  # Compatibilité, et non conformité : la nuance n'est pas de vocabulaire. Un
  # PLU peut s'écarter du SCoT tant qu'il n'en remet pas en cause les
  # orientations générales — c'est ce que contrôle le juge administratif.
  # Le critère est la population, pas l'absence de document d'urbanisme : une
  # commune dotée d'un PLU peut demander l'instruction gratuite, une grande
  # commune au règlement national ne le peut pas.
  - { id: cu-l422-8, type: droit, titre: "Code de l'urbanisme, art. L422-8 — mise à disposition gratuite des services de l'État sous 10 000 habitants", url: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000028810360", consulte_le: 2026-09-22 }
