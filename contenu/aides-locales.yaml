- id: spsl-logements-vacants
  porteur:
    nom: Communauté de communes Saint-Pourçain Sioule Limagne
    siren: "200071389"
    niveau: epci
    code: "200071389"
  intitule: Prime à la mise en location d’un logement vacant depuis plus de deux ans
  travaux:
  - vacance
  beneficiaires:
  - proprietaire-bailleur
  ressources: null
  perimetre:
    communes: null
    precision: 'Règlement 2026, p. 2 : « Le bâtiment doit être situé sur le territoire de la communauté de communes Saint-Pourçain Sioule Limagne, soit au sein d’une des 60 communes suivantes » (liste des 60 communes donnée p. 2).'
  montant: Prime forfaitaire de 5 000 € par logement loué, dans la limite de 3 logements par propriétaire et par an.
  conditions:
  - texte: Montant
    citation: Prime forfaitaire de 5000 € par logement loué. Dans la limite de 3 logements subventionnables par propriétaire et par an. » (p. 3)
    source: 1
  - texte: Bailleurs privés, logement de plus de 15 ans vacant depuis plus de 2 ans au dépôt
    citation: Peuvent être bénéficiaires de l’aide les propriétaires bailleurs privés, qui mettent en location un logement construit depuis plus de 15 ans qui était vacant depuis plus de 2 ans à la date de dépôt de la demande. » (p. 3)
    source: 1
  - texte: Exclusions
    citation: Les projets de logements locatifs à vocation touristique ne sont pas éligibles à cette aide. Les bailleurs publics ne sont pas éligibles à cette aide. » (p. 3)
    source: 1
  - texte: Location en résidence principale pendant au moins 6 ans
    citation: Le bailleur s’engage à louer ce logement en tant que résidence principale pendant au moins 6 ans. » (p. 3)
    source: 1
  - texte: DPE entre A et E à la mise en location
    citation: La classe énergétique du logement devra être entre A et E lors de sa mise en location d’après le diagnostic de performance énergétique (DPE). » (p. 3)
    source: 1
  - texte: Remboursement au prorata si l’engagement de 6 ans n’est pas tenu
    citation: Si cet engagement n’est plus respecté avant la fin du délai de 6 ans, alors un remboursement de la prime sera demandé par la Communauté de Communes au prorata de la durée manquante pour atteindre ces 6 ans. » (p. 4)
    source: 1
  - texte: Versement après visite du logement
    citation: La prime est versée après visite du logement par le service habitat. » (p. 4)
    source: 1
  - texte: Attribution après examen par la commission habitat, dans l’ordre d’arrivée des dossiers complets, et dans la limite d’une enveloppe annuelle
    citation: Les dossiers de demande sont traités selon l’ordre chronologique de leur arrivée complet à la Communauté de Communes. » (p. 2) ; « L’enveloppe budgétaire réservée pour le financement de ces aides est révisée chaque année en fonction de la consommation du budget de l’année précédente et des résultats obtenus. » (p. 2)
    source: 1
  cumul: 'Cumulables entre elles (règlement p. 2 : « Les aides à l’habitat attribuées par la Communauté de Communes Saint-Pourçain Sioule Limagne dans le cadre de sa compétence « Politique du logement et cadre de vie » sont cumulables entre elles. ») Aucune aide Anah n’est exigée pour cette prime.'
  ouverture: 2026-01-01
  fermeture: null
  statut: ouverte
