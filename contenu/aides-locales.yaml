    niveau: epci
    code: "200071363"
  intitule: Aide au ravalement de façades en centre-ville, centre-bourg ou site patrimonial remarquable
  travaux:
  - facade
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  - copropriete
