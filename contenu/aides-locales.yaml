  notes: 'Le règlement ne fixe pas de durée minimale de vacance ni de condition de ressources pour cette prime. Il parle de « propriétaires de logements vacants » et d''une « mise sur le marché locatif » : le bénéficiaire est donc a priori un bailleur ; le statut « propriétaire occupant » est gardé par prudence et reste à confirmer. Convention : objectif de 5 dossiers sur la durée de l''OPAH. Mêmes réserves de durée que les autres entrées.'
