  - titre: Département de la Creuse, commission permanente du 21 février 2025, délibération CP2025-02/1/5 « Demande de subvention habitat rénovation énergétique » (dossier n° 6729)
    url: https://www.creuse.fr/IMG/pdf/5__6729_demande_de_subvention_habitat_renovation_energetique.pdf
    date_texte: 2025-02-21
    lu_le: 2026-10-17
  anil: null
  verifie_le: 2026-10-17
  notes: 'Fermée : dépôt limité à 2024. Les dernières attributions trouvées datent de la commission permanente du 21 février 2025 (source 3, vraisemblablement des dossiers déposés en 2024). Aucune délibération de 2025 ou 2026 reconduisant l''aide n''a été trouvée dans les publications de creuse.fr, et la convention du Pacte territorial France Rénov'' 2025-2027 ne cite comme financements propres du Département que le fonds d''avances et l''aide à la sortie d''insalubrité. Une reconduction reste à confirmer auprès de la Direction de l''Insertion et du Logement. La page des PIG de creuse.fr renvoie toujours vers la fiche 2024.'
- id: creuse-fonds-avance-amelioration-habitat
