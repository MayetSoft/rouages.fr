    niveau: epci
    code: '246301097'
  intitule: OPAH-RU de Lezoux — aides de la communauté de communes au ravalement de façade et à la réfection de toiture
  travaux:
  - facade
  - toiture
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  ressources: sans condition de ressources
  perimetre:
    communes:
    - '63195'
    precision: Centre ancien de Lezoux, périmètre de l’OPAH-RU annexé aux règlements. Seule une partie de la commune est concernée.
  montant: 'Façade : 20 % du montant HT des travaux, au plus 4 000 € (travaux plafonnés à 20 000 € HT) ; toiture : 20 %, au plus 4 000 €.'
  conditions:
  - texte: Façade.
    citation: L’aide est de 20% du montant HT de travaux, dans la limite de 4 000€ (soit un plafond de travaux HT de 20 000€).
    source: 1
  - texte: Résidence principale ou logement vacant, sans obligation de travaux intérieurs.
    citation: la CC Entre Dore et Allier décide d’apporter une aide financière au ravalement de façade des bâtiments d’habitation privés, dont le statut d’occupation relève de la résidence principale (ou logement vacant), et sans obligation d’aide aux travaux portant sur l’intérieur du logement.
    source: 1
  - texte: 'Toiture : réfection complète ou d’au moins la moitié.'
    citation: La réfection de toiture sera complète ou ciblant au moins 50% de la toiture concernée.
    source: 1
  - texte: Toiture exclue avec une aide « logement décent ».
    citation: Cette aide n’est pas mobilisable en cas d’octroi d’une aide de l’ANAH et de la Communauté de communes, sur la ligne de financement “logement décent”, qu’il s’agisse d’un projet de propriétaire occupant ou de propriétaire bailleur.
    source: 1
  - texte: Autorisation d’urbanisme et prescriptions de l’ABF.
    citation: Une autorisation d’urbanisme devra être demandée et accordée. Les prescriptions de l’Architecte des Bâtiments de France devront être respectées pour percevoir le versement de l’aide.
    source: 1
  cumul: Toiture non cumulable avec une aide « logement décent » de l’Anah et de la communauté ; la ville de Lezoux a un règlement façades/toitures propre.
