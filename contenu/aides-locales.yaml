    precision: « destinée aux particuliers propriétaires d’une résidence dans l’Allier » (fiche PDF, p. 1).
  montant: Au plus 500 € ; aide minimale de 150 € ; aides publiques et privées cumulées limitées à 90 % (très modestes) ou 75 % (modestes) du coût TTC.
  conditions:
  - texte: Particuliers propriétaires sous conditions de ressources, ménages modestes et très modestes.
    citation: Les particuliers propriétaires sous conditions de ressources. Les plafonds sont fixés annuellement dans les dispositifs d’Etat et ceux concernés par cette aide sont qualifiés de foyers « modestes » et « très modestes ».
    source: 2
  - texte: 'Plafonds de revenus fiscaux de référence (hors Île-de-France, au 1er janvier 2026) : 1 personne 17 363 € (très modeste) / 22 259 € (modeste) ; 2 personnes 25 393 € / 32 553 € ; 3 personnes 30 540 € / 39 148 € ; 4 personnes 35 676 € / 45 735 € ; 5 personnes 40 835 € / 52 348 € ; par personne en plus 5 151 € / 6 598 €.'
    citation: Tranches de revenus hors Ile-de-France 1/01/2026 Composition du foyer Foyer très modeste Foyer modeste 1 17 363 € 22 259 € 2 25 393 € 32 553 € 3 30 540 € 39 148 € 4 35 676 € 45 735 € 5 40 835 € 52 348 € Par personne supplémentaire 5 151 € 6 598 €
    source: 2
  - texte: Équipements concernés et exigences techniques (Flamme verte ou CO ≤ 300 mg/Nm3, particules ≤ 30 mg/Nm3, rendement ≥ 87 %).
    citation: 'Sont concernés les poêles à granulés, les inserts à granulés, les cuisinières à granulés ou tout type d’installation de chauffage indépendant à granulés L’appareil de chauffage indépendant à granulés doit être certifié flamme verte. Ou Les équipements doivent respecter les critères techniques : - Une émission de monoxyde de carbone rapportée à 13% d’O2 ≤ 300 mg/Nm3 - Une émission de particule rapportée à 13% d’O2 ≤ 30 mg/Nm3 - Un rendement énergétique ≥ 87 %'
    source: 2
  - texte: Installation par un artisan RGE.
    citation: Les équipements doivent être installés par un artisan certifié reconnu garant de l’environnement RGE.
    source: 2
  - texte: Montant et limites.
    citation: 'Appareil de chauffage indépendant à granulés : aide maximum de 500 € Cette aide est cumulable avec les aides de l’Etat. Le taux maximum d''aide publique et privée ne pourra pas excéder 90 % pour les ménages très modestes et 75 % pour les ménages modestes. Le montant minimum de l''aide est de 150 €.'
    source: 2
  - texte: Une demande au plus tous les cinq ans.
    citation: J’atteste ne pas avoir demandé cette aide dans les 5 dernières années » (formulaire, p. 4) ; « Soutien d’un projet maximum tous les 5 ans par demandeur. » (fiche web)
    source: 2
  - texte: Dossier avant tout commencement des travaux.
    citation: 1- Transmettre le dossier de demande AVANT tout commencement des travaux
    source: 2
