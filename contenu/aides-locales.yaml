  conditions:
  - texte: Montant et conditions.
    citation: Une aide complémentaire forfaitaire de 2 000 € est attribuée aux propriétaires de logements vacants. Ces logements devront faire l’objet d’une mise sur le marché locatif et d’une rénovation en cas de précarité (Habitat Indigne, très dégradé ou énergétique).
    source: 1
  - texte: Cumul.
    citation: Cette aide est cumulable avec les aides de l’ANAH et les aides complémentaires de l’OPAH dans le cadre de la Lutte contre l’Habitat Indigne, très dégradé et la lutte contre la précarité énergétique.
    source: 1
