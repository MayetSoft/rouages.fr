  montant: 'Règlement 2025 : 20 % du montant HT des travaux plafonné à 10 000 €, soit 2 000 € au plus.'
  conditions:
  - texte: Montant (règlement 2025)
    citation: 'De la part de Montluçon Communauté : 20% du montant HT des travaux plafonnés à 10 000 euros soit 2 000 euros maximum.'
    source: 1
  - texte: Périmètre
    citation: 'Le bâti pour lequel une subvention aux travaux de ravalement de façade sera accordée doit être situé dans l’un de ces périmètres : o ORT de Montluçon o ORT de Marcillat-en-Combraille'
    source: 1
  - texte: Travaux éligibles
    citation: Les travaux éligibles sont les travaux complets de ravalement de façade donnant sur rue.
    source: 1
  - texte: Ancienneté de la façade
    citation: Les façades ne doivent pas avoir été refaites depuis au moins 15 ans.
    source: 1
  - texte: Sans condition de ressources
    citation: Les bénéficiaires sont les propriétaires occupants, les propriétaires bailleurs privés et SCI et les syndicats de copropriété sans conditions de ressources.
    source: 1
  - texte: Durée du règlement 2025
    citation: Ce dispositif entre en vigueur au 1er janvier 2025 et prend fin au 31 décembre 2025.
    source: 1
  - texte: Enveloppe annuelle, ordre d'arrivée
    citation: L’enveloppe allouée à ces aides est fixée annuellement, les dossiers seront donc traités par ordre de réception dans la limite du budget disponible.
    source: 1
  cumul: « Cette aide est cumulable avec tout autre dispositif public. » (règlement 2025)
