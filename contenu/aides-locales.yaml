  notes: 'Avant travaux : « Les travaux ne doivent pas avoir débuté avant l’accord de subvention et doivent être conçus dans le respect des règles d’urbanisme. » (règlement, p. 1). Statut à confirmer : le seul règlement publié couvre 2025 (dépôt « avant le 31 décembre 2025 ») ; le formulaire en ligne, toujours actif, est titré « 2025 » (page non modifiée depuis le 21/02/2025). La fiche ANIL annonce une ouverture du 01/01/2026 au 31/12/2026 : aucun texte 2026 trouvé dans les recueils de délibérations de Montluçon Communauté lus (29/09/2025, 01/12/2025, 26/01/2026, 01/06/2026, 29/06/2026, 28/09/2026) ; ceux du 27/04/2026 et du 31/08/2026 sont des PDF scannés sans texte, non lus. Le règlement 2025 lui-même n''a pas été rattaché à une délibération (aucune trouvée dans les recueils 2025 lus). La fiche ANIL exige un professionnel RGE : le règlement ne le dit pas. Le formulaire annonce « jusqu’à 4 000€ » (parts de l''agglomération et de la Ville cumulées). Le plan des périmètres est une image : la liste des rues n''a pas été transcrite.'
