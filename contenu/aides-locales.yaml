  conditions:
  - texte: Montant, bien de plus de 15 ans vacant depuis plus de 2 ans, résidence principale 3 ans.
    citation: la Ville de Moulins réserve une prime de 100 €/m², avec un montant minimum de 3 000 €/logement et un montant maximum de 10 000 €/logement, aux ménages primo-accédants se portant acquéreurs d'un bien (logement ou local faisant l'objet d'une transformation d'usage), de plus de 15 ans et vacant depuis plus d'2 ans pour en faire leur résidence principale pour une durée de 3 ans.
