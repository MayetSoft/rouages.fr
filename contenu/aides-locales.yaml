  notes: 'Le règlement s''applique depuis le 1er janvier 2025 sans date de fin ; la page du Département (mise à jour le 19 mars 2025) le donne comme règlement en vigueur. Aucune version 2026 trouvée. L''ancienne fiche ANIL du Fonds Colibri (n° 828) ne répond plus. Le règlement ne dit pas en toutes lettres si la demande doit précéder les travaux pour ce volet : avant_travaux laissé à null. L''avance aux artisans (préfinancement des subventions Anah, réservée aux dossiers suivis par la Direction de l''Habitat) n''est pas décrite ici.'
