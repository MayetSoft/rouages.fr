  verifie_le: 2026-10-17
  notes: 'Montants lus dans le projet de convention d’OPAH-RU (version de mai 2024, document Word imprimé en PDF, publié sur le site de la commune de Volvic) : la convention signée n’a pas été trouvée, d’où le statut à confirmer. La convention dit elle-même que « les conditions relatives aux aides communautaires et les taux maximaux de subvention sont susceptibles de modifications ». Le reste du territoire de RLV relève d’un PIG, objet d’une seconde convention non trouvée : les aides de RLV y existent peut-être à d’autres taux (la page de RLV vise les 31 communes). Les périmètres exacts (rues) sont en annexe 1, non relue.'
