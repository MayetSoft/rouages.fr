  notes: 'Une seule aide et une seule enveloppe, que l''ANIL présente en deux fiches : rénovation énergétique (4573) et adaptation (https://www.anil.org/aides-locales-travaux/details/allier-aide-complementaire-anah-pour-les-travaux-dadaptation-du-logement-4575/). Les deux délibérations sont des PDF scannés sans couche texte : citations transcrites à la lecture de l''image, à relire. Elles ne fixent ni plafond de ressources, ni bénéficiaires, ni condition RGE (l''ANIL indique les plafonds de l''Anah, les occupants et les bailleurs, et un professionnel RGE) : ressources laissé à null ; les bénéficiaires viennent de la fiche ANIL et restent à confirmer. Aucun règlement ni formulaire propre n''a été trouvé. Le guichet France Rénov'' Allier est déduit de l''intitulé du dispositif et de la participation de la communauté de communes au Pacte territorial départemental (délibérations du 24 juin et du 27 octobre 2025, scannées, non transcrites) : à confirmer. Fermeture au 31/12/2026 : l''enveloppe est votée « pour l’année 2026 » ; la reconduction en 2027 n''est pas encore délibérée. Le site www.cc-pays-huriel.com ne publie aucune page « habitat ».'
