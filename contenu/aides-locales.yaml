  montant: 50 % du montant HT des travaux, subvention plafonnée à 3 000 €.
  conditions:
  - texte: Locataires du parc privé ou public aux ressources très modestes.
    citation: Le Fonds Habitat « Colibri » accompagne les locataires du parc privé ou public aux ressources « très modestes » au sens des plafonds de l’Anah, rencontrant des difficultés ponctuelles.
    source: 1
  - texte: Travaux d'adaptation, hors structure.
    citation: Les travaux d’adaptation du logement (changement de baignoire en douche, installation de petits matériels d’aides techniques, etc.), pourront faire l’objet d’une prise en charge, à l’exception des travaux touchant à la structure ou à l’aménagement général des lieux.
    source: 1
  - texte: Montant.
    citation: La Commission plénière peut proposer une subvention à hauteur 50 % du montant HT des travaux, au bénéfice du locataire. La subvention est plafonnée à 3 000 €.
    source: 1
  - texte: Aide Anah pour le parc privé, participation du bailleur pour le parc social ou communal.
    citation: l’obtention d’une aide Anah, concernant les locataires du parc privé ; une participation financière du propriétaire bailleur à hauteur du reste à charge du coût de travaux, concernant les locataires du parc social ou communal.
    source: 1
  - texte: Enquête sociale obligatoire.
    citation: Cette aide relève d’une demande caractérisée « complexe », soumise à la réalisation d’une enquête sociale réalisée par un travailleur social diplômé d’État.
    source: 1
  cumul: Conditionnée à une aide de l'Anah (parc privé) ou à la participation du bailleur (parc social ou communal).
