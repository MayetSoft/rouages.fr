- id: nievre-amelioration-habitat-energie
  porteur:
    nom: Département de la Nièvre
    siren: "225800010"
    niveau: departement
    code: "58"
  intitule: Aide départementale aux travaux de rénovation énergétique d'ampleur (propriétaires occupants orientés par le FNAME)
  travaux:
  - energie
  beneficiaires:
  - proprietaire-occupant
  - locataire
  ressources: éligibilité aux aides de l'Anah et au Fonds nivernais d'aide à la maîtrise de l'énergie (plafonds Anah « modestes » et « très modestes »)
  perimetre:
    communes: null
    precision: Le règlement vise les ménages « dont la résidence principale est située dans la Nièvre », sans autre restriction territoriale.
  montant: 5 % du montant hors taxes des travaux éligibles, dans la limite des plafonds de travaux subventionnables de l'Anah.
  conditions:
  - texte: 'Bénéficiaires généraux : propriétaires occupants (ou locataires avec l''accord du propriétaire si l''Anah le permet), résidence principale dans la Nièvre, éligibles à l''Anah.'
    citation: Il s’agit de propriétaires occupants (ou des locataires ayant eu l’accord de leur propriétaire si le règlement de l’ANAH le permet) dont la résidence principale est située dans la Nièvre. Les bénéficiaires doivent être éligibles aux conditions édictées par l’ANAH au moment du dépôt de leur demande.
    source: 1
  - texte: 'Volet énergie : ménages éligibles au FNAME orientés par sa commission vers un « Mon Accompagnateur Rénov'' » pour une rénovation d''ampleur.'
    citation: Les bénéficiaires sont les propriétaires occupants éligibles au Fonds Nivernais d’Aide à la Maîtrise de l’Energie qui auront été orientés par la Commission d’orientation et de gestion du Fonds vers un opérateur « Mon Accompagnateur rénov’ » pour un projet de rénovation énergétique d’ampleur, répondant aux critères définis par l’ANAH.
    source: 1
  - texte: Travaux éligibles.
    citation: Sont éligibles à l’aide du Département les travaux d’amélioration énergétique (isolation, chauffage, ventilation, menuiseries...) figurant au règlement de l’ANAH en vigueur le jour de la demande.
    source: 1
  - texte: Montant.
    citation: Le montant de la subvention départementale s’établit à 5 % du montant hors taxes des travaux éligibles. Les plafonds sont calculés sur la base des plafonds de travaux subventionnables figurant dans le règlement de l’ANAH.
    source: 1
  - texte: Accompagnement obligatoire par un opérateur (celui du volet accompagnement du pacte territorial là où il existe).
    citation: Les bénéficiaires sont nécessairement accompagnés par un opérateur (assistant à maîtrise d’ouvrage), comme le prévoit le règlement de l’ANAH.
    source: 1
  - texte: Pas de commencement des travaux avant l'accord du Département.
    citation: Le projet faisant l’objet d’une demande de subvention ne doit pas être commencé avant que le dossier de demande ait reçu un accord du Conseil départemental.
    source: 1
  - texte: Dossier déposé par l'opérateur après la commission locale de l'Anah ; dans la limite du budget voté.
    citation: Pour l’ensemble des volets, le dossier sera déposé par l’opérateur auprès des services du Département, après validation par la commission locale de l’ANAH.
    source: 1
  cumul: Aide complémentaire aux aides de l'Anah, dont l'éligibilité est requise ; « dans la limite du budget voté par l'Assemblée départementale ».
