- id: thiers-dore-et-montagne-primes-chaudiere-bois-chauffe-eau-solaire
  porteur:
    nom: Communauté de communes Thiers Dore et Montagne
    siren: '200070712'
    niveau: epci
    code: '200070712'
  intitule: 'Primes « plan climat » de Thiers Dore et Montagne : chaudière bois et chauffe-eau solaire individuel'
  travaux:
  - chauffage
  - energie
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  ressources: revenus inférieurs aux plafonds de l’Anah
  perimetre:
    communes: null
    precision: Prévues par le PIG (tout le territoire hors OPAH) et par l’OPAH multisites (Courpière, La Monnerie-le-Montel, Puy-Guillaume). La convention d’OPAH-RU de Thiers ne les mentionne pas.
  montant: Prime de 2 000 euros pour l’achat et l’installation d’une chaudière bois ; prime de 2 000 euros pour un chauffe-eau solaire individuel.
  conditions:
  - texte: Chaudière bois.
    citation: Une prime à l’achat et à l’installation d’une chaudière bois, le cas échéant en remplacement d’un chaudière au fioul ou au gaz. L’attribution de cette prime, d’un montant de 2 000 euros, est réservée aux ménages dont les revenus sont inférieurs aux plafonds de l’Anah. Le gain d’économie d’énergie doit être au moins de 35%, et il doit s’agir d’un système de chauffage central, labellisé « flamme verte ».
    source: 1
  - texte: Chauffe-eau solaire.
    citation: Une prime destinée à favoriser l’installation d’un chauffe-eau solaire individuel. L’attribution de cette prime, d’un montant de 2 000 euros, est réservée aux ménages dont les revenus sont inférieurs aux plafonds de l’Anah. Le gain d’économie d’énergie doit être au moins de 35%.
    source: 1
  - texte: Mêmes primes dans l’OPAH multisites.
    citation: L’attribution de cette prime, d’un montant de 2 000 euros, est réservée aux ménages dont les revenus sont inférieurs aux plafonds de l’Anah.
    source: 2
  - texte: Durée du PIG.
    citation: La présente convention est conclue pour une période de 5 années, à partir de sa signature.
    source: 1
