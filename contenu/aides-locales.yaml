- id: montbrison-plan-facades
  porteur: &id036
    nom: Commune de Montbrison
    siren: '214201477'
    niveau: commune
    code: '42147'
  intitule: Plan façades du centre ancien
  travaux:
  - facade
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  - copropriete
  ressources: Sans condition de revenus
  perimetre:
    communes: null
    precision: Quatre secteurs du centre ancien (quais du Vizézy ; rue du Marché et place Saint-André ; rue Saint-Jean ; immeubles C1 des rues Martin Bernard, Saint-Pierre et du Puy de la Bâtie) et une liste complémentaire d'immeubles (règlement, art. 3 et plan).
  montant: 25 % (plafond de 25 €/m² TTC), 35 % (plafond de 70 €/m² TTC) ou 45 % (plafond de 200 € TTC/m²) selon le type de travaux, au plus 50 % du montant total des travaux éligibles ; bonus de 10 % sur les quais du Vizézy ; étude préalable des immeubles remarquables aidée à 50 %, plafonnée à 4 000 € TTC.
  conditions:
  - texte: Niveau 1.
    citation: Ils sont subventionnés à 25% sans que le montant de la subvention globale puisse dépasser un plafond de 25€/m2 TTC.
    source: 1
  - texte: Niveau 2.
    citation: Ils sont subventionnées à 35% sans que le montant de la subvention globale puisse dépasser un plafond de 70€/m2 TTC.
    source: 1
  - texte: Niveau 3.
    citation: Ils sont subventionnés à 45%.
    source: 1
  - texte: Plafond du niveau 3.
    citation: Il ne pourra cependant dépasser 200€TTC/m2 de surface concernée.
    source: 1
  - texte: Cumul des niveaux.
    citation: sans pouvoir dépasser 50% du montant total des travaux éligibles pour l’opération.
    source: 1
  - texte: Bonus quais du Vizézy.
    citation: Un bonus de 10% supplémentaire du montant des travaux, est accordé aux travaux éligibles situés uniquement dans le secteur 1 quais du Vizézy
    source: 1
  - texte: Étude préalable.
    citation: L’étude préalable est subventionnée à hauteur de 50% plafonnée à 4 000€TTC.
    source: 1
  - texte: Immeuble de plus de 10 ans, non aidé depuis 10 ans.
    citation: N’ayant pas bénéficié de subventions aux travaux de ravalement depuis 10 ans
    source: 1
  - texte: Durée de l'opération.
    citation: L’opération s’inscrit pour une durée de cinq ans à compter de la date exécutoire de la délibération approuvant ce règlement.
    source: 1
  - texte: Déplafonnement de certains travaux (avenant 2).
    citation: Il est donc proposé de déplafonner les subventions relatives aux travaux de "requalification d’éléments de façades disgracieux en conformité avec les prescriptions, compris démolition".
    source: 2
  cumul: Cumulable avec les aides de la Fondation du patrimoine, du PLH et à la rénovation thermique, sans dépasser 80 % du montant HT des travaux.
  ouverture: '2022-06-30'
  fermeture: null
  statut: ouverte
  demarche:
    url: https://ville-montbrison.fr/production/wp-content/uploads/2024/03/Reglement-Plan-facades-mars-2024.pdf
    guichet: Service urbanisme de la ville de Montbrison (renseignements, visite préalable, fiche de suivi validée après avis de l'architecte conseil et de l'ABF).
    avant_travaux: true
  sources:
  - titre: Ville de Montbrison, « Plan façades – Règlement de l’opération & annexes », version mars 2024
    url: https://ville-montbrison.fr/production/wp-content/uploads/2024/03/Reglement-Plan-facades-mars-2024.pdf
    date_texte: '2024-03-25'
    lu_le: '2026-10-17'
