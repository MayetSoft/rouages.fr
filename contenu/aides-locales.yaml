  - titre: Délibération n°29 (acte 202506-29) du conseil communautaire du 12 juin 2025, « Adoption de la convention OPAH de renouvellement urbain multisites en centre-ville de Vichy et de Cusset (2025-2030) »
    url: https://webdelib.vichy-communaute.fr/webdelibplus/jsp/showFile.jsp?datePub=13%2F06%2F2025&dateRetLega=13%2F06%2F2025&pdf=wtKyq5gSV6UIi8PrmEya3hR%2FmLq%2BZfLnX4rI8DyJ0lkRgTin1oICmpHLMake1H%2FyM5q8zua17SbsW6d1CE7wc%2FyyKGt7U%2Bg2lt78p2mmiucNcziU4ae1mISshkWtkIaqqTDlLDVZC8MumLleH4lTPdplUz5VCU96p1%2BMWqqGhB8nsf8u0jGqajxnAoTNf6Nv
    date_texte: 2025-06-12
    lu_le: 2026-10-12
  anil: null
  verifie_le: 2026-10-12
  notes: 'Montants à confirmer : l''annexe 1 se dit « indicative » et annonce une délibération d''attribution propre à l''OPAH-RU. Ce règlement n''a pas été trouvé parmi les délibérations publiées du conseil communautaire (juin 2025 à octobre 2026) ; le seul règlement publié est celui du Pacte (juin 2025), dont les taux sont plus bas. Les parts des villes de Vichy (150 000 € prévus) et de Cusset (35 000 €) figurent aux articles 5.3 et 5.4 ; aucun règlement municipal propre n''a été trouvé. La convention en ligne n''est pas signée (« Fait en 7 exemplaires à Vichy, le XX/XX/2025 ») : la date d''effet retenue est celle de l''article 9. Avant travaux : règle générale de l''Anah, rappelée par le formulaire d''accueil de la Maison de l''Habitat (« Ne pas commencer les travaux avant le dépôt de dossier auprès de l''organisme financeur »). Le Mayet-de-Montagne : non. La convention dit que la commune a choisi de ne pas reconduire le dispositif : « La volonté de plusieurs communes engagées dans la précédente OPAH-RU de ne pas reconduire ce type de dispositif (Bellerive-sur-Allier, Saint-Germain-des-Fossés, Le Mayet-de-Montagne, Le Vernet) » (p. 12).'
