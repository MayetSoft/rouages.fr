  notes: 'Ce n''est pas une subvention mais une avance : pas de montant dans la fiche (montant null). Le libellé « accédant à la propriété » est rendu par primo-accedant faute de catégorie plus juste. Les travaux couverts suivent ceux des subventions avancées (Anah, APA, PCH) ; la liste retenue en déduit énergie, adaptation et habitat indigne. La convention signée avec le propriétaire n''est pas en ligne.'
- id: grand-gueret-sortie-vacance-centre-bourg
  porteur:
    nom: Communauté d'agglomération du Grand Guéret
    siren: "200034825"
    niveau: epci
    code: "200034825"
  intitule: Aide du Grand Guéret à la réhabilitation des logements vacants de centre-bourg
  travaux:
  - vacance
  - indigne
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  ressources: sans condition de ressources
  perimetre:
    communes:
    - "23002"
    - "23004"
    - "23033"
    - "23036"
    - "23052"
    - "23088"
    - "23092"
    - "23101"
    - "23128"
    - "23132"
    - "23150"
    - "23169"
    - "23170"
    - "23186"
    - "23191"
    - "23193"
    - "23195"
    - "23206"
    - "23208"
    - "23242"
    - "23245"
    - "23247"
    - "23248"
    - "23250"
    precision: Le règlement limite l'aide au « périmètre centre-bourg » de chaque commune membre, hors centre-ville de Guéret (couvert par l'OPAH-RU) ; la page de l'Agglo liste les 24 centres-bourgs éligibles, hors Guéret, avec leurs plans. À l'intérieur de chaque commune, seul le centre-bourg est éligible.
  montant: 100 € par m² de surface habitable en sortie de travaux, au plus 10 000 € par logement et jamais plus que le montant TTC des travaux.
  conditions:
  - texte: Périmètre.
    citation: Hormis le centre-ville de Guéret qui dispose d’un périmètre OPAH-RU, tous les centres-bourgs des communes membres de l’Agglo du Grand Guéret bénéficient d’un périmètre d’éligibilité à la présente aide.
    source: 1
  - texte: Logement vacant depuis plus de deux ans, occupé en résidence principale après travaux.
    citation: Sont éligibles à l’aide, les bâtiments de centre-bourg à usage d’habitation et vacants depuis plus de deux ans. Est qualifié de logement vacant, tout logement non occupé en tant que résidence principale depuis plus de deux années révolues. Par ailleurs, pour être éligible à l’aide, ces logements devront être occupés, à l’issue des travaux, à titre de résidence principale, soit par le propriétaire, soit par un locataire.
    source: 1
  - texte: Travaux atteignant au minimum la décence.
    citation: Pour obtenir la subvention, le demandeur devra réaliser des travaux permettant d’atteindre à minima les critères de décence du logement mentionnés dans le Décret n°2002-120 du 30 janvier 2002.
    source: 1
  - texte: Bénéficiaires, sans condition de ressources.
    citation: Tous types de propriétaires privés (physique ou moral), sans condition de ressources, ayant vocation à occuper le logement en qualité de résidence principale ou à mettre en location le logement une fois les travaux achevés.
    source: 1
  - texte: Montant.
    citation: Le montant de l’aide est basé sur la surface habitable du logement en sortie de travaux avec un forfait d’intervention de 100 € / m2. L’aide ne pourra pas excéder 10 000 € par logement.
    source: 1
  - texte: Plafond au coût des travaux.
    citation: En aucun cas l’aide allouée ne pourra être supérieure au montant TTC des travaux.
    source: 1
  - texte: Aide non de droit, dans la limite de l'enveloppe annuelle.
    citation: L'attribution d'une aide communautaire ne peut être considérée comme de droit. Elle est soumise à approbation en commission habitat, qui est souveraine pour déterminer le montant et les conditions de l'aide attribuée.
    source: 1
  - texte: Demande avant les travaux.
    citation: Les dossiers de demande d’aide financière devront parvenir au service habitat de l’agglomération avant le démarrage des travaux.
    source: 1
  - texte: Délai de réalisation.
    citation: Les travaux devront être terminés dans un délai de trois ans à compter de la date de la notification d’aide. A titre exceptionnel, une prorogation d’un délai d’un an pourra être accordée sur justification.
    source: 1
  - texte: Les SCI sont éligibles.
    citation: Les SCI sont éligibles au dispositif.
    source: 2
  cumul: Le règlement ne fixe pas de règle de cumul pour cette aide.
  ouverture: 2024-09-26
  fermeture: null
  statut: ouverte
  demarche:
    url: https://www.agglo-grandgueret.fr/au-quotidien/habitat/renovation-et-aides/logements-vacants/
    guichet: Service Habitat Logement de l'Agglo du Grand Guéret, 9 avenue Charles de Gaulle, 23000 Guéret, 05 55 41 04 48
    avant_travaux: true
  sources:
  - titre: Grand Guéret, Règlement communautaire des aides financières en application du PLH 2024/2030 (conseil communautaire du 26 septembre 2024), règlement 2, p. 13-17
    url: https://www.agglo-grandgueret.fr/wp-content/uploads/2025/07/ca_grand_gueret_reglement_communautaire_des_aides_financieres_en_application_du_plh_cc_26_septembre_2024-1.pdf
    date_texte: 2024-09-26
    lu_le: 2026-10-17
  - titre: agglo-grandgueret.fr, page Logements vacants
    url: https://www.agglo-grandgueret.fr/au-quotidien/habitat/renovation-et-aides/logements-vacants/
    date_texte: null
    lu_le: 2026-10-17
  anil: null
  verifie_le: 2026-10-17
  notes: 'La délibération d''adoption du 26 septembre 2024 (n° 196/24) est un PDF scanné, non lu (pas de couche texte). Les plans des 24 périmètres de centre-bourg sont des images (annexe 1 du règlement et page de l''Agglo) : le registre ne descend pas sous la commune. Le règlement vaut pour le PLH 2024-2030, sans date de fin propre. La page cite nommément les agents du service : remplacés ici par le service.'
- id: grand-gueret-operation-facades
  porteur:
    nom: Communauté d'agglomération du Grand Guéret
    siren: "200034825"
    niveau: epci
    code: "200034825"
  intitule: Opération façades du Grand Guéret (ravalement des façades en centre-bourg et dans le centre historique de Guéret)
  travaux:
  - facade
  - toiture
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  - copropriete
  ressources: sans condition de ressources
  perimetre:
    communes: null
    precision: Toutes les communes membres ont un périmètre d'éligibilité, restreint à l'espace public central du centre-bourg (plans annexés au règlement) ; à Guéret, le centre historique.
  montant: 50 % des travaux, sur un plafond de dépenses subventionnables de 10 000 € HT par immeuble, soit au plus 5 000 € par dossier ; dans le centre historique de Guéret, 50 % plafonnés à 7 500 €.
  conditions:
  - texte: Périmètre.
    citation: Tous les centres-bourgs des communes membres bénéficient d’un périmètre d’éligibilité à l’opération façades. Les périmètres sont annexés au présent règlement.
    source: 1
  - texte: Bâtiments construits avant 1945, une seule subvention par immeuble.
    citation: Sont éligibles les bâtiments dont la date de construction est antérieure à 1945.
    source: 1
  - texte: Bénéficiaires.
    citation: Tout propriétaire occupant et tout propriétaire bailleur (personne physique ou morale), sans condition de ressources avec, pour les copropriétés, l’accord écrit de tous les copropriétaires et du syndic.
    source: 1
  - texte: Montant hors Guéret.
    citation: La part de l’aide de la Communauté d’Agglomération est de 50 % pour un plafond de dépenses subventionnables de 10 000 € HT par immeuble, soit un maximum de 5 000 € par dossier.
    source: 1
  - texte: Montant majoré à Guéret pendant l'OPAH-RU (le règlement la date de janvier 2021 à janvier 2026).
    citation: 'Sur le centre-ville de Guéret, dans le cadre de l’Opération Programmée d’Amélioration de l’Habitat – Renouvellement urbain (OPAH-RU) cette subvention est majorée pour la durée de l’opération (janvier 2021 à janvier 2026) : 50% pour un plafond de dépenses subventionnables de 15 000€ par immeuble soit un maximum de 7 500€ par dossier pour Guéret.'
    source: 1
  - texte: Montants affichés par l'Agglo.
