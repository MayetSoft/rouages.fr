    date_texte: null
    lu_le: 2026-10-17
  - titre: Ville du Creusot, Règlement d'attribution d'une subvention municipale pour le financement de travaux de ravalements de façades (Plan Couleurs), en vigueur du 1er mars 2022 au 29 février 2024 (PDF)
    url: https://www.le-creusot.fr/app/uploads/2022/02/Reglement-plan-couleur.pdf
    date_texte: 2022-02-01
    lu_le: 2026-10-17
  anil: null
  verifie_le: 2026-10-17
  notes: 'Le seul règlement en ligne (celui que la page lie) était applicable « jusqu’au 29 février 2024 » et listait les axes 1 à 4 ; la page, plus récente, donne d''autres rues et un dépôt possible jusqu''au 31 décembre 2026. La délibération qui a prolongé le dispositif n''a pas été trouvée : le taux de 30 % et le plafond de 2 000 € sont à confirmer pour la campagne en cours. Les locataires sont éligibles s''ils réalisent les travaux avec l''accord écrit du propriétaire.'
