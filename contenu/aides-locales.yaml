  montant: 'Façade : 15 % du montant HT, au plus 3 000 € (travaux plafonnés à 20 000 € HT), 20 % et au plus 4 000 € en secteur ABF ou pour du pisé, 25 % et au plus 5 000 € pour du pisé en secteur ABF ; toiture : 15 %, au plus 3 000 €, 20 % et au plus 4 000 € en secteur ABF.'
  conditions:
  - texte: Façade.
    citation: 'L’aide est de 15% du montant HT de travaux, dans la limite de 3 000€ (soit un plafond de travaux HT de 20 000€) avec des bonus cumulables : • En secteur ABF, 5%, soit 20% du montant HT, dans la limite de 4 000€ • Réfection du pisé,5%, soit 20% du montant HT, dans la limite de 4 000€'
    source: 1
  - texte: Pisé en secteur ABF.
    citation: Dans le cas d’un cumul pisé en secteur ABF, la subvention sera de 25% du montant HT dans la limite de 5 000€.
    source: 1
  - texte: Toiture.
    citation: L’aide est de 15% du montant HT de travaux, dans la limite de 3 000€ (soit un plafond de travaux HT de 20 000€). Un bonus de 5% s’ajoute en secteur ABF, soit 20% du montant HT, dans la limite de 4 000€.
    source: 1
  - texte: Communes.
    citation: 'communes suivantes : Bort-l’Etang, Crevant-Laveine, Lempty, Orléat, Peschadoires, Saint- | Jean-d’Heurs, Seychalles et Vinzelles.'
    source: 1
  - texte: Logement de plus de 40 ans, résidence principale.
    citation: Le logement doit avoir plus de 40 ans, et la façade plus de 15 ans
    source: 1
  - texte: Réservation après autorisation d’urbanisme et avis ABF ou CAUE ; examen par le conseil communautaire.
    citation: Les demandes complètes seront examinées par le conseil communautaire dans l’ordre de leur dépôt.
    source: 1
