- id: creuse-sortie-insalubrite
  porteur:
    nom: Département de la Creuse
    siren: "222309627"
    niveau: departement
    code: "23"
  intitule: Aide départementale complémentaire à l'Anah pour la sortie d'insalubrité (travaux lourds, sécurité et salubrité)
  travaux:
  - indigne
  - energie
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  ressources: plafonds de ressources de l'Anah ; conventionnement Anah pour les bailleurs
  perimetre:
    communes: null
    precision: La fiche ne pose aucune restriction territoriale ; les attributions de 2026 portent sur des communes de tout le département (Guéret, Moutier-Rozeille, Parsac-Rimondeix, Saint-Priest-la-Feuille, La Nouaille).
  montant: 20 % du montant HT des travaux pris en compte par l'Anah, avec un plafond de 50 000 € ; majoration forfaitaire de 500 € si le projet comprend des travaux de réduction de la précarité énergétique.
  conditions:
  - texte: Objet de l'aide, complémentaire à celle de l'Anah.
    citation: Cette aide complémentaire à celle de l’Agence nationale de l’habitat (Anah) est destinée au financement des travaux nécessaires à la sortie d’insalubrité.
    source: 1
  - texte: Travaux concernés.
    citation: Seront considérés comme relevant de la sortie d’insalubrité, les projets de travaux lourds, ainsi que les projets de travaux pour la sécurité et la salubrité de l’habitat.
    source: 1
  - texte: Bénéficiaires et ressources.
    citation: Propriétaires occupants et propriétaires bailleurs avec un plafond de ressources selon les règles de l’Anah, à la date du dépôt de la demande auprès de la délégation locale.
    source: 1
  - texte: Bailleurs conventionnés avec l'Anah.
    citation: Conventionnement avec les propriétaires bailleurs selon les règles de l’Anah en vigueur, à la date du dépôt de la demande auprès de la délégation locale.
    source: 1
  - texte: Montant et majoration.
    citation: L’aide s’élève à 20 % du montant H.T. des travaux pris en compte par l’A.N.A.H. avec un plafond de 50 000 €. Si ce plafond intègre des travaux pour réduire la précarité énergétique, la subvention est majorée par une aide forfaitaire de 500 € complémentaire à l’aide de solidarité écologique.
    source: 1
  - texte: Diagnostic thermique préalable.
    citation: Un diagnostic thermique préalable doit indiquer la liste des travaux permettant d’atteindre les performances exigées conformément au règlement de l’Anah en vigueur.
    source: 1
  - texte: Règlement modifié en dernier lieu en 2024.
    citation: 'Délibération d’origine : Assemblée du 27 juin 2011 modifiée le 16 décembre 2013, le 09 février 2018 et 05 juillet 2024'
    source: 1
  - texte: L'aide est attribuée en 2026 par la commission permanente sur la base de ce règlement.
    citation: VU les délibérations 13/2/18 du Conseil général du 16 décembre 2013, n°CD2018-02/2/16 du 9 février 2018 et n°CP2024-07/1/6 du 5 juillet 2024, modifiant le règlement des aides départementales pour l’habitat ;
    source: 2
  - texte: L'aide figure parmi les financements propres du Département dans le Pacte territorial France Rénov' 2025-2027.
    citation: Aide à la sortie d'insalubrité
    source: 3
  cumul: Aide complémentaire à celle de l'Anah, qu'elle suppose (la notification de subvention de l'Anah est une pièce du dossier). Le texte ne fixe pas d'autre règle de cumul.
  ouverture: null
  fermeture: null
  statut: ouverte
  demarche:
    url: https://www.creuse.fr/Les-programmes-d-interet-general-de-l-habitat
    guichet: Conseil départemental de la Creuse, Pôle Cohésion sociale – Direction de l'Insertion et du Logement, 13 rue Joseph Ducouret, 23000 Guéret, 05 44 30 24 03 ; opérateur GIP Creuse Habitat, 12 avenue Pierre Leroux, 23000 Guéret, 05 87 80 90 30, habitat@creuse.fr
    avant_travaux: null
  sources:
  - titre: 'Département de la Creuse, fiche « Aide complémentaire à l''Anah pour la sortie d''insalubrité » (délibération d''origine du 27 juin 2011, modifiée le 5 juillet 2024)'
    url: https://www.creuse.fr/IMG/pdf/fiche_aide_sortie_d_insalubrite.pdf
    date_texte: 2024-07-05
    lu_le: 2026-10-17
  - titre: Département de la Creuse, commission permanente du 20 mars 2026, délibération « Subvention habitat – sortie insalubrité » (dossier n° 7352)
    url: https://www.creuse.fr/IMG/pdf/3._demande_de_subvention-_sortie_insalubrite.pdf
    date_texte: 2026-03-20
    lu_le: 2026-10-17
  - titre: Convention du Programme d'intérêt général Pacte territorial France Rénov' de la Creuse 2025-2027, annexe à la délibération CP2025-04/1/2 du 22 avril 2025, article 5.1.2
    url: https://www.creuse.fr/IMG/pdf/2_ann_pig_ptfr_23_vf_dil.pdf
    date_texte: 2025-04-22
    lu_le: 2026-10-17
  anil: null
  verifie_le: 2026-10-17
  notes: 'Le « plafond de 50 000 € » est ambigu dans la fiche : les attributions de la commission permanente du 20 mars 2026 (10 000 € par logement, 10 500 € pour des propriétaires occupants) montrent qu''il s''agit d''un plafond de travaux (20 % de 50 000 € = 10 000 €, plus les 500 € de majoration) ; le montant est laissé dans les termes de la fiche, à confirmer auprès de la Direction de l''Insertion et du Logement. La fiche ne dit pas que la demande doit précéder les travaux (avant_travaux laissé à null ; le dossier comprend la notification de l''Anah, qui l''exige). La version de la fiche publiée dans « Les aides du Département » (mise à jour du 18 décembre 2018) est antérieure : c''est la fiche liée depuis la page des PIG, mentionnant la modification du 5 juillet 2024, qui a été retenue. La convention de 2023 avec Haute-Corrèze Communauté (article 5.4) réserve l''aide aux propriétaires occupants « avec un plafond de ressources très social » et aux bailleurs dont les locataires ont un plafond social : formulation à rapprocher de la fiche, qui renvoie seulement aux « règles de l''Anah ». Pas de fiche ANIL : la base de l''ANIL ne recense aucune aide en Creuse (recherche du 17 octobre 2026).'
