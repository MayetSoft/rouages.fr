  verifie_le: 2026-10-12
  notes: 'Ouverture : le titre du règlement porte « (Application à compter du 1er janvier 2026) ». La délibération (p. 20) parle d’une « expérimentation de cette prime » et prévoit des crédits au budget primitif 2026 ; aucune date de fin n’est fixée. Le règlement ne pose pas de condition de travaux ni de dépôt avant travaux : avant_travaux laissé à null. Le guichet nommé dans le règlement est une personne : seul le service est repris ici.'
- id: spsl-facade
  porteur:
    nom: Communauté de communes Saint-Pourçain Sioule Limagne
    siren: "200071389"
    niveau: epci
    code: "200071389"
  intitule: Aide aux travaux de ravalement de façade, avec ou sans isolation par l’extérieur
  travaux:
  - facade
  - isolation
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  - copropriete
  ressources: null
  perimetre:
    communes: null
    precision: 'Règlement 2026, p. 2 : « Le bâtiment doit être situé sur le territoire de la communauté de communes Saint-Pourçain Sioule Limagne, soit au sein d’une des 60 communes suivantes » (liste des 60 communes donnée p. 2). L’aide est ouverte sur tout le territoire, mais seulement si le logement fait l’objet d’un dossier Anah OU s’il est situé dans un périmètre de protection de monument historique (abords AC1, SPR AC4, sites classés et inscrits), consultable sur atlas.patrimoines.culture.fr.'
  montant: 20 % du montant HT des travaux subventionnables, plafonné à 2 500 € par logement (demandes possibles en plusieurs tranches dans cette limite).
  conditions:
  - texte: Montant
    citation: Le montant de l’aide est égal à 20 % du montant total HT des travaux subventionnables, plafonné à 2 500 € par logement. » (p. 7)
    source: 1
  - texte: Bénéficiaires ayant déposé un dossier Anah pour le logement
    citation: Les propriétaires occupants, les copropriétés et les propriétaires bailleurs qui veulent réaliser des travaux de ravalement de façades avec ou sans isolation par l’extérieur d’un logement pour lequel ils ont déposé un dossier de demande auprès de l’Anah pour le financement de travaux. » (p. 5)
    source: 1
  - texte: Ou logement en résidence principale situé dans un périmètre de protection de monument historique
    citation: Les propriétaires occupants, les copropriétés et les propriétaires bailleurs de logements occupés en résidences principales situés dans le périmètre de protection d’un monument historique. » (p. 5)
    source: 1
  - texte: Façades visibles depuis le domaine public seulement
    citation: Seules les façades et les pignons visibles depuis le domaine public, au moins partiellement, pourront être subventionnés. » (p. 5)
    source: 1
  - texte: Un projet par an et par propriétaire
    citation: L’attribution de l’aide est limitée à un projet par an et par propriétaire. » (p. 5)
    source: 1
  - texte: Exclusions
    citation: les bâtiments classés ou inscrits, » ; « les constructions récentes (de moins de 15 ans), » (p. 6)
    source: 1
  - texte: Travaux par une entreprise inscrite au RCS ou au répertoire des métiers
    citation: Les travaux doivent obligatoirement être exécutés par un artisan ou une entreprise inscrite au registre du commerce ou au répertoire des métiers. » (p. 6)
    source: 1
  - texte: Autorisation d’urbanisme et avis ABF ou accusé de réception Anah de moins de 2 ans à joindre
    citation: soit l’avis de l’Architecte des Bâtiments de France ; » ; « soit un accusé de réception de l’ANAH pour la réalisation de travaux dans ce logement, datant de moins de 2 ans ; » (p. 7)
    source: 1
  - texte: Demande de paiement dans les 3 ans de la notification
    citation: La demande de paiement devra être transmise dans un délai maximal de 3 ans suivant la notification de la subvention. » (p. 8)
    source: 1
  - texte: Attribution après examen par la commission habitat, dans l’ordre d’arrivée des dossiers complets, et dans la limite d’une enveloppe annuelle
    citation: Les dossiers de demande sont traités selon l’ordre chronologique de leur arrivée complet à la Communauté de Communes. » (p. 2) ; « L’enveloppe budgétaire réservée pour le financement de ces aides est révisée chaque année en fonction de la consommation du budget de l’année précédente et des résultats obtenus. » (p. 2)
    source: 1
  cumul: 'Cumulables entre elles (règlement p. 2 : « Les aides à l’habitat attribuées par la Communauté de Communes Saint-Pourçain Sioule Limagne dans le cadre de sa compétence « Politique du logement et cadre de vie » sont cumulables entre elles. »)'
