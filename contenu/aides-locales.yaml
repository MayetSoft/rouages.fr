  conditions:
  - texte: Propriétaires occupants modestes et très modestes d'un logement relevant de la lutte contre l'habitat indigne.
    citation: Le Fonds Habitat « Colibri » accompagne les propriétaires occupants « modestes et très modestes Anah » d’un logement relevant de la lutte contre l’habitat indigne.
    source: 1
  - texte: Montants.
    citation: jusqu’à 2 500 € d’aide pour la réalisation d’une étude structurelle de bâtiment d’habitation ; jusqu’à 1 000 € d’aide pour la réalisation d’actes notariés nécessaires au dépôt d’un dossier.
    source: 1
  - texte: Pas besoin d'un dossier Anah.
    citation: Cette aide n’est pas conditionnée au dépôt d’un dossier de demande d’aides auprès de l’Anah.
    source: 1
  - texte: Situation traitée par le pôle départemental de lutte contre l'habitat indigne.
