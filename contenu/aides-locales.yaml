    communes: null
    precision: Le règlement de 2022 abroge les périmètres antérieurs et n'en fixe pas de nouveau ; le critère est le bâti (construction antérieure à 1940, caractère à conserver).
  montant: 30 % du montant HT des travaux, aide plafonnée à 1 525 € (enduit simple ou rénovation de pierres apparentes de type ancien) ou 2 290 € (enduit entre colombages).
  conditions:
  - texte: Bâti éligible.
    citation: L’attribution de l’aide portera sur l’habitat ou le commerce traditionnel avec un caractère à conserver, compte tenu de l’intérêt ancien et de la qualité de bâti qu’ils présentent. Les constructions devront être antérieures à 1940.
    source: 1
  - texte: Montant.
    citation: 'L’aide est fixée à 30 % du montant HT des travaux plafonnée à : 1 525 € pour un enduit simple ou une rénovation de pierres apparentes (joints, nettoyage…) de type ancien. 2 290 € pour un enduit entre colombages.'
    source: 1
  - texte: Exclusions.
    citation: tous travaux annexes n’étant pas liés à la façade proprement dite à savoir visseries, fenêtres, portes, volets, persiennes… tout habitat ou commerce ne présentant pas un caractère particulier et ancien, habitat pavillonnaire ou habitat à structure bétonnée.
    source: 1
  - texte: Démarrage possible dès l'accusé de réception du dossier complet ; travaux conformes à l'avis des services de l'urbanisme ou de l'Architecte des Bâtiments de France.
    citation: Le demandeur pourra démarrer l’opération dès la réception de l’accusé de réception de dossier complet.
    source: 1
  - texte: Pièces à fournir.
    citation: Déclaration de travaux et avis de la Direction Départementale de l’Equipement (DDE) - Devis des travaux correspondant aux prescriptions de la DDE - RIB - Un extrait cadastral permettant de constater la date de construction du bâtiment.
    source: 1
  - texte: Dispositif présenté comme en place sur le site de la Communauté de communes.
    citation: Le dispositif  « Fonds façade » est en place depuis 2001.
    source: 2
  cumul: Cumulable avec le fonds de la Ville de Clamecy, selon la page de la Ville (« Aide cumulable avec le fonds de la CCHNVY »).
