  - titre: Vichy Communauté, imprimé « Demande d'aide au ravalement des façades » (version août 2021, renvoie au règlement du 8 juillet 2021)
    url: https://habitat.vichy-communaute.fr/wp-content/uploads/2022/01/Courrier-demande-aide-facade-VichyComunaute-AOUT2021.pdf
    date_texte: 2021-08-01
    lu_le: 2026-10-12
  anil: https://www.anil.org/aides-locales-travaux/details/allier-aide-au-ravalement-de-facade-2932/
  verifie_le: 2026-10-12
  notes: 'Avant travaux : « La demande de subvention doit impérativement être déposée auprès de Vichy Communauté avant le démarrage des travaux. Les travaux commencés seront exclus du calcul de l’aide. » (règlement 2023, p. 10) ; et pas avant l''autorisation d''urbanisme, l''avis de l''ABF le cas échéant et la notification (p. 8). Divergence : le tableau récapitulatif du règlement de juin 2025 (p. 2) indique « 10% », « 10 000 à 15 000€ HT par bâtiment selon le secteur » et « 3000€ + aides Fondation du Patrimoine » sur les « 39 cnes » ; il ne donne que la part de l''agglomération, en HT. La fiche 8 du même règlement renvoie au texte de 2023 (20 %, TTC, part communale comprise), retenu ici. Le Mayet-de-Montagne : indéterminé. L''aide y vaut seulement si le conseil municipal a arrêté un périmètre de centralité et si la commune verse sa part de 10 % ; aucune délibération du Mayet-de-Montagne n''a été trouvée (site de la commune injoignable d''ici). La convention de l''OPAH-RU 2020-2024 (avenant n°2) fixait un objectif de façades au Mayet-de-Montagne, ce qui laisse penser que la commune a eu un périmètre, sans le prouver pour aujourd''hui. Le régime « renaissance du cœur thermal » de Vichy fait l''objet d''une entrée à part. L''imprimé de demande en ligne date de 2021 : à vérifier auprès de la Maison de l''Habitat. La fiche ANIL donne une fermeture au 31/12/2027 : aucun texte lu ne fixe cette date.'
