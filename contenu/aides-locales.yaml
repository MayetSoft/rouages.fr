  perimetre:
    communes: null
    precision: Le site patrimonial remarquable (SPR) à Vichy et à Billy ; ailleurs, le centre-ville ou centre-bourg « selon le périmètre de centralité arrêté par délibération du conseil municipal ». Les communes ayant adopté un tel périmètre ne sont pas recensées dans les textes lus. Façades et pignons visibles depuis l'espace public.
  montant: 20 % des travaux subventionnables (10 % Vichy Communauté, 10 % commune), plafonnés à 10 000 € TTC par bâtiment dans le périmètre de centralité ; jusqu'à 15 000 € TTC en site patrimonial remarquable, selon la catégorie de l'immeuble.
  conditions:
  - texte: 'Localisation : SPR, ou périmètre de centralité arrêté par le conseil municipal (p. 5).'
    citation: 'dans le périmètre du Site Patrimonial Remarquable (SPR) lorsqu’il a été instauré sur la commune ; Dans l’agglomération, deux communes sont actuellement couvertes par un SPR à savoir : Vichy et Billy. ou bien dans le centre-ville ou le centre-bourg de la commune (selon le périmètre de centralité arrêté par délibération du conseil municipal) lorsqu’il n’existe pas de SPR.'
    source: 1
  - texte: Façades visibles de l'espace public.
    citation: les façades et les pignons doivent être visibles depuis l’espace public.
    source: 1
  - texte: Partage du financement (p. 8).
    citation: L’aide est financée à parts égales par la communauté d’agglomération (10%) et par la commune (10%).
    source: 1
  - texte: Montant en centralité (p. 8).
    citation: Le montant de l’aide est fixé à 20% du montant des travaux subventionnables plafonné à 10 000 € TTC par bâtiment, pour les bâtiments situés dans le périmètre de centralité défini par la commune
    source: 1
  - texte: Régime SPR (p. 8-9).
    citation: '20% du montant des travaux subventionnables plafonné à 15 000 € TTC par bâtiment, pour les bâtiments répertoriés dans le Plan de règlement du Site Patrimonial Remarquable (SPR) comme : Immeuble ou partie d’immeuble classé(e) au titre des Monuments Historiques Immeuble exceptionnel. Immeuble remarquable.'
    source: 1
