    nom: Département de l'Allier
    siren: "220300016"
    niveau: departement
    code: "03"
  intitule: Complément départemental aux aides de l'Anah pour les logements indignes ou très dégradés
  travaux:
  - indigne
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  ressources: 'propriétaires occupants : plafonds Anah « modestes » et « très modestes » ; bailleurs : sans condition dans la fiche'
  perimetre:
    communes: null
    precision: La fiche ne pose aucune restriction territoriale à l'intérieur du département.
  montant: 15 % du montant HT des travaux subventionnés par l'Anah, retenus dans la limite de 40 000 €, portée à 50 000 € en cas de maîtrise d'œuvre pour les seuls propriétaires occupants.
  conditions:
  - texte: Bénéficiaires.
    citation: Propriétaires occupants aux revenus modestes ou très modestes selon les critères de l’Anah et les propriétaires bailleurs.
    source: 1
  - texte: Logements insalubres ou très dégradés selon la grille de l'Anah ; pour les occupants, aussi travaux de salubrité et de sécurité.
    citation: Aide applicable uniquement pour les logements insalubres ou très dégradés selon la grille de l’Anah. Pour les propriétaires occupants peuvent être pris en compte également les travaux pour la salubrité et sécurité du logement selon les critères de l’Anah.
