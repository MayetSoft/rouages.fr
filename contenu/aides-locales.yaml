  intitule: Prime précarité énergétique, en complément d’un dossier Anah (MaPrimeRénov’ Parcours accompagné, Loc’Avantages ou logement décent)
  travaux:
  - energie
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  ressources: Ressources inférieures aux plafonds fixés annuellement par l’Anah.
  perimetre:
    communes: null
    precision: 'Règlement 2026, p. 2 : « Le bâtiment doit être situé sur le territoire de la communauté de communes Saint-Pourçain Sioule Limagne, soit au sein d’une des 60 communes suivantes » (liste des 60 communes donnée p. 2).'
  montant: Prime forfaitaire de 1 000 € par logement, pour les propriétaires occupants comme pour les bailleurs.
  conditions:
  - texte: Montant
    citation: Prime forfaitaire est de 1 000 € par logement, pour les propriétaires occupants et pour les propriétaires bailleurs. » (p. 9)
    source: 1
  - texte: Résidence principale, ressources sous les plafonds Anah
    citation: Peuvent être bénéficiaires de l’aide les propriétaires occupants ou bailleurs qui occupent ou louent un logement à titre de résidence principale, dont les ressources sont inférieures aux plafonds fixés annuellement par l’ANAH. » (p. 9)
    source: 1
  - texte: Logement de 15 ans au moins et gain énergétique selon les seuils Anah
    citation: être achevés depuis au moins 15 ans à la date où la décision d’accorder la subvention est prise et justifier que le projet de travaux permet d’atteindre les seuils fixés par l’Anah en termes de gain énergétique, de classe énergétique et d’amélioration des GES (Gaz à effet de serre). » (p. 9)
    source: 1
  - texte: Professionnels RGE
    citation: les travaux prévus doivent être réalisés par des professionnels du bâtiment labellisés « Reconnu Garant de l’Environnement » (RGE). » (p. 9)
    source: 1
  - texte: Dossier transmis par Mon Accompagnateur Rénov’
    citation: Le dossier remplit sera transmis au service habitat de la communauté de communes par le MAR « Mon Accompagnateur Rénov’ » pour examen par la commission en charge de l’habitat. » (p. 9)
    source: 1
  - texte: Attribution après examen par la commission habitat, dans l’ordre d’arrivée des dossiers complets, et dans la limite d’une enveloppe annuelle
