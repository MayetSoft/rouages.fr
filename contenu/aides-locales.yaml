  intitule: Fonds Habitat « Colibri » — prime à la remise en habitation d'un logement vacant depuis plus de deux ans en centre-bourg
  travaux:
  - vacance
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  ressources: sans condition de ressources
  perimetre:
    communes: null
    precision: Tout le département, mais seulement pour un logement situé en centre-bourg, en continuité du bâti (pas de coupure de plus de 200 mètres entre deux constructions).
  montant: 4 000 € par logement.
  conditions:
  - texte: Propriétaires actuels ou nouveaux acquéreurs, sans condition de ressources.
    citation: Le Fonds Habitat « Colibri » accompagne les propriétaires (occupant ou bailleur, actuel ou nouvel acquéreur) d’un logement situé dans le Puy-de-Dôme (personnes physiques, SCI, usufruitier), sans conditions de ressources.
    source: 1
  - texte: Montant et plafond de cumul.
    citation: La Commission plénière peut proposer une subvention de 4 000 € par logement au bénéfice du propriétaire. L’aide est cumulable avec les autres aides de droits commun, dans la limite de 80 % de financements publics.
    source: 1
  - texte: Vacance de plus de deux ans et localisation en centre-bourg.
    citation: 'l’absence d’occupation du logement depuis 2 ans (le logement sera recensé comme vacant depuis plus de 2 ans, au sens fiscal) ; la localisation : logement situé en centre-bourg en continuité du bâti (pas de coupure de plus de 200 mètres entre deux constructions).'
    source: 1
  - texte: Accompagnement par Mon Accompagnateur Rénov' et audit réglementaire.
    citation: Le demandeur doit bénéficier d’un accompagnement technique par un organisme agréé Mon Accompagnateur Rénov' pour l’élaboration de son projet.
    source: 1
  - texte: Occupation ou location six ans en résidence principale ; trois logements sur cinq ans pour un bailleur.
    citation: occuper ou louer le logement aidé pendant six ans à titre de résidence principale ;
    source: 1
  cumul: Cumulable avec les autres aides de droit commun dans la limite de 80 % de financements publics.
  ouverture: 2025-01-01
  fermeture: null
  statut: ouverte
  demarche:
    url: https://www.puy-de-dome.fr/social/logement-habitat/fonds-habitat-colibri.html
    guichet: Saisine par un organisme agréé Mon Accompagnateur Rénov' ; Conseil départemental du Puy-de-Dôme, Direction de l'Habitat et du Cadre de Vie, 04 73 42 30 70
    avant_travaux: null
  sources:
  - titre: Département du Puy-de-Dôme, règlement intérieur du Fonds Habitat « Colibri » (délibération du 17 décembre 2024), titre II, article 8
    url: https://www.puy-de-dome.fr/fileadmin/user_upload/CD63-2025-01-REGLEMENT-COLIBRI.pdf
    date_texte: 2024-12-17
    lu_le: 2026-10-17
  anil: null
  verifie_le: 2026-10-17
  notes: 'Le règlement de 2025 a ramené la durée de vacance de trois à deux ans (le règlement de novembre 2023 disait trois ans et exigeait 35 % de gain énergétique). Le périmètre « centre-bourg » ne se traduit pas en liste de communes : perimetre.communes laissé à null, la condition est dans la précision.'
- id: puy-de-dome-colibri-renovation-performante
  porteur:
    nom: Département du Puy-de-Dôme
    siren: '226300010'
    niveau: departement
    code: '63'
  intitule: Fonds Habitat « Colibri » — bonus à MaPrimeRénov' Parcours accompagné pour l'isolation biosourcée, les énergies renouvelables, l'étanchéité à l'air et la maîtrise d'œuvre
  travaux:
  - energie
  - isolation
  - chauffage
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  ressources: toutes catégories de revenus Anah (montant de la maîtrise d'œuvre selon la catégorie)
  perimetre:
    communes: null
    precision: Le règlement intérieur ne pose aucune restriction territoriale à l'intérieur du département.
  montant: 'Isolant biosourcé des murs : 25 €/m², au plus 4 000 € ; pompe à chaleur géothermique ou système solaire combiné : 3 000 € ; chauffe-eau solaire individuel : 500 € ; étanchéité à l''air : 25 €/m² dans la limite de 4 000 € (test ≤ 0,6 m³/h/m²) ou 10 €/m² dans la limite de 1 600 € (test ≤ 1,1 m³/h/m²) ; maîtrise d''œuvre : 4 000 € (très modestes et modestes), 2 500 € (intermédiaires), 1 500 € (supérieurs), dans la limite de 50 % de la dépense.'
  conditions:
  - texte: Être bénéficiaire de MaPrimeRénov' Parcours accompagné ; seuls ses travaux sont éligibles.
    citation: être bénéficiaire de MaPrimeRénov’ Parcours Accompagné. Seuls les travaux inclus dans cette demande sont éligibles ;
    source: 1
  - texte: Résidence principale pour un occupant ; trois logements au plus pour un bailleur.
    citation: pour les propriétaires occupants, le logement doit être destiné à la résidence principale du ménage. Les résidences secondaires ne sont pas éligibles ; pour les propriétaires bailleurs, le Département pourra accorder une subvention jusqu’à 3 logements ;
    source: 1
  - texte: Isolation biosourcée.
    citation: 25€/m² d’isolant posé, dans la limite de 4 000 € d’aide, pour l’isolation des murs donnant sur l’extérieur ;
    source: 1
  - texte: Énergies renouvelables.
    citation: 3 000 € pour l'installation d'une pompe à chaleur géothermique ; 3 000 € pour l’installation d’un système solaire combiné ; 500 € pour l’installation d’un chauffe-eau solaire individuel.
    source: 1
  - texte: Étanchéité à l'air, si le projet fait gagner au moins trois classes.
    citation: 25€/m² de membrane dans la limite de 4 000 € si la valeur du test d’étanchéité est inférieure ou égale à 0,6 m³/h/m² ; 10€/m² dans la limite de 1 600 € si la valeur du test d’étanchéité est inférieure ou égale à 1,1 m³/h/m² ;
    source: 1
  - texte: Maîtrise d'œuvre, si le projet fait gagner au moins trois classes.
    citation: 4 000 € pour des ménages aux revenus « très modestes » ou « modestes » Anah, dans la limite de 50 % de la dépense ; 2 500 € pour des ménages aux revenus « intermédiaires » Anah, dans la limite de 50 % de la dépense ; 1 500 € pour des ménages aux revenus « supérieurs » Anah, dans la limite de 50 % de la dépense.
    source: 1
  - texte: Dépôt après la notification de l'Anah ; les travaux peuvent commencer avant la décision du Département.
    citation: Le dépôt de la demande d’aide est conditionné à la réception de la notification d’attribution de l’Anah. Le demandeur est autorisé à démarrer les travaux avant l'avis de la Commission permanente du Conseil départemental sachant que cette autorisation ne vaut pas engagement du Département à octroyer une aide.
    source: 1
  - texte: Plafond d'aides publiques.
    citation: Le projet de travaux ne doit pas bénéficier de plus de 80 % d’aides publiques (un écrêtement des aides pourra être réalisé le cas échéant).
    source: 1
  cumul: Cumulable avec les autres dispositifs nationaux ou locaux, dans la limite de 80 % d'aides publiques.
  ouverture: 2025-01-01
  fermeture: null
  statut: ouverte
  demarche:
    url: https://www.puy-de-dome.fr/social/logement-habitat/fonds-habitat-colibri.html
    guichet: Saisine par l'organisme agréé Mon Accompagnateur Rénov' ; cohérence des travaux validée par un conseiller Rénov'actions63 (04 73 42 30 72)
    avant_travaux: false
  sources:
  - titre: Département du Puy-de-Dôme, règlement intérieur du Fonds Habitat « Colibri » (délibération du 17 décembre 2024), titre III, article 9
    url: https://www.puy-de-dome.fr/fileadmin/user_upload/CD63-2025-01-REGLEMENT-COLIBRI.pdf
    date_texte: 2024-12-17
    lu_le: 2026-10-17
  - titre: Rénov'actions63, page Financement et aides à la rénovation énergétique
    url: https://www.renovactions63.fr/financement-aides-renovation-energetique-2/
    date_texte: null
    lu_le: 2026-10-17
  anil: null
  verifie_le: 2026-10-17
  notes: 'avant_travaux à false : les travaux peuvent commencer avant la décision du Département, mais après l''accord de l''Anah (« les travaux ne doivent pas avoir débuté avant l''accord de l''Anah »). Depuis septembre 2026, les règles de MaPrimeRénov'' Parcours accompagné ont changé (fin du maintien d''une chaudière gaz) : l''articulation avec ce bonus reste à vérifier. La page de Rénov''actions63 annonce une « subvention supplémentaire du département » sans détailler les montants.'
