  verifie_le: 2026-10-12
  notes: 'Deux ambiguïtés dans le texte primaire. 1) Le plafond : le PDF (p. 2) dit « plafonnés à 40 000 € de travaux HT subventionnés par l’Anah » (plafond de travaux), tandis que la page allier.fr dit « 15% du montant HT des travaux subventionnés par l’Anah, plafonné à 40 000 € », lecture possible comme plafond d''aide. Le montant résumé suit la fiche PDF ; les maxima de 6 000 € et 7 500 € sont un calcul, pas un chiffre du texte : à ne pas publier sans confirmation. 2) Le contrat de maîtrise d''œuvre est posé comme condition d''éligibilité, alors que le montant prévoit un plafond majoré « en cas de maîtrise d’œuvre » : on ne sait pas si la maîtrise d''œuvre est exigée de tous. À confirmer auprès de France Rénov'' Allier. Délibération d''origine citée : n° 2019-25-255. Formulaire non trouvé en ligne.'
