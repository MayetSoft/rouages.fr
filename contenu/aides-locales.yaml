  notes: 'Aide à l''accession, pas aux travaux ; l''ANIL ne la recense pas dans les pistes fournies. Délibération d''origine citée : n° 2019-25-256. Liste des communes : voir les écarts décrits dans l''entrée allier-rcvcb-diagnostics-vente ; ici la liste de 76 de la page frais de notaire, graphies normalisées (Cressanges, Cosne-d''Allier, Villefranche-d''Allier). La demande suit l''achat (avant_travaux: false). La fiche ne pose la condition de vacance que pour l''aide de 10 000 € ; elle n''exige pas de travaux, seulement un logement « décent avant ou après travaux ».'
- id: allier-ravalement-facades
  porteur:
    nom: Département de l'Allier
    siren: "220300016"
    niveau: departement
    code: "03"
  intitule: Aide au ravalement des façades de logements dans les bourgs
  travaux:
  - facade
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  ressources: null
  perimetre:
    communes: null
    precision: Bourgs couverts à la fois par une OPAH et par un contrat communal d'aménagement de bourg ou un périmètre de protection de monument historique ou de site, dans une commune ou une intercommunalité qui a créé sa propre prime façade. Aucune liste de communes publiée.
  montant: 10 % d'une dépense plafonnée à 12 000 € TTC par bâtiment.
  conditions:
  - texte: Périmètre et prime locale préalable.
    citation: 'Territoire couvert par : . une OPAH . et un contrat communal d''aménagement de bourg ou un périmètre de protection attaché à un monument historique ou un site classé ou inscrit - Façades des logements visibles de l''espace public et situé dans le bourg - Projet bénéficiant d''une aide communale ou intercommunale'
    source: 1
  - texte: Prime communale minimale de 300 € ou intercommunale de 1 000 €.
    citation: La commune ou le groupement de communes à fiscalité propre du lieu d'implantation du bâtiment devra avoir instauré une prime réhabilitation des façades d'un montant minimum de 300 € pour une commune et de 1 000 € pour un groupement de communes.
    source: 1
  - texte: Montant.
    citation: 'Taux d''intervention : 10 % - Dépense subventionnable maximale : 12 000 € TTC par bâtiment'
    source: 1
  - texte: Avis de l'ABF ou du CAUE.
    citation: Avis conforme de l'ABF ou du CAUE suivant le secteur concerné
    source: 1
  cumul: « Le programme 'aide aux travaux de ravalement des façades' n'est pas cumulable avec le dispositif 'amélioration de l'habitat des personnes âgées'. »
  ouverture: null
  fermeture: null
  statut: a_confirmer
  demarche:
    url: https://www.allier.fr/aide/62/1151-les-aides.htm
    guichet: Conseil départemental de l'Allier, « Service Habitat et Urbanisme » selon la fiche (service sans coordonnées sur la fiche)
    avant_travaux: null
  sources:
  - titre: 'Département de l''Allier, guide des aides : Travaux de ravalement des façades de logements (session du 23 juin 2022)'
    url: https://www.allier.fr/aide/62/1151-les-aides.htm
    date_texte: 2022-06-23
    lu_le: 2026-10-12
  anil: null
  verifie_le: 2026-10-12
  notes: 'La fiche figure encore au catalogue du Département, mais elle renvoie à un « cahier des charges validé par le département » non publié, à un « Service Habitat et Urbanisme » qui n''apparaît plus ailleurs sur le site (les autres aides habitat passent par France Rénov'' Allier), et à un dispositif « amélioration de l''habitat des personnes âgées » qui ne porte plus ce nom. Elle ne dit pas si la demande doit précéder les travaux et ne donne pas de formulaire. Aucune liste des communes réunissant OPAH et prime façade n''a été trouvée : elle dépend des intercommunalités. Statut à confirmer auprès du Département.'
- id: allier-patrimoine-rural-non-protege
  porteur:
    nom: Département de l'Allier
    siren: "220300016"
    niveau: departement
    code: "03"
  intitule: Aide aux travaux de clos et couvert sur le patrimoine rural privé non protégé (maisons bourbonnaises, locateries, maisons de bourg remarquables…)
  travaux:
  - toiture
  - facade
  - autre
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  ressources: null
  perimetre:
    communes: null
    precision: Tout le département, mais pour le patrimoine vernaculaire, seulement les édifices d'avant 1900 situés dans des communes de moins de 3 000 habitants à la date de construction.
  montant: 15 % d'une dépense plafonnée à 110 000 € TTC, plus 5 points pour un dossier labellisé par la Fondation du patrimoine et inscrit sur la liste départementale.
  conditions:
  - texte: 'Bénéficiaire : tout maître d''ouvrage privé.'
    citation: Tout maître d’ouvrage privé.
    source: 1
  - texte: Édifices vernaculaires d'avant 1900, communes de moins de 3 000 habitants, illustrant une technique locale ou une catégorie listée (dont maisons de maître, maisons paysannes, locateries, maisons de bourg remarquables).
    citation: Edifices et monuments immeubles par destination antérieurs à 1900 (sauf éléments présentant un caractère exceptionnel), situés sur des communes de moins de 3 000 habitants à la date de construction, constituant le patrimoine vernaculaire
    source: 1
  - texte: 'Dépenses : gros œuvre du clos et du couvert, et éléments intérieurs d''intérêt majeur.'
    citation: Les travaux de gros oeuvre sur le clos et/ou le couvert du patrimoine vernaculaire tel que défini au paragraphe précédent, et la restauration d'éléments architecturaux intérieurs d'intérêt majeur de ce patrimoine, à condition qu'ils soient immeubles par destination (cheminées, décors).
    source: 1
  - texte: Montant pour le patrimoine vernaculaire.
    citation: 'Taux de subvention : 15 %, une bonification de 5 % est accordée pour les dossiers labellisés par la Fondation du Patrimoine et en cas d''enregistrement sur la liste départementale, prononcée après avis de la commission consultative. Plafond subventionnable : 110 000 euros TTC.'
    source: 1
  - texte: Remboursement en cas de vente dans les dix ans.
    citation: Restituer la subvention allouée par le Département en cas de vente du bâtiment dans les dix années suivant la décision attributive de la subvention, sauf en cas d’impondérables.
    source: 1
  cumul: null
  ouverture: null
  fermeture: null
  statut: a_confirmer
  demarche:
    url: https://www.allier.fr/aide/18/1151-les-aides.htm
    guichet: Conseil départemental de l'Allier, Direction Culture et Patrimoine, Service Culture, Mission Patrimoine ; 04 70 34 14 58
    avant_travaux: null
  sources:
  - titre: 'Département de l''Allier, guide des aides : Travaux au patrimoine rural non protégé privé (session du 22 octobre 2020)'
    url: https://www.allier.fr/aide/18/1151-les-aides.htm
    date_texte: 2020-10-22
    lu_le: 2026-10-12
  anil: null
  verifie_le: 2026-10-12
  notes: 'Aide patrimoniale plutôt qu''aide au logement : elle finance le clos et le couvert d''un bâti ancien, habitation comprise (maisons bourbonnaises, maisons de maître, maisons paysannes, maisons de bourg remarquables). À garder ou non dans le registre selon son périmètre éditorial. Le texte ne dit pas si la demande doit précéder les travaux ; aucune date de fin. Fiche de 2020 encore au catalogue : statut laissé à confirmer. L''adresse électronique de contact de la fiche est nominative : non reprise.'
