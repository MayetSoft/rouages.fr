  montant: null
  conditions:
  - texte: Objet du fonds.
    citation: Ce fonds d’avance sur subvention, créé au travers du dispositif Territoire à Energie Positive pour la Croissance Verte, est destiné à soutenir financièrement les propriétaires engagés dans un projet d’amélioration de l’habitat de leur résidence principale et ne pouvant pas assurer le préfinancement des travaux.
    source: 1
  - texte: Bénéficiaires.
    citation: 'Sont éligibles les propriétaires occupants ou accédant à la propriété : - Les bénéficiaires de l’Allocation Personnalisée d’Autonomie pour des travaux d’adaptation - Les bénéficiaires de la Prestation de Compensation du Handicap – Logement - Les bénéficiaires d’une subvention de l’Agence Nationale de l’Habitat (ANAH)'
    source: 1
  - texte: Versement à tiers des subventions avancées.
    citation: Le FDAAH ne sera mis en place que pour les subventions dont l’attributaire acceptera de procéder par versement à tiers, total ou partiel, au profit du Conseil départemental.
    source: 1
  - texte: Paiement direct des artisans.
    citation: Le Conseil départemental de la Creuse procédera au versement des sommes dues au titre d’avance ou de solde de factures directement aux artisans concernés, conformément aux règles définies dans la convention signée avec le propriétaire.
    source: 1
  - texte: Le fonds est l'un des deux financements propres du Département dans le Pacte territorial France Rénov' 2025-2027.
    citation: Fonds Départemental d’Avances pour l’Amélioration de l’Habitat
    source: 2
