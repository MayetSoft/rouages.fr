  notes: 'Avant travaux, règlement p. 7 : « Les travaux ne peuvent commencer avant réception du dossier complet par le service habitat de la communauté de communes. » Ouverture : date d’application du règlement révisé (titre : « Application à compter du 1er janvier 2026 ») ; l’aide elle-même existe depuis plus longtemps (délibération 25/213 : « L’aide aux travaux de ravalement de façades est une aide financière qui existe depuis près de 15 ans. »). Avant 2026, le taux était réduit à 10 % pour les travaux sans isolation (délibération 25/213, p. 17) ; ce régime antérieur n’est pas repris ici. Formulaire en ligne seulement pour le cas « secteur monument historique sans aide Anah » ; pour les dossiers Anah, aucun formulaire distinct n’a été trouvé sur le site. Panneau de chantier fourni par la CC à apposer, à rendre sous deux mois (p. 7-8).'
