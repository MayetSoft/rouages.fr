  montant: 'Pacte territorial : logement en dégradation, 20 % des travaux HT au plus 14 000 € ; logement indigne, 15 % au plus 10 500 €. OPAH-RU : logement très dégradé ou indigne, 25 % au plus 12 500 € ; petite LHI, sécurité-salubrité ou péril, 20 % au plus 4 000 €.'
