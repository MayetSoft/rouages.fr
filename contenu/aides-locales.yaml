  - texte: Montant selon le règlement de 2018
    citation: L’aide accordée est limitée à 15% du montant H.T. du devis des travaux, joint au dossier de la demande de subvention, lorsqu'une seule façade ou un seul mur de clôture est éligible, cette aide est plafonnée à 2 000€. » (p. 2)
