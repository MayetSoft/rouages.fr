    citation: Les propriétaires bailleurs qui souhaitent réaliser des travaux dans un ou des logements qu’ils louent ou souhaitent louer. » (p. 11)
    source: 1
  - texte: Locataires, avec l’accord écrit du propriétaire
    citation: les locataires qui souhaitent adapter le logement qu’ils occupent, sous réserve d’avoir l’autorisation écrite du propriétaire et de respecter les conditions de ressources fixées par l’Anah. » (p. 11)
    source: 1
