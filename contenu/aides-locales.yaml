  - texte: Taux et plafond de dépense.
    citation: Subvention de 20 à 60 % en fonction du nombre de logements et des caractéristiques de votre copropriété (bonus de 20% possible pour les copropriétés en NPNRU). La dépense prise en compte est de 10 000 € TTC maximum.
    source: 2
