- id: aubusson-exoneration-taxe-fonciere
  porteur:
    nom: Commune d'Aubusson
    siren: "212300800"
    niveau: commune
    code: "23008"
  intitule: Exonération de la part communale de la taxe foncière pendant quinze ans pour les logements anciens rénovés en vue de leur location
  travaux:
  - energie
  - isolation
  - chauffage
  beneficiaires:
  - proprietaire-bailleur
  ressources: null
  perimetre:
    communes: null
    precision: Toute la commune.
  montant: Exonération de la part communale de la taxe foncière pendant 15 ans à compter du 1er janvier de l'année qui suit l'achèvement des travaux.
  conditions:
  - texte: Objet de l'exonération.
    citation: La commune a pris une décision forte en direction des propriétaires (personnes physiques) en décidant d’exonérer la taxe foncière (part communale) pendant 15 ans pour les logements ayant fait l’objet de travaux de rénovation thermique et énergétique en vue de leur location.
    source: 1
  - texte: Logement achevé avant 1989.
    citation: La construction du logement doit être achevée avant le 1er janvier 1989
    source: 1
  - texte: Travaux de plus de 10 000 € financés avec une subvention de l'Anah.
    citation: Le montant des travaux doit être supérieur à 10 000 euros et financés au moyen d’une subvention de l’ANAH (Agence nationale de l’Habitat)
    source: 1
  - texte: Acquisition depuis 2004.
    citation: L’ acquisition doit être faite à compter du 1er janvier 2004
    source: 1
  - texte: Durée.
    citation: L’exonération s’applique pendant une durée de quinze ans à compter du 1er janvier de l’année qui suit celle de l’achèvement des travaux d’amélioration.
    source: 1
  cumul: Suppose une subvention de l'Anah pour les travaux.
  ouverture: null
  fermeture: null
  statut: a_confirmer
  demarche:
    url: https://www.aubusson.fr/exoneration-de-la-taxe-fonciere/
    guichet: Service des impôts des particuliers d'Aubusson (déclaration accompagnée des justificatifs des dépenses)
    avant_travaux: null
  sources:
  - titre: aubusson.fr, page « Exonération de la taxe foncière »
    url: https://www.aubusson.fr/exoneration-de-la-taxe-fonciere/
    date_texte: null
    lu_le: 2026-10-17
  anil: null
  verifie_le: 2026-10-17
  notes: 'Avantage fiscal, pas une subvention. La délibération du conseil municipal n''a pas été trouvée ni lue, et la page ne cite ni sa date ni l''article du code général des impôts sur lequel elle repose : statut à confirmer. Les catégories de travaux (isolation, chauffage) reprennent les « exemples de dépenses éligibles » de la page. La page parle de propriétaires personnes physiques et de logements loués : rendu par proprietaire-bailleur. Creuse Grand Sud a aussi une délibération d''exonération (n° 2014-077, part intercommunale) liée depuis sa page habitat, non lue.'
