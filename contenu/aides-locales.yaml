  notes: 'Règlement adopté à l''unanimité le 22 septembre 2025 (identifiant 058-225800010-20250922-83219-DE), sans date de fin ; le rapport d''activités de juin 2026 confirme son adoption. Le PDF du recueil perd les ligatures (« a ribu on ») : citations rétablies en clair. Le règlement donne « locataires ayant eu l''accord de leur propriétaire » dans les bénéficiaires généraux, mais le volet énergie ne vise que les propriétaires occupants : le statut « locataire » est à confirmer pour ce volet. Opérateurs du volet accompagnement d''après le rapport d''activités 2025 : Soliha Nièvre-Aube (énergie, habitat indigne) et Senioralis (autonomie). Aucune fiche ANIL trouvée pour la Nièvre.'
