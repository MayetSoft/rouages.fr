  conditions:
  - texte: Logement situé dans l'une des 39 communes de l'agglomération.
    citation: Le logement doit être situé dans l’une des 39 communes de Vichy Communauté
    source: 1
  - texte: Ressources très modestes ou modestes selon les plafonds de l'Anah.
    citation: Les bénéficiaires sont les propriétaires occupants et locataires du parc privé aux ressources Très Modestes et Modestes (au sens des plafonds de ressources, définis par l’ANAH, en vigueur à la date du dépôt de la demande).
    source: 1
  - texte: Personnes de 70 ans ou plus, de 60 à 69 ans sous condition de GIR, ou en situation de handicap.
    citation: 70 ans ou plus ; De 60 à 69 ans sous condition de GIR. En situation de handicap justifiant d’un taux d’incapacité de 50% et plus, ou bénéficiant de la PCH (prestation de compensation du handicap).
    source: 1
  - texte: Montant de l'aide (p. 4).
    citation: '10 % du montant des travaux subventionnés par l’ANAH dans la limite d’un plafond de travaux subventionnable de 22 000 € HT. Subvention maximale : 2200 €.'
    source: 1
  - texte: Résidence principale ; conditions identiques à MaPrimeAdapt'.
    citation: 'Les conditions d’attribution sont identiques à celles fixées par l’ANAH pour le versement de Ma Prime Adapt, notamment : le logement doit être occupé à titre de résidence principale.'
    source: 1
  cumul: Complète MaPrimeAdapt' de l'Anah. « Vichy Communauté se réserve le droit de ne pas soutenir financièrement le dossier ou de réajuster son aide en cas de surfinancement » (p. 4).
