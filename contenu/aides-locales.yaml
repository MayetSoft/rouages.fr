- id: riom-limagne-et-volcans-opah-ru-po-habitat-indigne
  porteur:
    nom: Communauté d’agglomération Riom Limagne et Volcans
    siren: '200070753'
    niveau: epci
    code: '200070753'
  intitule: OPAH-RU multisites — complément de RLV aux aides de l’Anah pour un logement indigne ou très dégradé (propriétaires occupants)
  travaux:
  - indigne
  beneficiaires:
  - proprietaire-occupant
  ressources: plafonds Anah « modestes » et « très modestes »
  perimetre:
    communes:
    - '63300'
    - '63103'
    - '63245'
    - '63470'
    precision: 'Les quatre secteurs de l’OPAH-RU multisites : périmètre Action Cœur de Ville de Riom, périmètres Petites Villes de Demain de Châtel-Guyon, Mozac et Volvic (rues listées en annexe 1 de la convention). Seule une partie de chaque commune est concernée.'
  montant: 20 % du montant des travaux subventionnables, plafonné à 50 000 € HT de travaux, pour les propriétaires modestes et très modestes.
  conditions:
  - texte: 'Logement indigne ou très dégradé (classe A à E après travaux) et sécurité, salubrité, petite LHI (classe F ou G après travaux) : même taux.'
    citation: '1- Lutte contre l’habitat indigne ou très dégradé – classe A à E après travaux, RLV abonde de : • 20% du montant des travaux subventionnables plafonné à 50 000 € HT pour les propriétaires très modestes, • 20% du montant des travaux subventionnables plafonné à 50 000 € HT pour les propriétaires modestes.'
    source: 1
  - texte: Sécurité et salubrité, petite LHI.
    citation: '2- Lutte contre l’habitat indigne, Travaux pour la sécurité et la salubrité dans l’habitat ou petite LHI – classe F ou G après travaux, RLV abonde de :'
    source: 1
  - texte: Écrêtement à 100 % du coût TTC, sur l’aide de RLV.
    citation: Le cumul de l’ensemble de financement ne pourra dépasser 100% du cout des travaux TTC. En cas d’écrêtement, c’est la subvention de RLV qui sera minorée.
    source: 1
  - texte: Durée de l’opération.
    citation: Elle portera ses effets pour les demandes de subvention déposées auprès des services de l'Anah du 01/09/2024 au 31/08/2029.
    source: 1
  - texte: Travaux non commencés, minimum de travaux, occupation trois ans.
    citation: Ne pas avoir commencé les travaux et les faire réaliser par des professionnels du bâtiment. Avoir un minimum de travaux envisagés de 1 000 € HT.
    source: 2
  cumul: Complément des aides de l’Anah ; le total des financements ne peut dépasser 100 % du coût TTC, l’aide de RLV étant réduite en premier.
