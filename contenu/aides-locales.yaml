  montant: Jusqu'à 50 % du montant prévisionnel HT de l'assistance à maîtrise d'ouvrage et 40 % des travaux d'économie d'énergie, plafonné à 6 000 € HT par logement ; aides publiques cumulées limitées à 80 % d'une même assiette.
  conditions:
  - texte: Taux et plafond appliqués par la commission permanente du 3 avril 2023.
    citation: L'aide de la Région peut représenter jusqu'à 50 % du montant prévisionnel HT pour l'assistance à maîtrise d'ouvrage et 40 % pour la réalisation de travaux d'économie d'énergie, plafonnée à 6 000 euros HT par logement. Le cumul des aides Région et de tout autre aide publique ne dépasse pas 80 % d'une même assiette éligible.
    source: 1
  - texte: Aide versée au syndic pour le compte du syndicat des copropriétaires.
    citation: La subvention est attribuée au syndic Agestys pour le compte du Syndicat de la copropriété de la Résidence La Clairière.
    source: 1
  cumul: Aides publiques cumulées limitées à 80 % d'une même assiette éligible.
  ouverture: null
  fermeture: null
  statut: fermee
  demarche:
    url: null
    guichet: Espaces conseil France Rénov' de Nouvelle-Aquitaine, 0 808 800 700 ; centre de ressources Coachcopro
    avant_travaux: null
  sources:
  - titre: Région Nouvelle-Aquitaine, commission permanente du 3 avril 2023, rubrique « Rénovation énergétique de l'habitat privé et du logement social »
    url: https://www.nouvelle-aquitaine.fr/linstitution/le-conseil-regional/les-commissions-permanentes/commission-permanente-du-3-avril-2023
    date_texte: 2023-04-03
    lu_le: 2026-10-17
  anil: null
  verifie_le: 2026-10-17
  notes: 'Le règlement de l''appel à projets n''a pas été lu : le lien du règlement 2024 sur les-aides.nouvelle-aquitaine.fr renvoie une erreur 404, et aucun règlement 2025 n''a été trouvé. Les taux viennent de la page de la commission permanente du 3 avril 2023 (source 1), seul texte régional lu ; le relevé de décisions légalisé en PDF qu''elle lie n''a pas été lu. Des éditions 2024 et 2025 ont existé ; selon les résultats de recherche, une fiche de la DREAL Nouvelle-Aquitaine de 2026 (non ouverte : 403) dit que l''appel à projets 2025 « Soutien à la rénovation globale et performante des copropriétés » n''est pas prolongé en 2026 et le réservait aux copropriétés de moins de 50 lots pour les travaux. Statut fermee pour l''édition 2023 ; l''absence d''édition 2026 reste à confirmer auprès de la Région. La source 1 nomme des syndics professionnels (personnes morales), pas des personnes physiques.'
- id: puy-de-dome-colibri-proprietaire-occupant-tres-modeste
  porteur:
    nom: Département du Puy-de-Dôme
    siren: '226300010'
    niveau: departement
    code: '63'
  intitule: Fonds Habitat « Colibri » — avances sans intérêt et subventions modulables pour l'amélioration du logement des propriétaires occupants très modestes
  travaux:
  - indigne
  - energie
  - adaptation
  beneficiaires:
  - proprietaire-occupant
  ressources: plafonds Anah « très modestes »
  perimetre:
    communes: null
    precision: Le règlement intérieur ne pose aucune restriction territoriale à l'intérieur du département.
  montant: Avance remboursable sans intérêt de 1 000 € à 5 000 € (demande « simple ») ou de 1 000 € à 12 000 € (demande « complexe », avec enquête sociale) ; subvention modulable de 100 € à 20 000 €, jusqu'à 30 000 € pour une rénovation lourde d'un logement très dégradé ou insalubre.
  conditions:
  - texte: Ressources « très modestes » au sens de l'Anah.
    citation: Le Fonds Habitat « Colibri » accompagne les publics aux ressources « très modestes » au sens des plafonds de l’Anah.
    source: 1
  - texte: Aide subsidiaire aux dispositifs légaux et d'action sociale, qui doivent avoir été sollicités avant.
    citation: l’intervention du Fonds Habitat « Colibri » est subsidiaire aux dispositifs financiers légaux et d'action sociale, excepté certaines fondations. Ceux-ci doivent préalablement avoir été sollicités.
    source: 1
  - texte: Logement de plus de quinze ans, décent après travaux.
    citation: dans le cadre d’un projet d’amélioration ou de construction et après travaux, le logement doit pouvoir satisfaire aux caractéristiques du logement décent définies par le décret décence en vigueur ; l'octroi d'une aide pour un projet d'amélioration est conditionné au fait que le logement ait plus de 15 ans ;
    source: 1
  - texte: 'Demande « simple » : avance seule.'
    citation: Dans le cadre d’un projet de travaux, la Commission plénière peut proposer une avance modulable de 1 000 € à 5 000 € remboursable sans intérêt avec un différé possible d’un an.
    source: 1
  - texte: 'Demande « complexe » (enquête sociale) : avance plus élevée.'
    citation: Dans le cadre d’un projet de travaux (hors construction neuve), la Commission plénière peut proposer une avance modulable de 1 000 € à 12 000 € remboursable sans intérêt avec possibilité d’un différé d’un an.
    source: 1
  - texte: Subvention modulable, soumise à une enquête sociale.
    citation: Dans le cadre d’un projet de travaux (hors construction neuve), la Commission plénière peut proposer une subvention modulable de 100 € à 20 000 €.
    source: 1
  - texte: Rénovation lourde d'un logement très dégradé ou insalubre, avec maîtrise d'œuvre.
    citation: Dans le cadre d’un projet de travaux (hors construction neuve), la Commission plénière peut proposer une subvention modulable jusqu’à 30 000 €.
    source: 1
  - texte: Occupation en résidence principale.
    citation: occuper le logement aidé à titre de résidence principale selon les critères définis par l’Anah ;
    source: 1
  cumul: Les subventions et les avances modulables d'une demande « complexe » se cumulent ; l'aide est subsidiaire aux autres dispositifs, qui doivent avoir été sollicités avant elle.
