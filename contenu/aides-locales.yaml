- id: nievre-fname
  porteur:
    nom: Département de la Nièvre
    siren: "225800010"
    niveau: departement
    code: "58"
  intitule: Fonds nivernais d'aide à la maîtrise de l'énergie (FNAME) — aide aux petits travaux et aux travaux d'économie d'énergie des ménages en précarité énergétique
  travaux:
  - energie
  - isolation
  - chauffage
  - diagnostic
  beneficiaires:
  - proprietaire-occupant
  - locataire
  - proprietaire-bailleur
  ressources: plafonds Anah « modestes » et « très modestes » de l'occupant ; taux d'effort énergétique supérieur à 10 % ou comportement de privation
  perimetre:
    communes: null
    precision: Le logement « doit être situé dans le département de la Nièvre ».
  montant: Aide décidée en commission sur le reste à charge, plafonnée à 1 000 € pour les petits travaux et petits équipements et à 5 000 € dans tous les cas ; pour un propriétaire bailleur, au plus 50 % du reste à charge et 2 500 €.
  conditions:
  - texte: Publics bénéficiaires.
    citation: 'Le Fonds Nivernais d’Aide à la Maîtrise de l’Énergie (FNAME) s’adresse aux : propriétaires occupants, locataires, y compris étudiants, ménages logés à titre gratuit ou usufruitiers, ménages usufruitiers ou occupant d’un logement en indivision, propriétaires bailleurs de logements occupés'
    source: 1
  - texte: Ressources.
    citation: Pour bénéficier de l’aide financière le plafond de ressources de l’occupant doit être inférieur ou égal à la grille établie annuellement par l'ANAH pour le public dit « modeste » et « très modeste ».
    source: 1
  - texte: Taux d'effort énergétique.
    citation: Pour déclencher une visite le Taux d’Effort Énergétique doit être supérieur à 10 % ou, si inférieur, des éléments d’appréciation quant à un comportement de privation doivent être apportés.
    source: 1
  - texte: Occupation du logement.
    citation: Le propriétaire occupant ou le locataire devra occuper les lieux depuis plus de six mois en période hivernale. Le logement concerné doit être celui de sa résidence principale et doit être situé dans le département de la Nièvre.
    source: 1
  - texte: Plafond petits travaux.
    citation: Dans le cas de la réalisation de petits travaux ou de mise en place de petits équipements (a, b, c), l’aide sera plafonnée à 1 000 €.
    source: 1
  - texte: Plafond général.
    citation: Le plafond de l’aide du FNAME reste à 5 000 € dans tous les cas.
    source: 1
  - texte: Reste à charge minimal du ménage.
    citation: La part à charge finale à régler par le ménage pour financer ses travaux est au minimum de 25 % du RAC lorsque le Département et le SIEEEN financent l’aide attribuée ou au minimum de 5 % du RAC lorsque l’EPCI contribue également au financement.
    source: 1
  - texte: Propriétaires bailleurs.
    citation: Pour les propriétaires-bailleurs privés, l’aide appliquée sur des dépenses de travaux, d’équipements ou de matériels pourra atteindre au maximum 50 % du reste à charge et ne dépassera pas 2 500 €.
    source: 1
  - texte: Devis obtenus avant la décision de la commission.
    citation: C’est aussi pour répondre à cet objectif que les devis doivent être obtenus avant la décision de la commission et qu’ils doivent prioritairement être produits par des entreprises RGE.
    source: 1
  - texte: Financement partagé avec le SIEEEN et les intercommunalités (fonds en activité en 2025-2026).
    citation: 10 Communautés de Communes abondent désormais le FNAME en contribuant financièrement à hauteur de 20 % du montant décidé en commission
    source: 2
  cumul: Cumulable avec les autres aides (Anah, collectivités, prêts) ; « Il n'y aura pas de possibilité de sur-financement » ; l'aide est calculée après déduction de toutes les autres aides.
  ouverture: null
  fermeture: null
  statut: ouverte
  demarche:
    url: https://nievre.fr/au-quotidien/logement/parcours-de-renovation/
    guichet: Agence locale de l'énergie et du climat de la Nièvre, Espace Conseil France Rénov', 13 avenue Pierre Bérégovoy, 58000 Nevers ; 03 86 38 22 21 (détection par un référent social ou énergie, visite à domicile, décision de la commission d'orientation et de suivi du FNAME).
    avant_travaux: true
  sources:
  - titre: 'Département de la Nièvre, Conseil départemental du 28 novembre 2022, délibération « FNAME – évolution du dispositif » et « Règlement du dispositif – 2023 » (recueil, p. 638-644)'
    url: https://nievre.fr/wp-content/uploads/2023/01/CD_20221128_recueil_DEL_reduit.pdf
    date_texte: 2022-11-28
    lu_le: 2026-10-17
  - titre: Département de la Nièvre, Conseil départemental du 16 février 2026, compte rendu de délégation FNAME et OPAH pour 2025, annexe 3 (recueil, p. 195-205)
    url: https://nievre.fr/wp-content/uploads/2026/02/CD_20260216_Recueil-DELIB-RGPD.pdf
    date_texte: 2026-02-16
    lu_le: 2026-10-17
  anil: null
  verifie_le: 2026-10-17
  notes: 'Règlement « 2023 » adopté le 28 novembre 2022, sans date de fin ; la délibération du 16 février 2026 rend compte de 17 dossiers en 2025 et parle au présent de l''abondement des intercommunalités : statut « ouverte » sur cette base, un règlement plus récent n''a pas été trouvé. Le fonds est cofinancé par le SIEEEN (parts égales avec le Département) et par les intercommunalités adhérentes (20 % de l''aide quand elles contribuent) : Cœur de Loire, Haut Nivernais Val d''Yonne, Tannay Brinon Corbigny, Nivernais Bourbonnais, Puisaye-Forterre, Bazois Loire Morvan, Loire et Allier, Les Bertranges, Nevers Agglomération, Sud Nivernais, Morvan Sommets et Grands Lacs (liste de février 2026) ; aucune de ces intercommunalités n''a été enregistrée comme porteur distinct. L''aide peut aussi prendre la forme de matériels, de conseils et d''un suivi : seul le volet financier est décrit ici.'
- id: cchnvy-fonds-facades
  porteur:
    nom: Communauté de communes Haut Nivernais Val d'Yonne
