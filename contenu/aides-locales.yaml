- id: puy-de-dome-colibri-copropriete
  porteur:
    nom: Département du Puy-de-Dôme
    siren: '226300010'
    niveau: departement
    code: '63'
  intitule: Fonds Habitat « Colibri » — aide à l'audit énergétique et aux travaux de rénovation des copropriétés, avec bonus par ménage modeste
  travaux:
  - copropriete
  - energie
  - diagnostic
  beneficiaires:
  - copropriete
  ressources: bonus selon les plafonds Anah « modestes » et « très modestes »
  perimetre:
    communes: null
    precision: Le règlement intérieur ne pose aucune restriction territoriale à l'intérieur du département.
  montant: 'Audit énergétique collectif : 75 % des honoraires, plafonné à 3 000 € HT par copropriété ; travaux : de 1 000 € à 3 000 € ; bonus par ménage : 2 000 € (très modestes), 1 000 € (modestes) ; au plus 100 000 € par copropriété.'
  conditions:
  - texte: Immeuble affecté pour 75 % au moins à l'habitation principale, logements de plus de quinze ans, AMO agréée et dossier MaPrimeRénov' Copropriété.
    citation: Les bénéficiaires doivent être accompagnés par une assistance à maitrise d’ouvrage agréée par l’Anah et l’aide de Rénov’actions63 intervient en cofinancement du dossier Ma Prime Rénov Copro ;
    source: 1
  - texte: Au moins 35 % de gain énergétique.
    citation: Dans le cadre d’une demande de subvention de travaux, les demandeurs doivent s’engager à réaliser des travaux de performance énergétique (générant au moins 35 % de gain énergétique) ;
    source: 1
  - texte: Audit.
    citation: 'Subvention pour l’audit énergétique collectif : une aide de 75 % du montant des honoraires de l’audit, plafonnée à 3 000 € HT est accordée par copropriété.'
    source: 1
  - texte: Travaux et bonus.
    citation: 'Subvention aux travaux selon la performance énergétique du projet, de 1 000 € à 3 000 € selon la proposition de la commission plénière du Fonds Habitat « Colibri » - Un bonus par ménage est accordé selon le niveau de ressources de l’Anah : - Ressources très modestes : 2 000 € - Ressources modestes : 1 000 €'
    source: 1
  - texte: Plafond par copropriété.
    citation: Le montant total de l’aide ne pourra excéder 100 000 € par copropriété (subvention + bonus).
    source: 1
  - texte: Travaux non commencés avant la décision du Département.
    citation: Les travaux ne doivent pas avoir débuté avant la décision de la Commission Permanente du Conseil départemental du Puy-de-Dôme.
    source: 1
  cumul: Cumulable avec les autres dispositifs, dans la limite de 80 % d'aides publiques.
