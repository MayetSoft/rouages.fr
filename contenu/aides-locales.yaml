  sources:
  - titre: Département de la Creuse, fiche « Aide complémentaire et exceptionnelle à la rénovation énergétique de l'habitat privé – année 2024 » (délibération de l'Assemblée départementale du 11 avril 2024)
    url: https://www.creuse.fr/IMG/pdf/fiche_aide_re_2024.pdf
