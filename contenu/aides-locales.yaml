    citation: La dépense est plafonnée à 10 000 € TTC pour les missions obligatoires.
    source: 1
  - texte: Plafonds des missions optionnelles (réunion).
    citation: 400 € TTC pour une réunion supplémentaire
    source: 1
  - texte: Plafonds des missions optionnelles (étanchéité à l'air).
    citation: 1 500 € TTC pour un test d’étanchéité à l’air
    source: 1
  - texte: Plafonds des missions optionnelles (thermographie).
    citation: 400 € TTC pour une thermographie
    source: 1
  - texte: Copropriétés éligibles.
    citation: 'Pour demander une aide effilogis Copropriétés, la copropriété doit : être située en Bourgogne-Franche-Comté avoir plus de 15 ans compter une majorité de logements (résidences principales) être inscrite sur le registre national d’immatriculation des copropriétés'
    source: 1
  - texte: Contenu minimal de l'audit.
    citation: '1 scénario BBC global : scénario de travaux d’entretien et d’amélioration adapté à la copropriété lui permettant d''atteindre le niveau BBC en une étape (étiquette énergie A ou B),'
    source: 1
  - texte: Auditeur référencé.
    citation: 'L’auditeur choisi doit être référencé sur le site france-renov.gouv.fr (RGE : Audit énergétique des bâtiments tertiaires et/ou habitations collectives)'
