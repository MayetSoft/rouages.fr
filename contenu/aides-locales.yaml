- id: le-creusot-plan-couleurs
  porteur:
    nom: Commune du Creusot
    siren: "217101534"
    niveau: commune
    code: "71153"
  intitule: 'Plan couleurs du Creusot : subvention municipale au ravalement des façades'
  travaux:
  - facade
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  - copropriete
  - locataire
  ressources: aucune condition de ressources
  perimetre:
    communes:
    - "71153"
    precision: 'Immeubles situés sur les rues et numéros listés par la page (rues Maréchal Foch, des Martyrs de la Libération, des Lamineurs, Anatole France, du Grenouiller, Saint-Charles, de l''Yser, des Puddleurs) : une partie de la commune seulement.'
  montant: 30 % du coût HT des travaux de ravalement, plafonné à 2 000 € par (co)propriétaire de logements distincts.
  conditions:
  - texte: Aide cumulable, sur un périmètre de rues.
    citation: Il consiste en l’attribution d’une aide pour les propriétaires qui rénovent la façade de leur immeuble situé dans un certain périmètre. Cette dernière est cumulable avec d’autres aides publiques telles que les subventions de l’OPAH ou de l’ANAH.
    source: 1
  - texte: Dépôt jusqu'au 31 décembre 2026.
    citation: Les dossiers de demande de subvention peuvent être déposés jusqu’au 31 décembre 2026.
    source: 1
  - texte: Montant (règlement de 2022).
    citation: Le montant de la subvention est fixé à 30 % du coût Hors Taxe des travaux de ravalement. Ce montant est plafonné à deux mille euros (2 000 €) par (co)propriétaire de logements distincts.
    source: 2
  - texte: Pas de condition de ressources.
    citation: Aucune condition de ressources n’est exigée pour l’octroi de la subvention.
    source: 2
  - texte: Copropriétés de plus de 10 logements exclues ; une subvention par immeuble sur 10 ans.
    citation: Les copropriétés supérieures à 10 logements sont exclues du dispositif.
    source: 2
  - texte: Travaux après notification et autorisation d'urbanisme.
    citation: Les travaux de ravalement de façades ne peuvent commencer qu’après la délivrance de la notification de subvention et l’autorisation d’urbanisme correspondante.
    source: 2
  cumul: Cumulable avec les aides de l'OPAH ou de l'Anah.
  ouverture: null
  fermeture: 2026-12-31
  statut: ouverte
  demarche:
    url: https://www.le-creusot.fr/creative/evironnement-et-cadre/plan-couleur/
