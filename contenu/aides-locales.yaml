  notes: 'Texte de la CC fixant cette aide non trouvé : la page « Aides à l’habitat » du site de la CC ne donne que le dépliant France Rénov’Allier, l’ancienne page /fr/aides répond 404, et les listes de délibérations 2023 à 2026 en ligne ne contiennent aucun règlement d’aides aux particuliers (seulement le pacte territorial France Rénov’ 2025-2029, délibérations des 15 janvier et 10 avril 2025, qui ne fixe aucun montant). Le montant vient du guide publié par la commune de Lapalisse (date tirée des métadonnées du PDF, mai 2022 ; barème Anah de 2022), qui présente les aides de la CC. Le rapport d’activités 2025 confirme que la CC accorde des aides pendant le PIG (« opérationnel depuis novembre 2017 ») sans en donner le montant. À confirmer auprès de la CC : montant et conditions en vigueur en 2026, et maintien de l’aide depuis l’entrée dans le pacte territorial France Rénov’ 2025-2029. Écart : le guide présente l’aide aux occupants et aux bailleurs ; l’ANIL aux seuls occupants bénéficiaires de l’Anah, avec une injonction du SPANC. Type de travaux « autre » (assainissement).'
