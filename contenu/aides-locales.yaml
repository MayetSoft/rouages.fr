- id: puy-de-dome-colibri-bailleur-conventionne
  porteur:
    nom: Département du Puy-de-Dôme
    siren: '226300010'
    niveau: departement
    code: '63'
  intitule: Fonds Habitat « Colibri » — subvention aux propriétaires bailleurs conventionnés Anah (Loc 2 ou Loc 3) en intermédiation locative
  travaux:
  - energie
  - indigne
  beneficiaires:
  - proprietaire-bailleur
  ressources: null
  perimetre:
    communes: null
    precision: Le règlement intérieur ne pose aucune restriction territoriale à l'intérieur du département.
  montant: 'Travaux d''amélioration : 10 % des dépenses éligibles plafonnées à 60 000 € HT, soit 6 000 € au plus (15 % si l''étiquette B est atteinte) ; travaux lourds : 15 % des dépenses plafonnées à 80 000 € HT, soit 12 000 € au plus (20 % si l''étiquette B est atteinte) ; maîtrise d''œuvre : 1 500 €, dans la limite de 50 % de la dépense HT.'
  conditions:
  - texte: Conventionnement Anah Loc 2 ou Loc 3, intermédiation locative en mandat de gestion, accompagnement social des locataires.
    citation: conventionnement avec l’Anah. L’aide Colibri ne sera attribuée que dans le cadre d’un conventionnement de loyers Loc 2 et/ou Loc 3 ; mise en location de leur logement en intermédiation locative, en mandat de gestion ; avec un accompagnement social de proximité des locataires par un travailleur social diplômé d’État.
    source: 1
  - texte: Étiquette D au moins après travaux.
    citation: Les travaux devront permettre d’atteindre l’étiquette énergétique D.
    source: 1
  - texte: Travaux d'amélioration.
    citation: 'Projet de travaux d’amélioration : 6 000 € maximum, soit 10 % du montant des dépenses éligibles plafonnées à 60 000 € HT, sur les montants des travaux retenus par l’Anah. L’aide pourra être de 15 % du montant HT des dépenses éligibles si l’étiquette B est atteinte'
    source: 1
  - texte: Travaux lourds.
    citation: 'Projet de travaux lourds : 12 000 € maximum, soit 15 % du montant des dépenses éligibles plafonnées à 80 000 € HT, sur les montants des travaux retenus par l’Anah. L’aide pourra être de 20 % du montant HT des dépenses éligibles si l’étiquette B est atteinte'
    source: 1
  - texte: Maîtrise d'œuvre.
    citation: 'Subvention pour une mission de maîtrise d’œuvre : 1 500 €, dans la limite de 50 % de la dépense engagée HT.'
    source: 1
  - texte: Plafond lié à l'aide de l'intercommunalité ; trois logements sur cinq ans.
    citation: Dans le cas où l’EPCI participe au financement des travaux, l’aide Colibri ne peut pas excéder le montant du financement de l’EPCI.
    source: 1
  - texte: Location six ans au loyer conventionné.
    citation: louer le logement aidé pendant six ans au niveau de loyers défini lors du conventionnement Anah ;
    source: 1
  cumul: Si l'intercommunalité finance les travaux, l'aide du Département ne peut pas dépasser la sienne ; jusqu'à trois logements sur cinq années consécutives.
