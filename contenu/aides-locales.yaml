# Les aides locales à la rénovation du logement — voir src/modele/aides-locales.ts.
#
# Chaque aide est écrite depuis le texte de la collectivité qui la porte :
# délibération, règlement d'aides, convention d'opération, formulaire. La base
# « Aides locales aux travaux » de l'ANIL sert à savoir quels textes lire ;
# rien n'en est repris, et chaque aide renvoie à sa fiche (`anil`).
#
# Règles, contrôlées par `npm run valider` :
# - un montant ne s'écrit qu'avec la citation, mot pour mot, du texte qui le
#   fixe (`conditions[].citation`, `source` = rang dans `sources`) ; sans
#   texte trouvé, `montant: null` et `statut: a_confirmer` ;
# - `perimetre.communes` : null si l'aide vaut sur tout le territoire du
#   porteur, sinon les codes INSEE des communes, et `precision` dit ce qui
#   fixe ce périmètre ;
# - aucune personne nommée : des services et des guichets ;
# - `verifie_le` : au-delà d'un an, l'aide s'affiche « à revérifier ».
aides_locales:
- id: allier-precarite-energetique-proprietaire-occupant
  porteur:
    nom: Département de l'Allier
    siren: "220300016"
    niveau: departement
    code: "03"
  intitule: Complément départemental aux aides de l'Anah pour la rénovation énergétique (propriétaires occupants)
  travaux:
  - energie
  beneficiaires:
  - proprietaire-occupant
  ressources: plafonds Anah « modestes » et « très modestes »
  perimetre:
    communes: null
    precision: La fiche ne pose aucune restriction territoriale à l'intérieur du département. Voir notes.
  montant: 15 % du montant des travaux subventionnés par l'Anah, aide plafonnée à 1 500 € (ménages modestes) ou 2 500 € (ménages très modestes) ; pas de dossier pour une aide inférieure à 100 €.
  conditions:
  - texte: 'Bénéficiaires : propriétaires occupants modestes ou très modestes au sens de l''Anah (et propriétaires bailleurs, voir l''entrée dédiée).'
    citation: Propriétaires occupants aux revenus modestes ou très modestes selon les critères de l’Anah et les propriétaires bailleurs.
    source: 1
  - texte: Être éligible aux aides de l'Anah ; aide complémentaire à une aide Anah en matière d'énergie.
    citation: Être éligible aux aides de l’Agence nationale d’amélioration de l’habitat (Anah) » ; « Aide complémentaire à celle obtenue auprès de l’Anah en matière d’énergie (MaPrimeRenov’ Parcours accompagné,…)
    source: 1
  - texte: Logement occupé en résidence principale pendant la durée définie par l'Anah.
    citation: D’occuper son logement à titre de résidence principale pendant la durée définie par l’Anah pour un propriétaire occupant ;
    source: 1
  - texte: Montant pour les propriétaires occupants.
    citation: Propriétaires occupants 15% du montant des travaux subventionnés par l’Anah plafonnés à 1 500 € d’aide pour des ménages aux revenus modestes et 2 500 € pour des ménages aux revenus très modestes.
    source: 1
  - texte: Seuil minimal d'aide.
    citation: ne seront pas pris en compte que les projets susceptibles d’impliquer une aide du département inférieure 100 €.
    source: 1
  - texte: Demande avant le début des travaux ; c'est la date de dépôt du dossier Anah qui compte.
    citation: Ne pas démarrer les travaux avant le dépôt de la demande de subvention. La date de prise en compte correspond à la date de dépôt du dossier auprès de l’Anah ou la date de demande de dérogation obtenue auprès de l’Anah.
    source: 1
  - texte: 'Délai de réalisation : celui de l''Anah.'
    citation: le demandeur dispose des délais de réalisation prévus par l’Agence nationale d’amélioration de l’habitat pour terminer les travaux (3 ans pouvant être prorogés à 5 ans).
    source: 1
  - texte: Période de validité du dispositif.
    citation: 'Validité : Début : 1er janvier 2025 Fin : 31 décembre 2029'
    source: 2
  cumul: 'Aide complémentaire à l''aide de l''Anah (obligatoirement cumulée avec elle). Le Département peut réduire ou refuser son aide si d''autres financements couvrent la dépense : « le Département se réserve le droit de ne pas soutenir financièrement le dossier ou de réajuster son aide ».'
  ouverture: 2025-01-01
  fermeture: 2029-12-31
  statut: ouverte
  demarche:
    url: https://www.allier.fr/aide/182/1151-les-aides.htm
    guichet: France Rénov' Allier, Conseil départemental, Direction de l'habitat, 1 avenue Victor Hugo, 03000 Moulins ; 04 70 34 41 84 (du mardi au vendredi, 9 h-12 h et 14 h-17 h) ; francerenovallier@allier.fr
    avant_travaux: true
  sources:
  - titre: 'Département de l''Allier, guide des aides : Lutte contre la précarité énergétique (session du 15 juillet 2024)'
    url: https://www.allier.fr/aide/182/1151-les-aides.htm
    date_texte: 2024-07-15
    lu_le: 2026-10-12
  - titre: Fiche guide des aides PDF « Lutte contre la précarité énergétique », p. 1-2 (conditions, montant) et p. 4 (validité)
    url: https://www.allier.fr/cms_viewFile.php?idtf=39248&path=aide_precarite_energetique_habitat.pdf
    date_texte: 2024-07-15
    lu_le: 2026-10-12
  - titre: allier.fr, page Lutte contre la précarité énergétique
    url: https://www.allier.fr/1780-lutte-contre-la-precarite-energetique.htm
    date_texte: null
    lu_le: 2026-10-12
  anil: https://www.anil.org/aides-locales-travaux/details/allier-aide-complementaire-a-lanah-pour-les-travaux-de-performance-energetique-2908/
  verifie_le: 2026-10-12
  notes: 'Une seule fiche départementale couvre occupants et bailleurs ; scindée ici en deux entrées parce que montant et conditions diffèrent. Délibération d''origine citée par la fiche : n° 2019-25-254. La fiche exige « Un formulaire de demande de subvention du Département » mais aucun formulaire n''est en ligne sur allier.fr (seule la fiche est en annexe) : le formulaire s''obtient a priori auprès de France Rénov'' Allier, à confirmer. Périmètre : la fiche ne dit pas « tout le département » ; aucune restriction n''y figure. La page PDH dit que le Département est délégataire des aides de l''État « sur l''ensemble de l''Allier », mais pour la période 2018-2023 : le texte de la délégation en vigueur en 2026 n''a pas été lu. La fiche ANIL parle d''un gain de deux classes énergétiques ; cette condition ne figure pas dans la fiche du Département (elle relève des règles de l''Anah) et n''est donc pas reprise.'
- id: allier-precarite-energetique-proprietaire-bailleur
  porteur:
    nom: Département de l'Allier
    siren: "220300016"
    niveau: departement
    code: "03"
  intitule: Complément départemental aux aides de l'Anah pour la rénovation énergétique d'un logement vacant remis en location (propriétaires bailleurs)
  travaux:
  - energie
  - vacance
  beneficiaires:
  - proprietaire-bailleur
  ressources: null
  perimetre:
    communes: null
    precision: La fiche ne pose aucune restriction territoriale à l'intérieur du département. Voir notes.
  montant: 5 % du montant des travaux, plafonné à 50 000 € HT de travaux par logement vacant remis en location, soit au plus 2 500 € par logement.
  conditions:
  - texte: Logement vacant depuis plus de deux ans.
    citation: Pour les propriétaires bailleurs l’aide s’applique aux travaux engagés sur des logements vacants depuis plus de 2 ans.
    source: 1
  - texte: Avec ou sans conventionnement Anah.
    citation: Avec ou sans conventionnement « Anah » du logement pour les propriétaires bailleurs.
    source: 1
  - texte: Louer le logement pendant la durée définie par l'Anah.
    citation: De louer son logement pendant la durée définie par l’Anah à compter de la date de perception de l’aide du Département ;
    source: 1
  - texte: Être éligible aux aides de l'Anah en matière d'énergie.
    citation: Aide complémentaire à celle obtenue auprès de l’Anah en matière d’énergie (MaPrimeRenov’ Parcours accompagné,…)
    source: 1
  - texte: Montant pour les bailleurs.
    citation: Propriétaires bailleurs 5% du montant des travaux plafonné à 50 000 € HT par logement vacant remis en location (soit maximum 2 500 € par logement).
    source: 1
  - texte: 'Pièce à fournir : justificatif de vacance.'
    citation: Un justificatif de vacance du logement de plus de 2 ans (attestation de la commune ou de l’intercommunalité, constat d’huissier, facture de gaz, d’eau ou d’électricité justifiant d’une absence de consommation, fermeture de compteur, attestation de clôture d’abonnement d’électricité, gaz….).
    source: 1
  - texte: Demande avant le début des travaux.
    citation: Ne pas démarrer les travaux avant le dépôt de la demande de subvention. La date de prise en compte correspond à la date de dépôt du dossier auprès de l’Anah ou la date de demande de dérogation obtenue auprès de l’Anah.
    source: 1
  - texte: Période de validité du dispositif.
    citation: 'Validité : Début : 1er janvier 2025 Fin : 31 décembre 2029'
    source: 2
  cumul: Aide complémentaire à l'aide de l'Anah ; le Département « se réserve le droit de ne pas soutenir financièrement le dossier ou de réajuster son aide » si d'autres financements couvrent la dépense.
