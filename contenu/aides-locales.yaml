  notes: 'Ce n''est pas une aide aux travaux : la demande suit les diagnostics (avant_travaux: false). Liste des communes : les deux pages allier.fr qui listent les « communes signataires du contrat RCVCB » ne concordent pas. La page frais de notaire (source 4) compte 76 communes, dont 8 absentes de celle-ci : Saint-Menoux, Tronget, Saint-Angel, Saint-Priest-en-Murat, Verneix, Saint-Léon, Hérisson, Haut-Bocage. Les deux fiches renvoient pourtant au même « périmètre des communes retenues au dispositif » : la liste de 76 est probablement la plus à jour, à confirmer auprès de France Rénov'' Allier. Aucune délibération listant les communes signataires n''a été trouvée. Graphies normalisées sur le COG : « Cressange » publié corrigé en Cressanges, « Cosne d''Allier » en Cosne-d''Allier, « Villefranche d''Allier » en Villefranche-d''Allier. Dompierre-sur-Besbre figure sous Moulins Communauté sur cette page (sous Entr''Allier Besbre et Loire sur l''autre). Montluçon, Moulins et Vichy sont exclues du RCVCB, qui les renvoie au dispositif Cœur de ville (fiche aide 23). La page allier.fr dit « il faut acquérir un logement », formule reprise par erreur de la page primo-accédants : la fiche vise le propriétaire qui met en vente. Le Mayet-de-Montagne figure dans les deux listes.'
