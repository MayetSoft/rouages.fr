  notes: 'Aide communale, hors des deux EPCI de ce lot, trouvée en cherchant les aides du Pays de Lapalisse ; à rapprocher du lot qui couvre les communes. Les deux textes publiés par la commune se contredisent : règlement (délibération du 2 juillet 2018) 15 % plafonné à 2 000 €, 20 % plafonné à 3 000 € avec menuiseries ; plaquette de mars 2022 et guide de 2022 : 30 % et 35 % plafonnés à 10 000 €. La délibération qui aurait porté les taux à 30/35 % n’a pas été trouvée : statut a_confirmer. Le règlement de 2018 couvre aussi les vitrines commerciales (hors logement). Le contact de la plaquette est une personne : seul le service est repris. La page de la ville renvoie encore à une « OPAH » de la CC, qui n’est plus en cours (le rapport 2025 de la CC parle d’un PIG depuis 2017).'
