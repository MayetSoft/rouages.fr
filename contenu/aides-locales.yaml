- id: cd71-aide-habitat-durable
  porteur:
    nom: Département de Saône-et-Loire
    siren: "227100013"
    niveau: departement
    code: "71"
  intitule: 'Aide départementale à l''habitat durable (AHD) : travaux d''économie d''énergie et énergies renouvelables'
  travaux:
  - energie
  - chauffage
  - isolation
  beneficiaires:
  - proprietaire-occupant
  - proprietaire-bailleur
  ressources: 'Propriétaires occupants (et de résidence secondaire) : plafonds « très modestes », « modestes » et « intermédiaires » de l''État, ces derniers majorés de 10 %. Propriétaires bailleurs : pas de plafond de ressources écrit, mais un DPE de G à D avant travaux et la classe C au moins après.'
  perimetre:
    communes: null
    precision: Le règlement vise les logements « en Saône-et-Loire », sans restriction à l'intérieur du département.
  montant: 'Montant forfaitaire par équipement ou par m² selon le barème : par exemple 200 € pour un chauffe-eau thermodynamique, 500 € pour une pompe à chaleur air/eau, 1 500 € pour une pompe à chaleur géothermique ou une chaudière bois, 10 €/m² pour l''isolation des planchers bas et combles perdus, 50 €/m² pour l''isolation extérieure biosourcée, 100 € ou 200 € par huisserie ; au plus 2 000 € par an et par bénéficiaire.'
  conditions:
  - texte: 'Propriétaires occupants : plafonds très modestes, modestes et intermédiaires, majorés de 10 % pour les intermédiaires ; logement de plus de 2 ans en résidence principale.'
    citation: aux propriétaires occupants ou futurs propriétaires très modestes, modestes et intermédiaires d’un appartement ou d’une maison individuelle de plus de 2 ans et justifiant de leur résidence principale en Saône-et-Loire. Pour les ménages aux revenus intermédiaires, le Département élargit le champ des publics éligibles en acceptant les ménages justifiant un revenu allant jusqu’à 10% supplémentaire du plafond de revenus intermédiaires fixé par l’Etat.
    source: 1
  - texte: Résidences secondaires, mêmes conditions de ressources.
    citation: aux propriétaires depuis plus de 2 ans de maison secondaire localisée en Saône-et-Loire, justifiant des mêmes conditions de ressources que les ménages propriétaires de résidences principales.
    source: 1
  - texte: 'Propriétaires bailleurs : DPE de G à D, travaux pour atteindre au moins la classe C ; dans la limite de l''enveloppe annuelle.'
    citation: aux propriétaires bailleurs privés depuis plus de 2 ans, d’un bien ayant un DPE compris entre G et D et réalisant des travaux permettant d’atteindre la classe C a minima.
    source: 1
  - texte: Plafond annuel et un dossier par type de travaux et par an.
    citation: Le montant des aides « habitat durable » ne peut dépasser 2 000 €/an par bénéficiaire, hors aide destinée aux récupérateurs d’eau de pluie. Chaque ménage peut déposer au maximum un dossier de demande d’aide par type de travaux chaque année.
    source: 1
  - texte: 'Barème : chauffe-eau thermodynamique.'
    citation: Chauffe-eau thermodynamique 200
    source: 1
  - texte: 'Barème : pompe à chaleur air/eau.'
    citation: Pompe à chaleur air/eau 500
    source: 1
  - texte: 'Barème : pompe à chaleur géothermique.'
    citation: Pompe à chaleur géothermique ou solarothermique 1 500
    source: 1
  - texte: 'Barème : chaudière bois.'
    citation: Chaudière bois à bûches, à plaquettes ou à granulés 1 500
    source: 1
  - texte: 'Barème : isolation des planchers bas et combles.'
    citation: Isolation des planchers bas, les combles perdus et les toits terrasses 10
    source: 1
  - texte: 'Barème : isolation par l''extérieur en matériaux biosourcés.'
    citation: Isolation par l’extérieur des murs et/ou des rampant à l’aide de matériaux biosourcés 50
    source: 1
  - texte: 'Barème : huisseries.'
    citation: Remplacement huisseries PVC ou Alu 100
    source: 1
  - texte: 'Barème : huisseries bois.'
    citation: Remplacement de huisseries Bois ou Bois / Alu 200
    source: 1
  - texte: Demande avant travaux, attendre l'accusé de réception d'Habitat 71 ; artisans RGE.
    citation: toute demande de subvention doit être déposée et instruite préalablement au démarrage des travaux
    source: 2
  - texte: Accusé de réception obligatoire avant de commencer.
    citation: il est obligatoire d’attendre l’accusé de réception envoyé par « Habitat 71 » autorisant le demandeur à débuter les travaux sous peine de non-paiement de la subvention
    source: 2
  - texte: Date d'application du règlement.
    citation: Ce règlement est en mis en application à compter du 1er avril 2024.
    source: 2
  - texte: Plafonds de ressources de 2026 publiés.
    citation: Plafonds applicables au 01/01/2026
    source: 3
  cumul: 'Non cumulable avec MaPrimeRénov'' Parcours accompagné ; cumulable avec MaPrimeRénov'' et les aides des autres organismes : « Ces aides ne sont pas cumulables avec l’aide « MaPrimeRénov’ParcoursAccompagné ». Elles peuvent être versées en complément des aides MaPrimeRenov et les aides de tous les autres organismes. »'
  ouverture: 2024-04-01
  fermeture: null
  statut: ouverte
  demarche:
    url: https://www.saoneetloire.fr/guide-des-aides/aides-departementale-de-lhabitat-durable-ahd/
    guichet: Habitat 71 – Maison départementale de l'habitat et du logement (MDHL-ADIL 71), 94 rue de Lyon, CS 20440, 71040 Mâcon Cedex ; 03 85 39 30 70 ; contact@habitat71.fr. Département, Service Logement, Espace Duhesme, 18 rue de Flacé, 71026 Mâcon Cedex ; 03 85 39 56 09
    avant_travaux: true
  sources:
  - titre: 'Département de Saône-et-Loire, guide des aides : Aides départementale de l''Habitat durable (AHD), page publiée le 17/06/2024, plafonds de ressources 2026'
    url: https://www.saoneetloire.fr/guide-des-aides/aides-departementale-de-lhabitat-durable-ahd/
    date_texte: 2024-06-17
    lu_le: 2026-10-17
  - titre: Règlement des aides habitat durable, Assemblée départementale du 28 mars 2024 (PDF)
    url: https://www.saoneetloire.fr/app/uploads/2024/06/Aides_Logement_AHD_2024.pdf
    date_texte: 2024-03-28
    lu_le: 2026-10-17
  - titre: Habitat 71, page Rénovation énergétique | Aides habitat durable (plafonds applicables au 01/01/2026)
    url: https://www.habitat71.fr/renovation-energetique-aides-habitat-durable-9.html
    date_texte: null
    lu_le: 2026-10-17
  anil: https://www.anil.org/aides-locales-travaux/details/saone-et-loire-aide-habitat-durable-2939/
  verifie_le: 2026-10-17
  notes: 'Le barème complet compte une vingtaine de lignes (solaire, poêles, inserts, photovoltaïque 500 €/kWc couplé au chauffage, VMC double flux, dépose de cuve à fioul, test d''étanchéité, raccordement à un réseau de chaleur) : seules quelques lignes sont reprises dans le montant. Le règlement prévoit aussi une aide de 1 000 € pour une cuve enterrée de récupération des eaux pluviales de plus de 3 000 litres, hors plafond de 2 000 € et réservée aux propriétaires occupants : non reprise ici (ce ne sont pas des travaux de rénovation du logement). Les coordonnées du service logement diffèrent entre le PDF de 2024 (Direction de l''insertion par l''emploi et le logement, 03 85 39 56 31) et la page web (Direction appui ressources transversales aux solidarités, 03 85 39 56 09) : la page, plus récente, est retenue. La page signale un incident sur la plateforme de dépôt en ligne. Le SIREN du Département (227100013) est relevé dans les données essentielles des marchés publics du dépôt ; l''API recherche-entreprises n''a pas répondu depuis cet environnement.'
