    citation: Pour la Communauté de Communes de la Septaine, les aides financières concernent les logements situés sur les 15 communes membre de la Communauté de Communes, sauf conditions particulières associées au dispositif façade.
    source: 1
  - texte: Logement achevé depuis plus de 15 ans, dans la limite des crédits annuels.
    citation: Sont éligibles, les logements privés compris dans le périmètre de l’OPAH et dans la limite des crédits annuels disponibles, achevés depuis plus de 15 ans au moins à la date de notification de la décision d’octroi de l’aide
    source: 1
  - texte: Rénovation d'ampleur avec gain de deux classes et accompagnement « Mon Accompagnateur Rénov' » (financé par la Communauté de communes).
    citation: L’accompagnement MAR par le prestataire OPAH est financé par la Communauté de communes La Septaine (gratuité pour le ménage).
    source: 1
  - texte: 'Base de calcul : devis HT des travaux subventionnables par l''Anah.'
    citation: Le calcul du montant de la subvention est réalisé sur la base des devis HT des travaux subventionnables par l’ANAH.
    source: 1
  - texte: 'Taux propriétaires occupants (tableau de l''article 4) : 7 % pour la rénovation d''ampleur, ménages très modestes et modestes, suivant plafonds Anah ; changement de système de chauffage décarboné non éligible.'
    citation: Travaux de lutte contre la précarité énergétique « rénovation d’ampleur » — Très modeste, Modeste — 7% — Suivant plafonds ANAH ; Travaux de lutte contre la précarité énergétique « Changement de système de chauffage décarboné » — Non éligible
    source: 1
  - texte: 'Taux propriétaires bailleurs (tableau de l''article 4).'
    citation: Travaux de lutte contre la précarité énergétique « rénovation d’ampleur » — 7 % ; Travaux de lutte contre la précarité énergétique « Changement de système de chauffage décarboné » — Non éligible
    source: 1
  - texte: Pas de travaux avant le dépôt du dossier Anah ; artisans RGE.
    citation: Ne pas avoir commencé les travaux avant d’avoir déposé le dossier d’aide auprès de l’ANAH.
    source: 1
  - texte: Durée de l'opération.
    citation: La durée de la convention est fixée pour une durée de 3 ans.
    source: 1
