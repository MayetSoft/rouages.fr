  notes: 'Aucun montant : le règlement d''aides de la communauté de communes n''a pas été trouvé en ligne. La convention du Pacte territorial France Rénov'' 2025-2027 dit que chaque EPCI partenaire « intervient selon son propre règlement au titre des aides individuelles complémentaires à l''Anah » (article 5.1.3). La page parle encore d''un programme départemental sans date ; à confirmer auprès du service habitat (adresse électronique publiée par le Département : habitat@cco23.fr). La même convention signale une étude pré-opérationnelle d''OPAH-RU en cours en 2025 : rien de plus trouvé.'
