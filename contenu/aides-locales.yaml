    citation: Signer un contrat de maitrise d’œuvre.
    source: 1
  - texte: Montant.
    citation: 15% du montant HT des travaux subventionnés par l’Anah plafonnés à 40 000 € porté à 50 000 € en cas de maîtrise d’œuvre uniquement pour les propriétaires occupants
    source: 1
  - texte: Demande avant le début des travaux.
    citation: Ne pas démarrer les travaux avant le dépôt de la demande de subvention. La date de prise en compte correspond à la date de dépôt du dossier auprès de l’Anah ou la date de demande de dérogation obtenue auprès de l’Anah.
    source: 1
  - texte: Période de validité du dispositif.
    citation: 'Validité : Début : 1er janvier 2025 Fin : 31 décembre 2029'
    source: 2
