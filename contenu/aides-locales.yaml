  notes: 'Avant travaux : « Les travaux ne doivent pas avoir démarré avant le dépôt de la demande de subvention auprès de l’ANAH. » (règlement, p. 4). Le Mayet-de-Montagne : oui, l''aide vaut sur les 39 communes (règlement p. 3) et la convention du Pacte cite Le Mayet-de-Montagne parmi les communes de son périmètre (p. 15). Le règlement de juin 2025 ne fixe pas de date de fin : il met en œuvre le Pacte territorial France Rénov'' 2025-2029, qui « portera ses effets pour les demandes de subvention déposées auprès des services de l''Anah du 01/01/2025 [...] au 31/12/2029 » (convention, p. 56). La fermeture indiquée est donc celle du Pacte. Délibération exécutoire le 13 juin 2025. Pièces : formulaire de demande édité par Vichy Communauté, justificatifs, RIB (p. 4). Délai de travaux : trois ans à compter de l''agrément Anah, prorogeable deux ans.'
