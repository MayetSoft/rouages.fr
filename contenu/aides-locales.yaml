- id: allier-appareil-independant-granules
  porteur:
    nom: Département de l'Allier
    siren: "220300016"
    niveau: departement
    code: "03"
  intitule: Aide à l'installation d'un poêle, insert ou cuisinière à granulés
  travaux:
