  - texte: Définition du primo-accédant.
    citation: Est entendue comme primo-accédante toute personne n'ayant pas été propriétaire de sa résidence principale au cours des deux années précédant l'acquisition faisant objet de la présente demande de subvention.
    source: 1
  - texte: Moment de la demande.
