# Veille sur les sources de données.
#
# Ce projet se périme par ses sources, pas par son code. En une seule journée de
# travail, trois ruptures ont été rencontrées : l'interface Hub'Eau figée à 2018,
# BANATIC qui a refait son site et perdu son ancienne adresse de téléchargement,
# et l'export SISPEA dont l'URL change de forme selon le millésime. Aucune n'a
# produit d'alerte : elles ont été découvertes à la main, par hasard.
#
# Chaque source déclare donc ici le signal le moins coûteux qui soit réellement
# actionnable — pas un ping qui répond « 200 » pendant que la donnée dort depuis
# huit ans.
surveillances:
  - id: banatic-referentiel
    nom: "BANATIC — référentiel des compétences"
    alimente: "les compétences transférées à l'intercommunalité"
    type: banatic-competences
    licence: licence-ouverte-2.0
    url: "https://www.banatic.interieur.gouv.fr/consultation/api/referentiel/competence/all"
    lien: od-banatic

  - id: banatic-export
    nom: "BANATIC — export national des groupements"
    alimente: "le rattachement de chaque commune à ses groupements"
    type: disponibilite
    licence: licence-ouverte-2.0
    url: "https://www.banatic.interieur.gouv.fr/consultation/api/export/pregenere/telecharger/France"
    lien: od-banatic

  - id: ofgl-communes
