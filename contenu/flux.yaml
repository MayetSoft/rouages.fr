# Ce qui circule : l'argent, surtout. Les ordres de grandeur sont indicatifs et
# se vérifient territoire par territoire dans l'open data lié.
flux:
  - id: dgf
    nom: "Dotation globale de fonctionnement"
    nature: argent
    de: etat
    vers: [commune, epci, departement]
    resume: "La dotation globale de fonctionnement : le principal versement de l'État aux collectivités, calculé par formule."
    ordre_de_grandeur: "Plusieurs dizaines de milliards d'euros par an, tous échelons confondus."
    liens: [wp-dgf, od-ofgl, cl-gouv, cgct-l2334-1]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: taxe-fonciere
    nom: "Taxe foncière"
    nature: argent
    de: citoyen
    vers: [commune, epci]
    resume: "Payée par les propriétaires, c'est la principale ressource fiscale directe du bloc communal."
    ordre_de_grandeur: "Le taux est voté chaque année par le conseil municipal et le conseil communautaire."
    liens: [wp-taxe-fonciere, sp-taxe-fonciere, od-ofgl, od-dvf]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: teom
    # Les deux moitiés tiennent : la taxe est assise sur le revenu cadastral qui
    # sert de base à la taxe foncière bâtie, et son produit ne doit pas être
    # disproportionné au coût du service. Depuis la loi de finances pour 2019, le
    # dégrèvement qui suit l'illégalité de la délibération n'est plus supporté par
    # l'État mais par la collectivité — c'est ce qui donne son poids au levier
    # « réclamation fiscale » du processus « contester une délibération ».
    nom: "Taxe d'enlèvement des ordures ménagères"
    nature: argent
    de: citoyen
    vers: [epci]
    resume: "La taxe d'enlèvement des ordures ménagères, adossée à la taxe foncière et affectée au service des déchets. Son produit ne doit pas être disproportionné au coût du service : sinon la délibération est illégale, et le dégrèvement pèse sur la collectivité."
    liens: [wp-teom, od-sinoe, collectivites-teom, bofip-teom-degrevement]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: facture-eau
    nom: "Facture d'eau"
    nature: argent
    de: citoyen
    vers: [epci, syndicat-eau, delegataire-eau, agence-eau]
    resume: "La facture d'eau finance à la fois le service, l'assainissement et les redevances de l'agence de l'eau."
    ordre_de_grandeur: "Le prix au mètre cube de chaque commune est public et comparable."
    liens: [od-sispea, eaufrance, wp-agence-eau, ce-l213-8]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: taxe-amenagement
    # Trois parts, non deux : la fiche oubliait la part régionale d'Île-de-France.
    # Le reversement de la commune à son intercommunalité a été rendu obligatoire
    # fin 2021 puis rendu facultatif un an plus tard — on n'en dit donc rien.
    nom: "Taxe d'aménagement"
    nature: argent
    de: petitionnaire
    vers: [commune, departement]
    resume: "Due à raison d’une autorisation d’urbanisme : une part communale ou intercommunale, une part départementale, et une part régionale en Île-de-France."
    liens: [sp-taxe-amenagement, code-urbanisme, collectivites-taxe-amenagement]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: contribution-sdis
    # Cinquième occurrence de la même erreur, après le SDIS et la compétence
    # « secours-incendie » : le service n'est pas dirigé par le seul préfet.
    # Les contributions, elles, sont des dépenses obligatoires (art. L1424-35).
    nom: "Contribution au SDIS"
    nature: argent
    de: departement
    vers: [sdis]
    resume: "Le département et les communes financent les pompiers ; le service intervient sous l’autorité du maire ou du préfet, selon le pouvoir de police en cause."
    liens: [wp-sdis, od-ofgl, cgct-l1424-3, cgct-l1424-35]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: contribution-communale-sdis
    # Le flux du département vers le SDIS existait ; celui des communes, qui en
    # paient l'autre part, manquait.
    nom: "Contribution communale au SDIS"
    nature: argent
    de: commune
    vers: [sdis]
    resume: "Une dépense obligatoire du budget communal, que la commune peut avoir transférée à son intercommunalité. Le conseil d'administration du service en fixe le calcul, et sa hausse annuelle est plafonnée par l'indice des prix."
    liens: [cgct-l1424-35, od-ofgl]
    verifie_le: 2026-09-23
    confiance: etabli

  - id: fonds-europeens
    nom: "Fonds européens"
    nature: argent
    de: union-europeenne
    vers: [region]
    resume: "Les fonds structurels européens sont pour l'essentiel gérés par les régions."
    liens: [europa, wp-region, europe-en-france]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: rsa-verse
    nom: "RSA"
    nature: argent
    de: departement
    vers: [citoyen]
    resume: "Le RSA est financé par le département et versé par la CAF : deux acteurs différents pour un même euro."
    liens: [code-action-sociale, caf-fr, od-ofgl, caf-rsa]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: subvention-agence-eau
    nom: "Aides de l'agence de l'eau"
    nature: argent
    de: agence-eau
    vers: [epci, syndicat-eau]
    resume: "Les redevances perçues sur les factures d'eau reviennent aux collectivités sous forme d'aides aux travaux."
    liens: [wp-agence-eau, eaufrance, ce-l213-8]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: deliberations
    nom: "Délibérations publiées"
    nature: information
    de: conseil-municipal
    vers: [citoyen, prefet]
    resume: "Les délibérations sont publiques et transmises au préfet au titre du contrôle de légalité."
    liens: [cgct, cada]
    verifie_le: 2026-09-05
    confiance: etabli

  # --- Réseaux et mobilité ------------------------------------------------
  # Les ordres de grandeur restent qualitatifs : les chiffrer commune par
  # commune demande d'ingérer l'OFGL, ce qui reste à faire (docs/05-roadmap.md).
  - id: versement-mobilite
    # Le seuil est chiffré, comme sur la fiche des employeurs : onze salariés. Et
    # « souvent plus que la recette des billets » devient une part mesurée — le
    # Cerema situe le versement à la moitié des recettes des autorités
    # organisatrices, quand le billet en couvre une part bien moindre.
    nom: "Versement mobilité"
    nature: argent
    de: employeur
    vers: [aom]
    resume: "À partir de onze salariés, les employeurs financent les transports du territoire : ce versement pèse environ la moitié des recettes des autorités organisatrices."
    ordre_de_grandeur: "Première ressource des réseaux urbains, devant la billetterie."
    liens: [wp-versement-mobilite, code-transports, od-ofgl-flux, urssaf-versement-mobilite, cerema-versement-mobilite]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: billet-transport
    # L'affirmation tient, et on s'abstient de la chiffrer : les taux de
    # couverture publiés varient fortement d'une agglomération à l'autre et selon
    # le périmètre retenu — charges d'exploitation ou coût complet. « Une part
    # minoritaire » est ce qu'on peut écrire sans se tromper.
    nom: "Titres de transport"
    nature: argent
    de: citoyen
    vers: [operateur-transport, aom]
    resume: "Ce que paie l'usager ne couvre qu'une part minoritaire du coût réel du réseau."
    liens: [code-transports, od-transport, ccomptes-usagers-transports, cerema-versement-mobilite]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: subvention-transport
    nom: "Compensation à l'exploitant"
    nature: argent
    de: aom
    vers: [operateur-transport]
    resume: "L'autorité organisatrice verse à l'exploitant la différence entre le coût du service et les recettes."
    liens: [code-transports, od-decp, ct-l2121-1, cgct-l1411-1]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: redevance-concession
    # « Aux propriétaires du réseau » devient « à l'autorité concédante », qui est
    # la même chose mais nommée comme le contrat la nomme. Les deux parts ont été
    # vérifiées : R1 pour les dépenses de structure et le contrôle, R2 en
    # contrepartie des travaux réalisés sous maîtrise d'ouvrage de l'autorité.
    nom: "Redevance de concession"
    nature: argent
    de: enedis
    vers: [syndicat-energie, commune]
    resume: "Le concessionnaire verse une redevance à l’autorité qui détient le réseau : une part finance son contrôle du contrat, l’autre les travaux qu’elle conduit elle-même."
    liens: [code-energie, fnccr, od-ofgl-flux, enedis-redevance-concession, cen-l322-4]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: cotisation-scot
    # Cinquième occurrence de la confusion conformité / compatibilité, après le
    # syndicat de SCoT, la compétence « planification-scot » et les deux fiches du
    # schéma régional.
    nom: "Cotisations au syndicat de SCoT"
    nature: argent
    de: epci
    vers: [syndicat-scot]
    resume: "Les intercommunalités financent la structure qui porte le schéma avec lequel leurs PLU devront être compatibles."
    liens: [code-urbanisme, od-ofgl-flux, cu-l131-4]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: financement-agence-urbanisme
    nom: "Financement de l'agence d'urbanisme"
    nature: argent
    de: epci
    vers: [agence-urbanisme]
    resume: "Financée conjointement par les collectivités, l'État et la région : son indépendance tient à ce partage."
    liens: [fnau, wp-agence-urbanisme, cu-l132-6]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: donnees-reseau
    nom: "Données de réseau ouvertes"
    nature: information
    de: enedis
    vers: [citoyen, commune, epci]
    resume: "Consommation, production et raccordements sont publiés commune par commune, et réutilisables."
    liens: [od-enedis, od-reseaux-energies]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: donnees-mobilite
    nom: "Données de transport ouvertes"
    nature: information
    de: operateur-transport
    vers: [citoyen, aom]
    resume: "Horaires et arrêts sont publiés dans un format standard, ce qui les rend réutilisables par n'importe qui."
    liens: [od-transport, code-transports]
    verifie_le: 2026-09-05
    confiance: etabli

  # Le malentendu le plus répandu de la fiscalité locale : ce qu'on appelle
  # « frais de notaire » est à environ 80 % de l'impôt, et cet impôt ne va pas
  # au notaire. Il va au département et aux communes.
  - id: dmto
    # Les trois parts ont été relevées dans le fichier de la DGFiP pendant le
    # travail sur les taux d'imposition : la part départementale domine, la part
    # communale suit, et l'État prélève des frais d'assiette sur la première.
    nom: "Droits de mutation"
    nature: argent
    de: citoyen
    vers: [departement, commune, notaire]
    resume: "Payés à l'achat d'un logement et collectés par le notaire : l'essentiel revient au département, une part aux communes, une autre à l'État."
    ordre_de_grandeur: "Première ressource fiscale propre des départements, et la plus sensible au marché immobilier."
    liens: [wp-mutation, cgi-1594d, cgi-1584, cgi-1595bis, impots-enregistrement, od-dmto]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: dotations-investissement
    # Deux dotations, deux préfets : la DETR se décide dans le département, la
    # DSIL dans la région. La commission d'élus fixe les priorités et les taux
    # de la DETR, mais ne choisit pas les projets.
    nom: "DETR et DSIL"
    nature: argent
    de: etat
    vers: [commune, epci]
    resume: "Les subventions d'investissement de l'État : la DETR, attribuée par le préfet de département après avis d'une commission d'élus au-delà de 100 000 €, et la DSIL, par le préfet de région."
    liens: [cgct-l2334-37, cgct-l2334-42, od-dgcl-investissement]
    verifie_le: 2026-10-01
    confiance: etabli
