# Le glossaire.
#
# Un sigle non expliqué est une porte fermée : le lecteur qui ne le connaît pas
# décroche, et c'est précisément celui pour qui le site est fait. Toute suite de
# majuscules apparaissant dans le contenu doit donc figurer ici, sans quoi la
# validation échoue — la règle s'impose d'elle-même à mesure que le réseau
# grossit.
#
# `noeud` relie le sigle à sa fiche quand elle existe.
sigles:
  - id: sigle-cada
    sigle: CADA
    developpe: "Commission d'accès aux documents administratifs"
    definition: "On la saisit gratuitement quand une administration refuse de communiquer un document."
    noeud: cada
    liens: [cada, wp-cada]

  - id: sigle-cnil
    sigle: CNIL
    developpe: "Commission nationale de l'informatique et des libertés"
    definition: "Autorité indépendante qui contrôle l'usage des données personnelles, y compris par les collectivités."
    noeud: cnil
    liens: [cnil-fr, wp-cnil]

  - id: sigle-plu
    sigle: PLU
    developpe: "Plan local d'urbanisme"
    definition: "Le règlement qui dit ce qui est constructible sur une parcelle, et comment."
    noeud: redaction-plu
    liens: [wp-plu, od-gpu]

  - id: sigle-finess
    sigle: FINESS
    developpe: "Fichier national des établissements sanitaires et sociaux"
    definition: "Le répertoire officiel des hôpitaux, cliniques et établissements médico-sociaux, avec les soins que chacun est autorisé à pratiquer."
    liens: [od-finess]

  - id: sigle-cgct
    sigle: CGCT
    developpe: "Code général des collectivités territoriales"
    definition: "Le code qui fixe ce que chaque collectivité peut faire, et ce que la loi transfère d'office à l'intercommunalité."
    liens: [cgct, cgct-l5214-16, cgct-l5216-5]

  - id: sigle-ddt
    sigle: DDT
    developpe: "Direction départementale des territoires"
    definition: "Le bras technique du préfet sur l'urbanisme, l'eau et les risques ; elle instruit encore les permis des communes sans document d'urbanisme."
    noeud: ddt
    liens: [annuaire-ddt, wp-ddt]

  - id: sigle-dreal
    sigle: DREAL
    developpe: "Direction régionale de l'environnement, de l'aménagement et du logement"
    definition: "Autorise et contrôle les installations classées : élevages, carrières, industries, méthaniseurs."
    noeud: dreal
    liens: [annuaire-dreal, wp-dreal]

  - id: sigle-anct
    sigle: ANCT
    developpe: "Agence nationale de la cohésion des territoires"
    definition: "Finance l'ingénierie des collectivités qui n'ont pas les moyens de commander une étude."
    noeud: anct
    liens: [anct-fr, wp-anct]

  - id: sigle-caue
    sigle: CAUE
    developpe: "Conseil d'architecture, d'urbanisme et de l'environnement"
    definition: "Conseil gratuit, départemental, ouvert aux particuliers comme aux communes."
    noeud: caue
    liens: [fncaue, wp-caue]

  - id: sigle-plui
    sigle: PLUi
    developpe: "Plan local d'urbanisme intercommunal"
    definition: "Le même document, écrit à l'échelle de l'intercommunalité plutôt que de la commune."
    liens: [wp-plu, od-banatic]

  - id: sigle-scot
    sigle: SCoT
    developpe: "Schéma de cohérence territoriale"
    definition: "Le cadre de planification d'un bassin de vie, auquel les PLU doivent se conformer."
    noeud: planification-scot
    liens: [wp-scot, code-urbanisme]

  - id: sigle-ofgl
    sigle: OFGL
    developpe: "Observatoire des finances et de la gestion publique locales"
    definition: "Publie les recettes et les dépenses de chaque collectivité, comparables entre elles."
    liens: [od-ofgl, od-ofgl-flux]

  - id: sigle-rsa
    sigle: RSA
    developpe: "Revenu de solidarité active"
    definition: "Financé par le département, versé par la CAF."
    noeud: action-sociale
    liens: [code-action-sociale, caf-fr]

  - id: sigle-caf
    sigle: CAF
    developpe: "Caisse d'allocations familiales"
    definition: "Verse les prestations familiales et sociales, dont le RSA."
    noeud: caf
    liens: [wp-caf, caf-fr]

  - id: sigle-ccas
    sigle: CCAS
    developpe: "Centre communal d'action sociale"
    definition: "L'aide sociale de proximité, distincte de celle du département."
    noeud: ccas
    liens: [wp-ccas, unccas]

  - id: sigle-sdis
    sigle: SDIS
    developpe: "Service départemental d'incendie et de secours"
    definition: "Les pompiers : financés par le département et les communes, dirigés en opération par le préfet."
    noeud: sdis
    liens: [wp-sdis]

  - id: sigle-ars
    sigle: ARS
    developpe: "Agence régionale de santé"
    definition: "Pilote l'offre de soins d'une région : autorisations, hôpitaux, prévention."
    noeud: ars
    liens: [wp-ars, ars-gouv]

  - id: sigle-dsden
    sigle: DSDEN
    developpe: "Direction des services départementaux de l'Éducation nationale"
    definition: "L'échelon départemental de l'Éducation nationale, qui décide des ouvertures et fermetures de classes."
    noeud: rectorat
    liens: [wp-rectorat, education-gouv]

  - id: sigle-banatic
    sigle: BANATIC
    developpe: "Base nationale sur l'intercommunalité"
    definition: "Dit, pour chaque intercommunalité, quelles compétences les communes lui ont transférées."
    liens: [od-banatic]

  - id: sigle-anil
    sigle: ANIL
    developpe: "Agence nationale pour l'information sur le logement"
    definition: "Le réseau public qui renseigne gratuitement sur le logement ; chaque département a son antenne."
    liens: [anil-dalo]

  - id: sigle-teom
    sigle: TEOM
    developpe: "Taxe d'enlèvement des ordures ménagères"
    definition: "La ligne « ordures ménagères » de l'avis de taxe foncière : elle en partage la base, et son produit ne doit pas dépasser ce que coûte le service."
    liens: [collectivites-teom]

  - id: sigle-dgcl
    sigle: DGCL
    developpe: "Direction générale des collectivités locales"
    definition: "La direction du ministère de l'Intérieur qui calcule et publie chaque année la dotation de chaque commune."
    liens: [cgct-l2334-1]

  - id: sigle-drees
    sigle: DREES
    developpe: "Direction de la recherche, des études, de l'évaluation et des statistiques"
    definition: "Le service statistique des ministères sociaux : c'est lui qui chiffre l'aide sociale des départements."
    liens: [drees-aide-sociale]

  - id: sigle-sraddet
    sigle: SRADDET
    developpe: "Schéma régional d'aménagement, de développement durable et d'égalité des territoires"
    definition: "Le document par lequel la région oriente l'aménagement : ses objectifs sont pris en compte par les documents d'urbanisme, ses règles générales s'y imposent en compatibilité."
    liens: [cgct-l4251-3]

  - id: sigle-feder
    sigle: FEDER
    developpe: "Fonds européen de développement régional"
    definition: "L'argent européen des projets locaux ; en France, ce sont les conseils régionaux qui le distribuent."
    liens: [europe-en-france]

  - id: sigle-tva
    sigle: TVA
    developpe: "Taxe sur la valeur ajoutée"
    definition: "L'impôt payé sur presque tout achat ; son taux réduit est l'une des aides au logement social."
    liens: [impots-tva]

  - id: sigle-fctva
    sigle: FCTVA
    developpe: "Fonds de compensation pour la taxe sur la valeur ajoutée"
    definition: "Le remboursement par l'État d'une partie de la TVA qu'une collectivité a payée sur ses investissements."
    liens: [ofgl-definitions]

  - id: sigle-rei
    sigle: REI
    developpe: "Recensement des éléments d'imposition à la fiscalité directe locale"
    definition: "Le fichier annuel de la DGFiP qui donne, commune par commune, les taux et les bases de chaque impôt local."
    liens: [od-rei]

  - id: sigle-sispea
    sigle: SISPEA
    developpe: "Système d'information sur les services publics d'eau et d'assainissement"
    definition: "Le prix de l'eau et la performance du service, commune par commune."
    liens: [od-sispea]

  - id: sigle-ademe
    sigle: ADEME
    developpe: "Agence de la transition écologique"
    definition: "Anciennement Agence de l'environnement et de la maîtrise de l'énergie ; l'acronyme est resté."
    liens: [od-sinoe]

  - id: sigle-sinoe
    sigle: SINOE
    developpe: "Système d'information et d'observation de l'environnement"
    definition: "La base de l'ADEME sur les déchets ménagers, territoire par territoire."
    liens: [od-sinoe]
    confiance: a_confirmer

  - id: sigle-dvf
    sigle: DVF
    developpe: "Demandes de valeurs foncières"
    definition: "Le prix des ventes immobilières réellement conclues, parcelle par parcelle."
    liens: [od-dvf]

  - id: sigle-fnccr
    sigle: FNCCR
    developpe: "Fédération nationale des collectivités concédantes et régies"
    definition: "Regroupe les collectivités qui possèdent les réseaux d'énergie, d'eau et de télécommunications."
    liens: [fnccr]

  - id: sigle-notre
    sigle: NOTRe
    developpe: "Nouvelle organisation territoriale de la République"
    definition: "La loi de 2015 qui a redistribué une large part des compétences entre les échelons."
    liens: [wp-loi-notre]

  - id: sigle-dgfip
    sigle: DGFiP
    developpe: "Direction générale des Finances publiques"
    definition: "Tient les comptes des collectivités et recouvre l'impôt local."
    liens: [od-actes-budgetaires, od-ofgl]

  - id: sigle-bodacc
    sigle: BODACC
    developpe: "Bulletin officiel des annonces civiles et commerciales"
    definition: "L'annexe du Journal officiel où paraissent les immatriculations, modifications, ventes de fonds et radiations des entreprises inscrites au registre du commerce, et leurs procédures collectives."
    liens: [od-bodacc, dila-api-bodacc, wp-bodacc]

  - id: sigle-dila
    sigle: DILA
    developpe: "Direction de l'information légale et administrative"
    definition: "L'administration qui publie le Journal officiel et le BODACC."
    liens: [dila-api-bodacc]

  - id: sigle-sirene
    sigle: SIRENE
    developpe: "Système informatisé du répertoire national des entreprises et des établissements"
    definition: "Le répertoire que tient l'INSEE : chaque entreprise y a un numéro, et chacun de ses établissements le sien."
    liens: [insee-def-sirene, od-sirene-ods, insee-sirene-variables]

  - id: sigle-sru
    sigle: SRU
    developpe: "Solidarité et renouvellement urbains"
    definition: "La loi de 2000 dont l'article 55 impose 20 ou 25 % de logements sociaux à certaines communes, sous peine de prélèvement."
    noeud: logement-social
    liens: [wp-loi-sru, cch-l302-5, od-sru]

  - id: sigle-lls
    sigle: LLS
    developpe: "Logement locatif social"
    definition: "L'unité comptée par l'inventaire SRU : un logement conventionné, loué sous plafond de ressources."
    liens: [od-sru, wp-hlm]

  - id: sigle-cgi
    sigle: CGI
    developpe: "Code général des impôts"
    definition: "Le code qui fixe l'assiette et le taux de chaque impôt, dont les droits payés sur une vente immobilière."
    liens: [wp-cgi, cgi-1594d]

  - id: sigle-dmto
    sigle: DMTO
    developpe: "Droits de mutation à titre onéreux"
    # Pas de `noeud` : un flux est une arête du réseau, pas une fiche. Renvoyer
    # vers le notaire ferait atterrir sur le collecteur plutôt que sur l'impôt.
    definition: "L'impôt payé à l'achat d'un logement, collecté par le notaire et reversé au département et aux communes."
    liens: [wp-mutation, cgi-1594d, od-dmto]

  - id: sigle-mdph
    sigle: MDPH
    developpe: "Maison départementale des personnes handicapées"
    definition: "Le guichet unique où se dépose une demande liée au handicap, et où une commission décide des droits."
    noeud: mdph
    liens: [wp-mdph, code-action-sociale]

  - id: sigle-apa
    sigle: APA
    developpe: "Allocation personnalisée d'autonomie"
    definition: "Versée par le département après 60 ans, pour rester chez soi ou payer une partie de l'hébergement."
    noeud: apa
    liens: [wp-apa, sp-apa]

  - id: sigle-ter
    sigle: TER
    developpe: "Transport express régional"
    definition: "Les trains et cars du quotidien, dont la région décide les lignes, les horaires et les tarifs."
    noeud: transport-regional
    liens: [wp-ter, code-transports]

  - id: sigle-pmi
    sigle: PMI
    developpe: "Protection maternelle et infantile"
    definition: "Le service départemental de santé de la mère et de l'enfant, gratuit jusqu'à six ans."
    noeud: pmi
    liens: [wp-pmi, code-action-sociale]

  - id: sigle-dalo
    sigle: DALO
    developpe: "Droit au logement opposable"
    definition: "Le droit de faire reconnaître par une commission que l'État doit vous reloger, quand l'attente dépasse le délai fixé dans le département."
    liens: [wp-droit-logement, code-construction]

  - id: sigle-msa
    sigle: MSA
    developpe: "Mutualité sociale agricole"
    definition: "Le régime de protection sociale des exploitants et salariés agricoles : elle instruit et verse ce que la caisse d'allocations familiales verse ailleurs."
    liens: [sp-rsa, code-action-sociale]

  - id: sigle-ppr
    sigle: PPR
    developpe: "Plan de prévention des risques"
    definition: "Établi par le préfet ; une fois approuvé, il vaut servitude et interdit ou conditionne la construction dans les zones qu'il délimite."
    noeud: prevention-risques
    liens: [ce-l562-4, wp-ppr]

  - id: sigle-dicrim
    sigle: DICRIM
    developpe: "Document d'information communal sur les risques majeurs"
    definition: "Ce que le maire doit établir et porter à la connaissance des habitants : les risques encourus, l'alerte et les consignes."
    noeud: information-risques
    liens: [ce-l125-2, georisques-obligations]

  - id: sigle-ddrm
    sigle: DDRM
    developpe: "Dossier départemental sur les risques majeurs"
    definition: "L'inventaire, établi par le préfet, des risques auxquels chaque commune du département est exposée."
    liens: [georisques-obligations, code-environnement]

  - id: sigle-ial
    sigle: IAL
    developpe: "Information des acquéreurs et des locataires"
    definition: "L'état des risques que le vendeur ou le bailleur doit fournir, désormais dès l'annonce immobilière."
    liens: [decret-ial, errial]

  - id: sigle-gaspar
    sigle: GASPAR
    developpe: "Gestion assistée des procédures administratives relatives aux risques"
    definition: "La base du ministère qui recense, commune par commune, les risques, les arrêtés de catastrophe naturelle et les plans de prévention."
    liens: [od-gaspar, georisques]

  - id: sigle-errial
    sigle: ERRIAL
    developpe: "État des risques réglementés pour l'information des acquéreurs et des locataires"
    definition: "Le service de l'État qui pré-remplit l'état des risques à partir d'une adresse."
    liens: [errial, decret-ial]

  - id: sigle-scdl
    sigle: SCDL
    developpe: "Socle commun des données locales"
    definition: "Les formats communs que les collectivités emploient pour publier leurs délibérations, leurs subventions ou leurs marchés en données ouvertes."
    liens: [scdl-deliberations]

  - id: sigle-pcs
    sigle: PCS
    developpe: "Professions et catégories socioprofessionnelles"
    definition: "La nomenclature de l'INSEE qui classe les professions. Son premier chiffre donne huit grands groupes, des agriculteurs aux retraités."
    liens: [od-pcs-insee]

  - id: sigle-insee
    sigle: INSEE
    developpe: "Institut national de la statistique et des études économiques"
    definition: "Il produit le recensement, d'où viennent les populations légales, et tient le code officiel géographique qui nomme et numérote les communes."
    liens: [od-insee-populations]

  - id: sigle-waldec
    sigle: WALDEC
    developpe: "Web des associations librement déclarées"
    definition: "L'application par laquelle les préfectures enregistrent les associations depuis 2009. Elle a donné son nom au fichier du répertoire national et à sa nomenclature des objets sociaux."
    liens: [od-rna, waldec-nomenclature]

  - id: sigle-cnig
    sigle: CNIG
    developpe: "Conseil national de l'information géographique"
    definition: "Il fixe le format dans lequel les collectivités versent leurs documents d'urbanisme au Géoportail. C'est son standard qui distingue un document opposable d'un document seulement approuvé."
    liens: [cnig-plu, od-gpu]

  - id: sigle-qpc
    sigle: QPC
    developpe: "Question prioritaire de constitutionnalité"
    definition: "Le moyen, pour une partie à un procès, de faire juger par le Conseil constitutionnel qu'une loi déjà en vigueur porte atteinte à ses droits. La question passe deux filtres avant de l'atteindre."
    noeud: poser-une-qpc
    liens: [ordonnance-qpc, cc-qpc-questions]

  - id: sigle-actes
    sigle: ACTES
    developpe: "Aide au contrôle de légalité dématérialisé"
    definition: "Le système par lequel les collectivités transmettent leurs actes au préfet ; sa nomenclature en neuf familles classe chaque délibération."
    liens: [ordonnance-publicite-actes, scdl-deliberations]

  - id: sigle-ore
    sigle: ORE
    developpe: "Agence des opérateurs de réseaux d'énergie"
    definition: "Association des gestionnaires de réseaux de distribution d'électricité et de gaz, qui en publie les données de consommation."
    liens: [od-agence-ore]
