    partagee_avec: [region, conseil-regional]
    banatic: ["4000", "4005"]
    # La loi NOTRe la transfère de plein droit depuis le 1er janvier 2017. Les
    # EPT en sont exclus : dans le Grand Paris, c'est la métropole qui l'exerce,
    # ce que confirme le registre — aucun des onze EPT ne la déclare.
    obligatoire_pour: [CC, CA, CU, METRO, MET69]
    liens: [cgct, cgct-l5214-16, cgct-l5216-5, vp-competences, wp-loi-notre, cgct-l1511-2]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: logement-social
