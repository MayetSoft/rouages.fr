    verifie_le: 2026-09-12
    confiance: etabli

  # 5 % de couverture seulement, et c'est correct — l'inverse du cas de la
  # concession électrique. Là-bas, un registre à 15 % dans un département contre
  # 94 % en France signale un registre incomplet. Ici, 5 % est le chiffre réel :
  # l'article L2223-1 oblige chaque commune à disposer d'un cimetière, donc
  # presque aucune ne le transfère. Le silence du registre veut bien dire « la
  # commune », et l'heuristique de couverture, qui compare le département à la
  # moyenne nationale et non à 100 %, ne s'y trompe pas.
  - id: cimetiere
    nom: "Cimetière et sites cinéraires"
    nom_court: "Cimetière"
    acteur: commune
    resume: "Chaque commune doit disposer d'un cimetière, et à partir de 2 000 habitants d'un site cinéraire. Le conseil municipal en fixe le règlement et le prix des concessions."
    partagee_avec: [maire, epci]
    banatic: ["2500"]
    # La Métropole du Grand Paris déclare bien ce code à BANATIC, et le site la
    # nomme donc pour Paris. En conclure qu'elle gère le Père-Lachaise serait
    # faux : déclarer la compétence n'est pas gérer chaque cimetière. C'est le
    # cas où la réserve compte le plus, parce que la réponse est exacte et
    # l'inférence naturelle qu'on en tire ne l'est pas.
    # Rédigée à la troisième personne : la même phrase sert au panneau, qui
    # s'adresse à un habitant, et à la page de la commune, qui parle d'elle.
    reserve: "Chaque commune doit disposer de son cimetière : une intercommunalité qui déclare cette compétence ne gère pas forcément celui-là. Le crématorium est encore autre chose, souvent porté par un syndicat distinct."
    liens: [wp-cimetiere, sp-concession-funeraire, cgct-l2223-1]
    verifie_le: 2026-09-12
    confiance: etabli

  - id: reseaux-numeriques
    nom: "Réseaux de communications électroniques"
    nom_court: "Numérique et fibre"
    acteur: commune
    resume: "Là où aucun opérateur privé ne déploie, une collectivité peut construire le réseau elle-même puis le confier à un exploitant : c'est ainsi qu'une grande partie de la fibre rurale existe."
    partagee_avec: [epci, departement, region, etat]
    banatic: ["7530"]
    liens: [wp-reseau-initiative-publique, arcep-connexion, od-arcep-cartes, cgct-l1425-1]
    verifie_le: 2026-09-12
    confiance: etabli

  # --- Ce que l'État délègue à des professions ------------------------------
  - id: authentification-actes
    # Les deux moitiés sont vérifiées : la force probante jusqu'à inscription de
    # faux tient de l'article 1371 du code civil, et la force exécutoire dispense
    # le créancier d'obtenir un jugement avant de faire exécuter — ce que l'acte
    # sous seing privé ne permet pas.
    nom: "Donner force authentique à un acte"
    nom_court: "Acte authentique"
    acteur: notaire
    resume: "Vente, succession, donation, contrat de mariage : l'acte authentique fait foi jusqu'à inscription de faux et s'exécute sans passer par un juge."
    partagee_avec: [citoyen, etat, tribunal-judiciaire]
    liens: [wp-notaire, annuaire-notaires, cciv-1371]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: execution-decisions
    nom: "Signifier et exécuter une décision de justice"
    nom_court: "Exécution d'un jugement"
    acteur: commissaire-justice
    resume: "Un jugement gagné ne s'applique pas tout seul : il faut le faire signifier puis exécuter, et cela ne peut passer que par un commissaire de justice."
    # Quand le débiteur résiste, le commissaire de justice requiert le concours de
    # la force publique auprès du préfet, et ce sont la police ou la gendarmerie
    # qui l'exécutent. L'État est tenu de le prêter ; son refus ouvre droit à
    # indemnisation.
    partagee_avec: [citoyen, tribunal-judiciaire, prefet, gendarmerie, police-nationale]
    liens: [wp-commissaire-justice, annuaire-commissaires-justice, code-organisation-judiciaire, cpce-l122-1, ordonnance-commissaires-justice, cpce-concours, anil-concours]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: bornage
    # Même nuance que sur la fiche du géomètre-expert : son monopole est réel,
    # mais ce qui « fait foi » entre voisins est le procès-verbal qu'ils signent,
    # non le plan seul.
    nom: "Fixer la limite d'une propriété"
    nom_court: "Bornage"
    acteur: geometre-expert
    resume: "Le cadastre sert l’impôt, pas la propriété : il ne délimite rien juridiquement. Seul le géomètre-expert peut fixer une limite, et c’est le procès-verbal signé par les voisins qui les engage."
    partagee_avec: [citoyen, petitionnaire, commune, dgfip]
    liens: [wp-geometre-expert, ordre-geometres, code-urbanisme, loi-geometres-1946]
    verifie_le: 2026-09-22
    confiance: etabli

  # --- Le département : ce qu'on touche sans le savoir ----------------------
  # « Protection de l'enfance et PMI » ne faisait qu'une fiche pour deux
  # services qui n'ont ni le même guichet, ni le même déclencheur, ni le même
  # juge : on y arrive par une information préoccupante d'un côté, par une
  # consultation gratuite de l'autre. La fiche groupée est remplacée par les
  # deux qui suivent.
  - id: rsa
    # Les trois guichets ont été vérifiés séparément : le département décide et
    # finance, la caisse verse pour son compte, et depuis 2025 l'allocataire est
    # inscrit à France Travail puis orienté vers qui l'accompagnera.
    nom: "Revenu de solidarité active"
    nom_court: "RSA"
    acteur: departement
    resume: "Le département décide et finance, la caisse d'allocations familiales verse, France Travail accompagne : trois guichets pour une seule allocation."
    partagee_avec: [citoyen, caf, france-travail, president-departement, etat]
    liens: [wp-rsa, sp-rsa, code-action-sociale, caf-rsa, ft-inscription-2025]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: apa
    # La précision ajoutée est celle qui décide d'un refus : l'allocation ne
    # couvre que les groupes 1 à 4 de la grille nationale. Les degrés 5 et 6,
    # c'est-à-dire une autonomie encore large, n'y ouvrent pas droit, et beaucoup
    # de dossiers se heurtent là.
    nom: "Allocation personnalisée d'autonomie"
    nom_court: "Autonomie (APA)"
    acteur: departement
    resume: "Pour rester chez soi ou payer une partie de l’hébergement après 60 ans : une équipe médico-sociale du département évalue la perte d’autonomie, et l’aide s’arrête aux quatre premiers degrés sur six."
    partagee_avec: [citoyen, president-departement, ccas]
