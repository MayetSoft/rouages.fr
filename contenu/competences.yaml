    # distinctes — prise en compte des objectifs, compatibilité avec les règles
    # générales (art. L4251-3) — et il ne vise le PLU directement qu'en l'absence
    # de SCoT. La chaîne est SRADDET, puis SCoT, puis PLU.
    nom: "Aménagement du territoire"
    acteur: region
    resume: "Le schéma régional n’est pas un règlement : ses objectifs doivent être pris en compte, ses règles générales respectées en compatibilité — et il atteint le plan communal par l’intermédiaire du SCoT."
    # C'est le conseil régional qui adopte le schéma, par délibération, et le
    # préfet de région qui l'approuve par arrêté (art. L4251-7).
    partagee_avec: [etat, epci, conseil-regional, prefet]
    liens: [code-urbanisme, vp-competences, cgct-l4251-3, cu-l131-4, cgct-l4251-7]
