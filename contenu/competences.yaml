    nom_court: "Développement éco."
    acteur: epci
    resume: "Zones d'activité et immobilier d'entreprise pour l'intercommunalité ; la stratégie et les aides relèvent de la région."
    # La loi nomme l'assemblée elle-même : le conseil régional est seul compétent
