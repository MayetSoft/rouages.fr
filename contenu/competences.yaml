  # --- Les risques majeurs ---------------------------------------------------
  # Deux compétences distinctes, et c'est tout l'intérêt de les séparer : l'État
  # décide de la contrainte, le maire doit la faire connaître. Un habitant qui
  # ignore de quoi il relève s'adresse presque toujours au mauvais des deux.
  - id: prevention-risques
    # Vérifié mot pour mot : « le plan de prévention des risques naturels
    # prévisibles approuvé vaut servitude d'utilité publique » (art. L562-4), il
    # est annexé au plan local d'urbanisme, et le Conseil d'État juge que ses
    # prescriptions s'imposent directement aux autorisations de construire, sans
    # que le maire ait à les reprendre dans son arrêté.
    nom: "Prévention des risques naturels et technologiques"
    nom_court: "Prévention des risques"
    acteur: prefet
    resume: "Le préfet prescrit et approuve le plan de prévention ; une fois approuvé, il vaut servitude d'utilité publique et s'impose aux permis de construire."
    partagee_avec: [etat, ddt, dreal, commune, citoyen]
    liens: [ce-l562-4, georisques, wp-ppr, code-environnement]
    verifie_le: 2026-09-22
    confiance: etabli

