  # --- La région ------------------------------------------------------------
  - id: transport-regional
    # La première moitié est vérifiée mot pour mot — l'offre, les dessertes et la
    # politique tarifaire sont fixées par la région dans la convention. La seconde
    # est la mécanique même du conventionnement : la région verse une contribution
    # qui complète la recette. On n'avance pas de chiffre, faute de l'avoir vérifié.
    nom: "Trains et cars régionaux"
    nom_court: "TER et cars régionaux"
    acteur: region
    resume: "La région décide des lignes, des horaires et des tarifs, par une convention avec l’exploitant qu’elle rémunère : la recette des billets ne couvre pas le service."
    partagee_avec: [etat, operateur-transport, aom, president-region]
    liens: [wp-ter, code-transports, od-transport, ct-l2121-1]
    verifie_le: 2026-09-22
    confiance: etabli

  # Le cas d'école d'une compétence qu'un registre ne montre pas : la loi NOTRe
  # l'a transférée aux régions au 1er septembre 2017, mais l'article L3111-9 du
  # code des transports permet à la région de la confier par convention au
  # département. Une convention ne s'enregistre nulle part — comme pour
  # l'instruction des permis, la réponse exacte est trompeuse sans sa réserve.
  - id: transport-scolaire
    # Les trois affirmations tiennent : transfert aux régions par la loi NOTRe en
    # 2017, délégation possible au département ou à une commune par convention
    # (art. L1111-8 du CGCT), et le transport des élèves handicapés reste à la
    # charge du département de résidence.
    nom: "Transport scolaire"
    acteur: region
    resume: "Transféré aux régions en 2017. Beaucoup le reconfient au département par convention, et le transport des élèves handicapés lui reste de toute façon."
    partagee_avec: [departement, commune, aom, rectorat]
    reserve: "La région peut confier tout ou partie du transport scolaire au département, à une commune ou à un syndicat, par une convention qui ne figure dans aucun registre. Le transport des élèves handicapés, lui, relève du département."
    liens: [ct-l3111-9, code-transports, wp-loi-notre-2, ct-l3111-7]
    verifie_le: 2026-09-22
    confiance: etabli

