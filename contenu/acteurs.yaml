    # être suivi ailleurs qu'à France Travail change à qui l'on s'adresse.
    nom: "France Travail"
    type: service_administratif
    echelon: etat
    pouvoirs: [executif]
    releve_de: etat
    resume: "Ex-Pôle emploi : inscription, indemnisation et accompagnement. Depuis 2025, les allocataires du revenu de solidarité active y sont inscrits, puis orientés vers la structure qui les suivra — France Travail, le département ou la mission locale."
    liens: [wp-france-travail, france-travail-fr, code-travail, ft-inscription-2025]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: mission-locale
    # Le détail du financement — État, région, communes — n'a pas été retrouvé tel
    # quel dans une source publique : la fiche s'en tient donc à « l'État et les
    # collectivités territoriales », qui est ce que la source dit. La gratuité de
    # l'accompagnement, elle, est confirmée et vaut d'être écrite.
    nom: "La mission locale"
    nom_court: "Mission locale"
    type: association
    echelon: epci
    resume: "Pour les 16-25 ans sortis du système scolaire : emploi, formation, logement, santé, au même guichet, et gratuitement. Financée par l’État et les collectivités territoriales."
    liens: [wp-mission-locale, code-travail, info-mission-locale]
    verifie_le: 2026-09-22
    confiance: etabli

