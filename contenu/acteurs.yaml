    nom: "La maison départementale des personnes handicapées"
    nom_court: "MDPH"
    type: service_administratif
    echelon: departement
    # Pas de « releve_de » : un groupement d'intérêt public, personne morale à part.
    resume: "Guichet unique du handicap : c'est là que se dépose une demande, et une commission y décide des droits et des orientations."
    liens: [wp-mdph, code-action-sociale, casf-l146-3]
