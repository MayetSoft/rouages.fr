  # --- L'échelon qu'on touche sans le savoir --------------------------------
  # Le département était représenté par quatre nœuds quand l'État en comptait
  # trente-deux. C'est pourtant lui qui verse le RSA, l'allocation d'autonomie
  # et la prestation de compensation du handicap, qui protège l'enfance, qui
  # bâtit les collèges et entretient les routes. Le déséquilibre se voyait sur
  # la carte : deux colonnes presque vides là où se joue le quotidien.
  - id: president-departement
    nom: "Le président du conseil départemental"
    nom_court: "Président du département"
    type: mandat_electif
    echelon: departement
    releve_de: departement
    resume: "Élu par les conseillers départementaux, il dirige l'exécutif : c'est lui qui signe les décisions d'aide sociale et qui ordonne les dépenses."
    liens: [wp-conseil-departemental, cgct, cl-gouv, cgct-l3221-1]
    verifie_le: 2026-09-22
    confiance: etabli

