  # pas choisie. Ils sont donc des rouages, au même titre qu'un délégataire
  # d'eau ou qu'un commissaire enquêteur, qui figurent déjà ici.
  - id: notaire
    nom: "Le notaire"
    type: metier
    echelon: prive
    resume: "Officier public : il confère l'authenticité aux actes, et perçoit pour l'État, le département et les communes les droits dus sur les ventes et les successions."
    liens: [wp-notaire, annuaire-notaires, cgi-1594d, justice-notaire]
    verifie_le: 2026-09-22
