# Les nœuds du réseau : qui agit.
# Une phrase par acteur, pas davantage — le détail est sur les pages liées.
acteurs:
  # --- Vous -------------------------------------------------------------
  - id: citoyen
    nom: "Vous"
    nom_court: "Vous"
    type: personne
    echelon: citoyen
    resume: "Habitant, contribuable, électeur, usager, riverain : selon le rouage, vous n'avez pas les mêmes prises."
    liens: [vp-competences, od-datagouv]
    verifie_le: 2026-09-05
    confiance: etabli

  # --- Commune ----------------------------------------------------------
  - id: commune
    nom: "La commune"
    nom_court: "Commune"
    type: collectivite
    echelon: commune
    resume: "L'échelon de base, environ 35 000 en France, aux compétences très inégales selon ce qui a été transféré à l'intercommunalité."
    liens: [wp-commune, cgct, cl-gouv, od-ofgl]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: conseil-municipal
    nom: "Le conseil municipal"
    nom_court: "Conseil municipal"
    type: assemblee
    echelon: commune
    releve_de: commune
    resume: "Vote le budget, les délibérations et le PLU. Ses séances sont publiques et ses délibérations communicables."
    liens: [wp-conseil-municipal, cgct, od-rne]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: maire
    nom: "Le maire"
    nom_court: "Maire"
    type: mandat_electif
    echelon: commune
    releve_de: commune
    resume: "Exécutif de la commune et, pour certaines missions, agent de l'État : deux casquettes qui changent qui est responsable."
    liens: [wp-maire, cgct, od-rne]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: service-instructeur
    nom: "Le service urbanisme"
    nom_court: "Service urbanisme"
    type: service_administratif
    echelon: commune
    # Rangé sous la commune, qui signe : mutualisé ou assuré par l'État, il
    # instruit pour elle (voir la réserve de la compétence).
    releve_de: commune
    resume: "Instruit les demandes d'autorisation. Municipal, mutualisé à l'intercommunalité, ou assuré par l'État selon la taille de la commune."
    liens: [cu-r423-19, od-banatic]
    verifie_le: 2026-09-05
    confiance: variable_selon_territoire

  - id: police-municipale
    nom: "La police municipale"
    nom_court: "Police municipale"
    type: service_administratif
    echelon: commune
    releve_de: commune
    resume: "Placée sous l'autorité du maire, aux pouvoirs distincts de ceux de la police nationale ou de la gendarmerie."
    liens: [code-securite-interieure, cgct, csi-l511-1]
    verifie_le: 2026-09-22
    confiance: etabli

  # --- Intercommunalité -------------------------------------------------
  - id: epci
    nom: "L'intercommunalité"
    nom_court: "Intercommunalité"
    type: collectivite
    echelon: epci
    resume: "Communauté de communes, d'agglomération, urbaine ou métropole : exerce les compétences que les communes lui ont transférées."
    liens: [wp-epci, wp-intercommunalite, od-banatic, cgct]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: conseil-communautaire
    nom: "Le conseil communautaire"
    nom_court: "Conseil communautaire"
    type: assemblee
    echelon: epci
    releve_de: epci
    resume: "Composé d'élus municipaux, il décide sur les compétences transférées — souvent celles qui pèsent le plus sur la facture."
    liens: [wp-intercommunalite, cgct, od-rne]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: syndicat-eau
    nom: "Le syndicat des eaux"
    nom_court: "Syndicat des eaux"
    type: collectivite
    echelon: epci
    resume: "Structure intercommunale spécialisée qui capte, traite et distribue l'eau, parfois via un délégataire privé."
    liens: [od-sispea, eaufrance, cgct]
    verifie_le: 2026-09-05
    confiance: variable_selon_territoire

  # --- Département ------------------------------------------------------
  - id: departement
    nom: "Le département"
    nom_court: "Département"
    type: collectivite
    echelon: departement
    resume: "Chef de file de l'action sociale : RSA, personnes âgées, protection de l'enfance. Gère aussi les collèges et les routes départementales."
    liens: [wp-departement, cgct, vp-competences, od-ofgl]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: conseil-departemental
    nom: "Le conseil départemental"
    nom_court: "Conseil dép."
    type: assemblee
    echelon: departement
    releve_de: departement
    resume: "Assemblée élue par canton, qui vote un budget dont l'action sociale représente la plus grosse part."
    liens: [wp-conseil-departemental, od-rne, od-ofgl]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: sdis
    nom: "Les pompiers (SDIS)"
    nom_court: "Pompiers"
    type: service_administratif
    echelon: departement
    # Pas de « releve_de » : un établissement public à part, que le département
    # et les communes financent et administrent ensemble.
    # « Dirigé par le préfet » était faux d'une moitié des interventions : le
    # service agit sous l'autorité du maire ou du préfet selon le pouvoir de
    # police en cause (art. L1424-3 et L1424-4). C'est le maire qu'on trouve
    # au bout de la chaîne pour un feu communal, pas la préfecture.
    resume: "Établissement public autonome, financé par le département et les communes ; il intervient sous l'autorité du maire ou du préfet, selon le pouvoir de police en cause."
    liens: [wp-sdis, code-securite-interieure, cgct-l1424-3, cgct-l1424-35]
    verifie_le: 2026-09-22
    confiance: etabli

  # --- Région -----------------------------------------------------------
  - id: region
    nom: "La région"
    nom_court: "Région"
    type: collectivite
    echelon: region
    resume: "Lycées, formation professionnelle, transports régionaux, développement économique et aménagement du territoire."
    liens: [wp-region, cgct, vp-competences, od-ofgl]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: conseil-regional
    nom: "Le conseil régional"
    nom_court: "Conseil régional"
    type: assemblee
    echelon: region
    releve_de: region
    resume: "Assemblée élue au scrutin de liste régional. Elle adopte le schéma régional d'aménagement, que le préfet approuve, et elle seule définit les aides aux entreprises dans la région."
    liens: [wp-conseil-regional, od-rne, cgct-l4251-7, cgct-l1511-2]
    verifie_le: 2026-09-23
    confiance: etabli

  - id: ars
    nom: "L'agence régionale de santé"
    nom_court: "Agence de santé (ARS)"
    type: service_deconcentre
    echelon: region
    pouvoirs: [executif]
    # Un établissement public de l'État (code de la santé publique, L. 1432-1) :
    # il agit en région et relève de l'État — la boîte « L'État en région ».
    releve_de: etat
    resume: "Pilote l'offre de soins dans la région : autorisations d'activité, hôpitaux, prévention."
    liens: [wp-ars, ars-gouv, od-finess]
    verifie_le: 2026-09-05
    confiance: etabli

  # --- État -------------------------------------------------------------
  - id: etat
    nom: "L'État"
    nom_court: "État"
    type: collectivite
    echelon: etat
    pouvoirs: [executif]
    resume: "Fixe la règle, finance une large part des budgets locaux par dotations, et conserve les compétences régaliennes."
    liens: [cgct, vp-competences, od-ofgl, wp-separation-pouvoirs, vp-separation-pouvoirs]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: prefet
    nom: "Le préfet"
    nom_court: "Préfet"
    # Nommé en conseil des ministres, pas élu : il dirige la préfecture, service
    # déconcentré de l'État, et agit dans le département (« L'État dans le département »).
    type: service_deconcentre
    echelon: departement
    pouvoirs: [executif]
    releve_de: etat
    resume: "Représentant de l'État dans le département : ordre public, gestion de crise, et contrôle de légalité des actes des collectivités."
    liens: [wp-prefet, cgct, prefectures]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: rectorat
    nom: "Le rectorat et la DSDEN"
    nom_court: "Rectorat"
    type: service_deconcentre
    echelon: etat
    pouvoirs: [executif]
    releve_de: etat
    resume: "Services de l'Éducation nationale : enseignants, programmes, ouvertures et fermetures de classes."
    liens: [wp-rectorat, code-education, education-gouv]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: abf
    # « Parfois conforme » est la formulation juste, et elle est volontairement
    # prudente : l'accord de l'ABF lie l'autorité qui délivre le permis aux abords
    # d'un monument et en site patrimonial remarquable, quand son avis reste simple
    # ailleurs. Écrire « toujours » ou « jamais » serait faux dans les deux cas.
    nom: "L'architecte des Bâtiments de France"
    nom_court: "Bâtiments de France"
    type: service_deconcentre
    echelon: departement
    pouvoirs: [executif]
    releve_de: etat
    resume: "Rend un avis, parfois conforme, sur les projets situés en périmètre de protection du patrimoine."
    liens: [wp-abf, code-patrimoine, cpat-l632-2, cpat-l621-30]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: caf
    # Le partage est net et vaut d'être dit : le département décide et finance le
    # revenu de solidarité active, la caisse le verse pour son compte. C'est à la
    # caisse qu'on écrit pour un versement, au département pour un droit.
    nom: "La CAF"
    nom_court: "CAF"
    type: service_administratif
    echelon: etat
    # Pas de « releve_de » : un organisme de sécurité sociale de droit privé,
    # chargé d'un service public sous la tutelle de l'État, n'est pas l'État.
    pouvoirs: [executif]
    resume: "Verse les prestations familiales et sociales, dont le RSA financé par le département."
    liens: [wp-caf, caf-fr, code-action-sociale, caf-rsa]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: agence-eau
    nom: "L'agence de l'eau"
    nom_court: "Agence de l'eau"
    type: service_administratif
    echelon: etat
    pouvoirs: [executif]
    # Un établissement public de l'État, sous la tutelle du ministre de l'écologie.
    releve_de: etat
    resume: "Établissement de bassin qui perçoit des redevances sur l'eau et subventionne les travaux des collectivités."
    liens: [wp-agence-eau, code-environnement, eaufrance, ce-l213-8]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: tribunal-administratif
    nom: "Le tribunal administratif"
    nom_court: "Tribunal admin."
    type: juridiction
    echelon: etat
    pouvoirs: [judiciaire]
    releve_de: etat
    resume: "Juge les litiges entre les particuliers et l'administration, dont les recours contre les autorisations d'urbanisme."
    liens: [wp-tribunal-administratif, sp-recours-urbanisme]
    verifie_le: 2026-09-05
    confiance: etabli

  # --- Législatif : qui vote la loi ---------------------------------------
  - id: assemblee-nationale
    nom: "L'Assemblée nationale"
    nom_court: "Assemblée nationale"
    type: assemblee
    echelon: etat
    pouvoirs: [legislatif]
    releve_de: etat
    resume: "577 députés élus au suffrage universel direct : ils votent la loi et le budget de l'État, et peuvent renverser le Gouvernement."
    liens: [wp-assemblee-nationale, an-fr, vp-parlement, od-nosdeputes]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: senat
    nom: "Le Sénat"
    nom_court: "Sénat"
    type: assemblee
    echelon: etat
    pouvoirs: [legislatif]
    releve_de: etat
    resume: "348 sénateurs élus par des grands électeurs très majoritairement issus des conseils municipaux ; la Constitution lui confie la représentation des collectivités territoriales."
    liens: [wp-senat, senat-fr, constitution, od-senat]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: depute
    nom: "Le député"
    nom_court: "Député"
    type: mandat_electif
    echelon: etat
    pouvoirs: [legislatif]
    releve_de: etat
    resume: "Élu d'une circonscription pour cinq ans : il vote la loi, contrôle le Gouvernement, et reste le relais national des communes de son territoire."
    liens: [wp-depute, an-fr, od-nosdeputes]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: senateur
    nom: "Le sénateur"
    nom_court: "Sénateur"
    type: mandat_electif
    echelon: etat
    pouvoirs: [legislatif]
    releve_de: etat
    resume: "Élu pour six ans par les grands électeurs du département ; les textes portant sur l'organisation des collectivités territoriales lui sont soumis en premier."
    liens: [wp-senateur, senat-fr, constitution]
    verifie_le: 2026-09-06
    confiance: etabli

  # --- Exécutif : qui décide et qui exécute --------------------------------
  - id: president-republique
    nom: "Le président de la République"
    nom_court: "Président de la Rép."
    type: mandat_electif
    echelon: etat
    pouvoirs: [executif]
    releve_de: etat
    resume: "Élu pour cinq ans au suffrage universel direct : il nomme le Premier ministre, promulgue les lois et peut dissoudre l'Assemblée nationale."
    liens: [wp-president-republique, elysee-fr, constitution]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: gouvernement
    nom: "Le Gouvernement"
    nom_court: "Gouvernement"
    type: organe_collegial
    echelon: etat
    pouvoirs: [executif]
    releve_de: etat
    resume: "Le Premier ministre et les ministres : ils déterminent et conduisent la politique de la nation, et disposent de l'administration pour l'appliquer."
    liens: [wp-gouvernement, gouvernement-fr, constitution]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: administration-centrale
    nom: "L'administration centrale"
    nom_court: "Admin. centrale"
    type: service_administratif
    echelon: etat
    pouvoirs: [executif]
    releve_de: etat
    resume: "Les directions des ministères : elles préparent les textes, répartissent les crédits et pilotent les services déconcentrés qui appliquent la règle sur le terrain."
    liens: [wp-gouvernement, gouvernement-fr, od-annuaire-administration, charte-deconcentration]
    verifie_le: 2026-09-22
    confiance: etabli

  # --- Judiciaire : qui tranche --------------------------------------------
  # La France a deux ordres de juridiction séparés. Un litige avec une
  # administration ne va pas devant le même juge qu'un litige entre voisins,
  # et c'est la distinction la plus utile à connaître avant d'agir.
  - id: conseil-etat
    nom: "Le Conseil d'État"
    nom_court: "Conseil d'État"
    type: juridiction
    echelon: etat
    pouvoirs: [judiciaire, executif]
    releve_de: etat
    resume: "Deux fonctions à la fois : conseil juridique obligatoire du Gouvernement sur les projets de loi et d'ordonnance, et juge suprême de l'ordre administratif."
    liens: [wp-conseil-etat, conseil-etat-fr, code-justice-administrative, constitution]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: cour-de-cassation
    # Le graphe avait le sommet de l'ordre administratif et pas celui de l'ordre
    # judiciaire. Or c'est lui qui filtre toute question de constitutionnalité
    # soulevée devant un juge judiciaire.
    nom: "La Cour de cassation"
    nom_court: "Cour de cassation"
    type: juridiction
    echelon: etat
    pouvoirs: [judiciaire]
    releve_de: etat
    resume: "La plus haute juridiction de l'ordre judiciaire. Elle ne rejuge pas les faits : elle vérifie que la loi a été correctement appliquée, et filtre les questions de constitutionnalité posées devant les juges judiciaires."
    liens: [justice-cour-cassation, cc-qpc-questions, code-organisation-judiciaire]
    verifie_le: 2026-09-23
    confiance: etabli

  - id: cour-administrative-appel
    nom: "La cour administrative d'appel"
    nom_court: "Cour admin. d'appel"
    type: juridiction
    echelon: etat
    pouvoirs: [judiciaire]
    releve_de: etat
    resume: "Réexamine les jugements des tribunaux administratifs, dont ceux rendus sur les autorisations d'urbanisme, avant un éventuel pourvoi au Conseil d'État."
    liens: [wp-cour-administrative-appel, code-justice-administrative, conseil-etat-fr]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: tribunal-judiciaire
    nom: "Le tribunal judiciaire"
    nom_court: "Tribunal judiciaire"
    type: juridiction
    echelon: etat
    pouvoirs: [judiciaire]
    releve_de: etat
    resume: "Juge les litiges entre personnes privées et les infractions pénales : l'autre ordre de juridiction, distinct de celui qui juge l'administration."
    liens: [wp-tribunal-judiciaire, code-organisation-judiciaire, justice-fr, wp-ordres-juridiction]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: cour-comptes
    nom: "La Cour des comptes"
    nom_court: "Cour des comptes"
    type: juridiction
    echelon: etat
    pouvoirs: [judiciaire]
    releve_de: etat
    resume: "Juge les comptes publics et contrôle l'emploi des fonds, en assistant le Parlement comme le Gouvernement ; les chambres régionales font ce travail pour les collectivités."
    liens: [wp-cour-comptes, ccomptes, code-juridictions-financieres, constitution]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: conseil-constitutionnel
    nom: "Le Conseil constitutionnel"
    nom_court: "Conseil constit."
    type: juridiction
    echelon: etat
    pouvoirs: [judiciaire]
    releve_de: etat
    resume: "Contrôle la conformité des lois à la Constitution, avant promulgation ou sur question prioritaire de constitutionnalité ; il n'appartient à aucun des deux ordres de juridiction."
    liens: [wp-conseil-constitutionnel, conseil-constitutionnel-fr, constitution]
    verifie_le: 2026-09-06
    confiance: etabli

  # --- Autorités indépendantes : ni exécutif, ni juge -----------------------
  # Placées par la loi hors de la hiérarchie des trois pouvoirs. Les ranger
  # sous « exécutif » parce qu'elles sont administratives dirait exactement le
  # contraire de ce qui les définit.
  - id: defenseur-des-droits
    nom: "Le Défenseur des droits"
    nom_court: "Défenseur des droits"
    type: autorite_independante
    echelon: etat
    pouvoirs: [independant]
    releve_de: etat
    resume: "Autorité inscrite dans la Constitution, que toute personne peut saisir gratuitement en cas de litige avec un service public ou de discrimination."
    liens: [wp-defenseur-droits, defenseur-droits, constitution]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: cnil
    nom: "La CNIL"
    nom_court: "CNIL"
    type: autorite_independante
    echelon: etat
    pouvoirs: [independant]
    releve_de: etat
    resume: "Contrôle l'usage des données personnelles, y compris par les administrations et les collectivités, et peut être saisie par toute personne concernée."
    liens: [wp-cnil, cnil-fr, loi-aai, wp-aai]
    verifie_le: 2026-09-06
    confiance: etabli

  # --- Le guichet de proximité ---------------------------------------------
  - id: france-services
    nom: "France services"
    nom_court: "France services"
    type: service_administratif
    echelon: commune
    resume: "Guichet unique où l'on est accompagné pour les démarches de plusieurs administrations à la fois : impôts, retraite, allocations, permis."
    liens: [wp-france-services, france-services-gouv, od-annuaire-administration]
    verifie_le: 2026-09-06
    confiance: etabli

  # --- Sécurité : qui intervient, et sur quel territoire --------------------
  # Gendarmerie et police nationale ne se partagent pas les tâches mais la
  # carte : l'une en zone rurale et périurbaine, l'autre en zone urbaine. C'est
  # la première chose à savoir, et celle qu'on ignore le plus souvent.
  - id: gendarmerie
    nom: "La brigade de gendarmerie"
    nom_court: "Gendarmerie"
    type: service_deconcentre
    echelon: etat
    pouvoirs: [executif]
    releve_de: etat
    resume: "Compétente en zone rurale et périurbaine, soit environ la moitié de la population et la quasi-totalité du territoire ; on y dépose plainte comme au commissariat."
    liens: [wp-gendarmerie, annuaire-gendarmerie, sp-porter-plainte]
    verifie_le: 2026-09-11
    confiance: etabli

  - id: police-nationale
    nom: "La police nationale"
    nom_court: "Police nationale"
    type: service_deconcentre
    echelon: etat
    pouvoirs: [executif]
    releve_de: etat
    resume: "Compétente en zone urbaine, où elle remplace la gendarmerie ; distincte de la police municipale, qui dépend du maire et n'a pas les mêmes pouvoirs."
    liens: [wp-police-nationale, annuaire-police, sp-porter-plainte]
    verifie_le: 2026-09-11
    confiance: etabli

  # --- Les services de l'État qu'une commune rencontre vraiment --------------
  - id: ddt
    nom: "La direction départementale des territoires"
    nom_court: "DDT"
    type: service_deconcentre
    echelon: departement
    pouvoirs: [executif]
    releve_de: etat
    # Le critère n'est pas l'absence de document d'urbanisme, comme cette fiche
    # le disait, mais la population : sous dix mille habitants et hors d'une
    # intercommunalité qui les atteint, la commune peut demander gratuitement
    # l'instruction à l'État (art. L422-8). Une commune au règlement national
    # mais peuplée n'y a pas droit ; une commune dotée d'un PLU mais petite, si.
    resume: "Le bras technique du préfet sur l'urbanisme, l'eau, les risques et les routes ; sous dix mille habitants, une commune peut lui faire instruire gratuitement ses permis."
    liens: [wp-ddt, annuaire-ddt, code-urbanisme, cu-l422-8]
    verifie_le: 2026-09-22
    confiance: etabli

  - id: dreal
    nom: "La DREAL"
    nom_court: "DREAL"
    type: service_deconcentre
    echelon: region
    pouvoirs: [executif]
