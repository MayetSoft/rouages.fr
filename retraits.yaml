# Les oppositions reçues, appliquées à chaque ingestion (CLAUDE.md, « Les noms
# dans les données », condition 4).
#
# Des identifiants, jamais des noms : ce fichier est public, et y écrire le nom
# de qui demande à ne plus être nommé le nommerait une fois de plus. Les
# empreintes de conseillers sont des HMAC-SHA-256 ; la clé privée
# ROUAGES_RETRAITS_SECRET (au moins 32 octets aléatoires) ne doit jamais être
# publiée ni changée tant qu'une empreinte est conservée. Une
# demande arrive par le contact de l'éditeur (voir /signaler) ; on y inscrit
# l'identifiant et la date, et la collecte suivante cesse de nommer.
#
#   entreprises : le SIREN d'une entreprise — l'entreprise individuelle, ou la
#                 société quand c'est elle qui demande ;
#   elus        : le code INSEE de la commune et la fonction, telle que le
#                 répertoire national des élus l'écrit (« Maire »,
#                 « 2ème adjoint au Maire ») ; pour un conseiller sans
#                 fonction, la commune et l'empreinte que calcule
#                 `npx tsx scripts/retraits.ts <commune> <NOM> <Prénom> <naissance>`
#                 avec ROUAGES_RETRAITS_SECRET défini dans l'environnement.
entreprises: []
elus: []
